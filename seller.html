<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروش محصول | بازارک</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --green: #16a34a;
            --dark-green: #15803d;
            --light-green: #f0fdf4;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --danger: #dc2626;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f7f8f7;
            color: var(--text);
        }

        header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: var(--green);
            font-size: 22px;
            font-weight: bold;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text);
            font-size: 14px;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 35px auto;
            padding: 0 18px 50px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: var(--muted);
            font-size: 14px;
        }

        .form-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,.04);
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 13px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(22,163,74,.08);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .file-box {
            border: 2px dashed #cbd5e1;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            background: #fafafa;
            transition: .2s;
        }

        .file-box:hover {
            border-color: var(--green);
            background: var(--light-green);
        }

        .file-input {
            display: block;
            width: 100%;
            margin-top: 10px;
        }

        .file-name {
            display: block;
            margin-top: 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .image-preview-container {
            display: none;
            margin: 18px auto 0;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .image-preview-container.show {
            display: grid;
        }

        .image-preview-item {
            width: 100%;
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--border);
            box-shadow: 0 5px 15px rgba(0,0,0,.06);
        }

        .submit-btn {
            width: 100%;
            border: none;
            background: var(--green);
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: var(--dark-green);
        }

        .submit-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            text-align: center;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .hint {
            color: var(--muted);
            font-size: 12px;
            margin-top: 6px;
            line-height: 1.7;
        }

        @media (max-width: 600px) {
            .container {
                margin-top: 25px;
            }

            .form-card {
                padding: 18px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .image-preview-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .image-preview-item {
                height: 115px;
            }

            .page-title h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🇦🇫 بازارک</div>
    <a href="index.html" class="back-btn">← برگشت</a>
</header>

<div class="container">

    <div class="page-title">
        <h1>فروش محصول</h1>
        <p>محصول خود را در بازارک ثبت کنید</p>
    </div>

    <div id="message" class="message"></div>

    <div class="form-card">

        <form id="productForm">

            <!-- تصاویر -->
            <div class="form-group">
                <label>📷 تصاویر محصول</label>

                <div class="file-box">
                    <div>چند عکس از محصول انتخاب کنید</div>

                    <input
                        id="productImage"
                        class="file-input"
                        type="file"
                        accept="image/jpeg,image/png,image/webp"
                        multiple
                    >

                    <span id="imageName" class="file-name"></span>

                    <div class="hint">
                        فرمت‌های JPG، PNG و WEBP — حداکثر 10MB برای هر عکس
                    </div>

                    <div
                        id="imagePreviewContainer"
                        class="image-preview-container">
                    </div>
                </div>
            </div>

            <!-- عنوان -->
            <div class="form-group">
                <label for="title">عنوان محصول</label>
                <input
                    id="title"
                    type="text"
                    placeholder="مثلاً گوشی Sharp R5G"
                    required
                >
            </div>

            <!-- واتساپ -->
            <div class="form-group">
                <label for="whatsapp">شماره واتساپ</label>
                <input
                    id="whatsapp"
                    type="text"
                    placeholder="مثلاً 937XXXXXXXX"
                    required
                >
                <div class="hint">
                    نمونه: 937XXXXXXXX یا 0937XXXXXXXX یا 07XXXXXXXX
                </div>
            </div>

            <!-- قیمت -->
            <div class="row">

                <div class="form-group">
                    <label for="price">قیمت (افغانی)</label>
                    <input
                        id="price"
                        type="number"
                        min="0"
                        placeholder="5500"
                        required
                    >
                </div>

                <!-- شهر -->
                <div class="form-group">
                    <label for="city">شهر</label>
                    <select id="city" required>
                        <option value="">انتخاب شهر</option>
                        <option value="Mazar-e-Sharif">مزار شریف</option>
                        <option value="Kabul">کابل</option>
                        <option value="Herat">هرات</option>
                        <option value="Kandahar">قندهار</option>
                        <option value="Jowzjan">جوزجان</option>
                        <option value="Balkh">بلخ</option>
                        <option value="Nangarhar">ننگرهار</option>
                        <option value="Other">سایر</option>
                    </select>
                </div>

            </div>

            <!-- دسته بندی -->
            <div class="form-group">
                <label for="category">دسته‌بندی</label>

                <select id="category" required>
                    <option value="">انتخاب دسته‌بندی</option>
                    <option value="mobile">📱 موبایل</option>
                    <option value="computer">💻 کامپیوتر</option>
                    <option value="fashion">👕 لباس</option>
                    <option value="shoes">👟 کفش</option>
                    <option value="gaming">🎮 گیمینگ</option>
                    <option value="home">🏠 خانه</option>
                    <option value="tools">🔧 ابزار</option>
                    <option value="vehicle">🚗 وسایل نقلیه</option>
                </select>
            </div>

            <!-- وضعیت -->
            <div class="row">

                <div class="form-group">
                    <label for="condition">وضعیت محصول</label>

                    <select id="condition" required>
                        <option value="">انتخاب وضعیت</option>
                        <option value="new">نو</option>
                        <option value="used">کارکرده</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="stock">تعداد موجود</label>

                    <input
                        id="stock"
                        type="number"
                        min="1"
                        value="1"
                        required
                    >
                </div>

            </div>

            <!-- توضیحات -->
            <div class="form-group">
                <label for="description">توضیحات محصول</label>

                <textarea
                    id="description"
                    placeholder="مشخصات، وضعیت و توضیحات محصول را بنویسید..."
                    required
                ></textarea>
            </div>

            <button
                id="submitBtn"
                class="submit-btn"
                type="submit">
                ثبت محصول
            </button>

        </form>

    </div>
</div>

<script>
    const SUPABASE_URL =
        "https://vhiewoopyqugdxwvsbno.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // عناصر فرم
    const productForm =
        document.getElementById("productForm");

    const productImage =
        document.getElementById("productImage");

    const imageName =
        document.getElementById("imageName");

    const imagePreviewContainer =
        document.getElementById("imagePreviewContainer");

    const submitBtn =
        document.getElementById("submitBtn");

    const message =
        document.getElementById("message");


    // نمایش پیام
    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message show " + type;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    // نرمال‌سازی واتساپ
    function normalizeWhatsApp(value) {

        let number =
            String(value || "")
                .replace(/\D/g, "");

        if (number.startsWith("0093")) {
            number =
                number.substring(2);
        }

        if (number.startsWith("0")) {
            number =
                "93" + number.substring(1);
        }

        if (number.startsWith("7")) {
            number =
                "93" + number;
        }

        return number;
    }


    // بررسی واتساپ
    function isValidWhatsApp(number) {

        return /^937\d{8}$/.test(number);
    }


    // پیش نمایش چند عکس
    productImage.addEventListener("change", function () {

        const files =
            Array.from(this.files);

        imagePreviewContainer.innerHTML = "";

        imagePreviewContainer.classList.remove("show");

        if (files.length === 0) {

            imageName.textContent = "";

            return;
        }


        const maxSize =
            10 * 1024 * 1024;

        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];


        // بررسی همه عکس‌ها
        for (const file of files) {

            if (file.size > maxSize) {

                showMessage(
                    "❌ حجم هر عکس نباید بیشتر از 10MB باشد.",
                    "error"
                );

                this.value = "";

                return;
            }


            if (!allowedTypes.includes(file.type)) {

                showMessage(
                    "❌ فقط JPG، PNG یا WEBP قابل قبول است.",
                    "error"
                );

                this.value = "";

                return;
            }
        }


        imageName.textContent =
            `📎 ${files.length} عکس انتخاب شد`;


        // ساخت preview
        files.forEach(function (file) {

            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    const img =
                        document.createElement("img");

                    img.src =
                        event.target.result;

                    img.className =
                        "image-preview-item";

                    img.alt =
                        "پیش‌نمایش محصول";

                    imagePreviewContainer
                        .appendChild(img);

                    imagePreviewContainer
                        .classList.add("show");
                };


            reader.readAsDataURL(file);

        });

    });


    // بررسی کاربر
    async function checkUser() {

        const {
            data,
            error
        } = await supabaseClient
            .auth
            .getUser();


        if (error || !data.user) {

            showMessage(
                "❌ ابتدا وارد حساب خود شوید.",
                "error"
            );

            setTimeout(() => {

                window.location.href =
                    "login.html";

            }, 1500);

            return null;
        }

        return data.user;
    }


    // ساخت نام امن فایل
    function createSafeFileName(file) {

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const random =
            Math.random()
                .toString(36)
                .substring(2, 12);


        return `${Date.now()}-${random}.${extension}`;
    }


    // آپلود چند عکس
    async function uploadProductImages(
        files,
        userId
    ) {

        const imageUrls = [];


        for (const file of files) {

            const fileName =
                createSafeFileName(file);


            const filePath =
                `${userId}/${fileName}`;


            const {
                error: uploadError
            } = await supabaseClient
                .storage
                .from("product-images")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false
                    }
                );


            if (uploadError) {

                throw uploadError;
            }


            const {
                data: publicData
            } =
                supabaseClient
                    .storage
                    .from("product-images")
                    .getPublicUrl(filePath);


            if (!publicData ||
                !publicData.publicUrl) {

                throw new Error(
                    "خطا در دریافت لینک تصویر"
                );
            }


            imageUrls.push(
                publicData.publicUrl
            );
        }


        return imageUrls;
    }


    // ارسال فرم
    productForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            submitBtn.disabled = true;

            submitBtn.textContent =
                "در حال ثبت محصول...";


            try {

                // کاربر
                const user =
                    await checkUser();


                if (!user) {

                    submitBtn.disabled = false;

                    submitBtn.textContent =
                        "ثبت محصول";

                    return;
                }


                // اطلاعات فرم
                const title =
                    document
                        .getElementById("title")
                        .value
                        .trim();


                const whatsapp =
                    normalizeWhatsApp(
                        document
                            .getElementById("whatsapp")
                            .value
                    );


                const price =
                    Number(
                        document
                            .getElementById("price")
                            .value
                    );


                const category =
                    document
                        .getElementById("category")
                        .value;


                const city =
                    document
                        .getElementById("city")
                        .value;


                const condition =
                    document
                        .getElementById("condition")
                        .value;


                const stock =
                    Number(
                        document
                            .getElementById("stock")
                            .value
                    );


                const description =
                    document
                        .getElementById("description")
                        .value
                        .trim();


                // عکس‌ها
                const imageFiles =
                    Array.from(
                        productImage.files
                    );


                // اعتبارسنجی
                if (!title) {

                    throw new Error(
                        "عنوان محصول را وارد کنید."
                    );
                }


                if (!isValidWhatsApp(whatsapp)) {

                    throw new Error(
                        "شماره واتساپ معتبر نیست."
                    );
                }


                if (!price || price < 0) {

                    throw new Error(
                        "قیمت محصول را درست وارد کنید."
                    );
                }


                if (!category) {

                    throw new Error(
                        "دسته‌بندی محصول را انتخاب کنید."
                    );
                }


                if (!city) {

                    throw new Error(
                        "شهر را انتخاب کنید."
                    );
                }


                if (!condition) {

                    throw new Error(
                        "وضعیت محصول را انتخاب کنید."
                    );
                }


                if (!stock || stock < 1) {

                    throw new Error(
                        "تعداد موجودی باید حداقل 1 باشد."
                    );
                }


                if (!description) {

                    throw new Error(
                        "توضیحات محصول را وارد کنید."
                    );
                }


                if (imageFiles.length === 0) {

                    throw new Error(
                        "حداقل یک عکس برای محصول انتخاب کنید."
                    );
                }


                // آپلود همه تصاویر
                submitBtn.textContent =
                    `در حال آپلود ${imageFiles.length} عکس...`;


                const imageUrls =
                    await uploadProductImages(
                        imageFiles,
                        user.id
                    );


                // عکس اول برای سازگاری با محصولات قدیمی
                const imageUrl =
                    imageUrls[0];


                // اطلاعات محصول
                const productData = {

                    title: title,

                    description: description,

                    price: price,

                    category: category,

                    city: city,

                    image_url: imageUrl,

                    image_urls: imageUrls,

                    seller_id: user.id,

                    status: "active",

                    condition: condition,

                    stock: stock,

                    whatsapp: whatsapp
                };


                // ثبت در دیتابیس
                submitBtn.textContent =
                    "در حال ذخیره محصول...";


                const {
                    error
                } = await supabaseClient
                    .from("products")
                    .insert(productData);


                if (error) {

                    throw error;
                }


                // موفقیت
                showMessage(
                    "✅ محصول با موفقیت ثبت شد.",
                    "success"
                );


                // پاک کردن فرم
                productForm.reset();

                imageName.textContent = "";

                imagePreviewContainer.innerHTML = "";

                imagePreviewContainer
                    .classList.remove("show");


                // انتقال بعد از ثبت
                setTimeout(() => {

                    window.location.href =
                        "products.html";

                }, 1500);


            } catch (error) {

                console.error(
                    "Product creation error:",
                    error
                );


                showMessage(
                    "❌ " +
                    (
                        error.message ||
                        "خطایی هنگام ثبت محصول رخ داد."
                    ),
                    "error"
                );


                submitBtn.disabled = false;

                submitBtn.textContent =
                    "ثبت محصول";
            }

        }
    );

</script>

</body>
</html>
