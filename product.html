<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>جزئیات محصول | بازارک</title>

    <meta
        name="description"
        content="جزئیات محصول در بازارک"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7f6;
            color: #17211d;
            line-height: 1.7;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* HEADER */

        header {
            background: white;
            border-bottom: 1px solid #e4e9e6;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #087a55;
            white-space: nowrap;
        }

        /* SEARCH */

        .search {
            flex: 1;
            display: flex;
            background: #f1f4f2;
            border-radius: 12px;
            overflow: hidden;
        }

        .search input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 13px 16px;
            font-size: 14px;
        }

        .search button {
            border: none;
            background: #087a55;
            color: white;
            padding: 0 22px;
        }

        .search button:hover {
            background: #055c40;
        }

        /* HEADER LINKS */

        .header-links {
            display: flex;
            gap: 18px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .header-links a {
            transition: .2s;
        }

        .header-links a:hover {
            color: #087a55;
        }

        /* CONTAINER */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px;
        }

        /* BREADCRUMB */

        .breadcrumb {
            margin-bottom: 20px;
            color: #718079;
            font-size: 14px;
        }

        .breadcrumb a {
            color: #087a55;
            font-weight: bold;
        }

        /* PRODUCT */

        .product {
            background: white;
            border: 1px solid #e3e8e5;
            border-radius: 20px;
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,.03);
        }

        /* GALLERY */

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .main-image {
            height: 430px;
            background: #eef2f0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 100px;
        }

        .main-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .thumbnails {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .thumbnail {
            width: 75px;
            height: 75px;
            border: 2px solid #dce3df;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f5;
            overflow: hidden;
            cursor: pointer;
            transition: .2s;
            padding: 0;
        }

        .thumbnail:hover {
            border-color: #087a55;
            transform: translateY(-2px);
        }

        .thumbnail.active {
            border-color: #087a55;
            box-shadow: 0 0 0 2px rgba(8,122,85,.12);
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* PRODUCT INFO */

        .info h1 {
            font-size: 30px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .rating {
            color: #f0a800;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .rating span {
            color: #718079;
            font-size: 12px;
        }

        .price {
            font-size: 30px;
            font-weight: 900;
            color: #087a55;
            margin-bottom: 20px;
        }

        .description {
            color: #626e68;
            line-height: 2;
            margin-bottom: 25px;
            white-space: pre-line;
        }

        /* DETAILS */

        .details {
            border-top: 1px solid #e5e9e7;
            border-bottom: 1px solid #e5e9e7;
            padding: 18px 0;
            margin-bottom: 20px;
        }

        .detail {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 8px 0;
        }

        .detail span:first-child {
            color: #737f79;
        }

        .detail span:last-child {
            font-weight: bold;
        }

        /* SELLER */

        .seller {
            background: #f5f8f6;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .seller-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #087a55;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .seller-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .seller-location {
            color: #748079;
            font-size: 13px;
        }

        /* WHATSAPP */

        .contact-button {
            width: 100%;
            border: none;
            background: #087a55;
            color: white;
            padding: 16px 20px;
            border-radius: 13px;
            font-size: 16px;
            font-weight: bold;
            transition: .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .contact-button:hover {
            background: #055c40;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(8,122,85,.18);
        }

        .contact-button:active {
            transform: translateY(0);
        }

        .contact-note {
            text-align: center;
            color: #718079;
            font-size: 10px;
            margin-top: 8px;
        }

        /* LOADING */

        .loading {
            grid-column: 1 / -1;
            background: white;
            border-radius: 20px;
            padding: 70px 20px;
            text-align: center;
            font-size: 18px;
            color: #718079;
        }

        /* ERROR */

        .error {
            grid-column: 1 / -1;
            background: white;
            border-radius: 20px;
            padding: 70px 20px;
            text-align: center;
            font-size: 18px;
            color: #b42318;
        }

        .back-products {
            display: inline-block;
            margin-top: 15px;
            color: #087a55;
            font-weight: bold;
            font-size: 14px;
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {

            .header-inner {
                flex-wrap: wrap;
            }

            .logo {
                width: 100%;
            }

            .header-links {
                display: none;
            }

            .product {
                grid-template-columns: 1fr;
            }

            .main-image {
                height: 330px;
            }

            .info h1 {
                font-size: 24px;
            }

            .price {
                font-size: 26px;
            }
        }

        @media (max-width: 500px) {

            .container {
                padding: 25px 14px;
            }

            .product {
                padding: 15px;
                border-radius: 16px;
            }

            .main-image {
                height: 280px;
            }

            .search button {
                padding: 0 14px;
            }

            .search input {
                font-size: 12px;
            }

            .breadcrumb {
                font-size: 12px;
            }

            .thumbnail {
                width: 65px;
                height: 65px;
            }
        }

    </style>

</head>

<body>

<header>

    <div class="header-inner">

        <a href="index.html" class="logo">
            🛒 بازارک
        </a>

        <form class="search" id="searchForm">

            <input
                type="search"
                id="searchInput"
                placeholder="دنبال چه چیزی می‌گردید؟"
            >

            <button type="submit">
                جستجو
            </button>

        </form>

        <div class="header-links">

            <a href="index.html">
                خانه
            </a>

            <a href="products.html">
                محصولات
            </a>

        </div>

    </div>

</header>

<main class="container">

    <div class="breadcrumb">

        <a href="index.html">
            خانه
        </a>

        ←

        <a href="products.html">
            محصولات
        </a>

        ←

        جزئیات محصول

    </div>

    <section class="product" id="productBox">

        <div class="loading">
            ⏳ در حال دریافت اطلاعات محصول...
        </div>

    </section>

</main>

<script>

const SUPABASE_URL =
    "https://vhiewoopyqugdxwvsbno.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const productBox =
    document.getElementById("productBox");


const urlParams =
    new URLSearchParams(
        window.location.search
    );


const productId =
    urlParams.get("id");


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function loadProduct() {

    if (!productId) {

        showError(
            "شناسه محصول پیدا نشد."
        );

        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("products")
        .select(`
            id,
            title,
            description,
            price,
            category,
            city,
            image_url,
            image_urls,
            condition,
            stock,
            whatsapp,
            seller_id,
            status,
            created_at
        `)
        .eq("id", productId)
        .eq("status", "active")
        .single();


    if (error) {

        console.error(
            "Product error:",
            error
        );

        showError(
            "محصول پیدا نشد یا قابل نمایش نیست."
        );

        return;
    }


    if (!data) {

        showError(
            "این محصول وجود ندارد."
        );

        return;
    }


    renderProduct(data);
}


/* =====================================================
   GET PRODUCT IMAGES
===================================================== */

function getProductImages(product) {

    let images = [];


    /*
       محصولات جدید:
       image_urls
    */

    if (
        Array.isArray(product.image_urls)
    ) {

        images =
            product.image_urls.filter(
                url =>
                    typeof url === "string" &&
                    url.trim() !== ""
            );
    }


    /*
       اگر image_urls خالی بود،
       از image_url قدیمی استفاده می‌کنیم.
    */

    if (
        images.length === 0 &&
        product.image_url
    ) {

        images = [
            product.image_url
        ];
    }


    return images;
}


/* =====================================================
   RENDER PRODUCT
===================================================== */

function renderProduct(product) {

    document.title =
        product.title +
        " | بازارک";


    const images =
        getProductImages(product);


    /*
       عکس اصلی
    */

    let mainImageHTML;


    if (images.length > 0) {

        mainImageHTML = `

            <img
                id="mainProductImage"
                src="${escapeHTML(images[0])}"
                alt="${escapeHTML(product.title)}"
                onerror="this.style.display='none';"
            >

        `;

    } else {

        mainImageHTML = `📦`;
    }


    /*
       Thumbnailها
    */

    let thumbnailsHTML = "";


    if (images.length > 0) {

        thumbnailsHTML =
            images.map(
                (image, index) => `

                    <button
                        type="button"
                        class="thumbnail ${index === 0 ? "active" : ""}"
                        data-image="${escapeHTML(image)}"
                        aria-label="تصویر ${index + 1}"
                    >

                        <img
                            src="${escapeHTML(image)}"
                            alt="تصویر ${index + 1}"
                        >

                    </button>

                `
            ).join("");

    } else {

        thumbnailsHTML = `

            <div class="thumbnail">
                📦
            </div>

        `;
    }


    /* =================================================
       PRODUCT HTML
    ================================================= */

    productBox.innerHTML = `

        <div class="gallery">

            <div class="main-image">

                ${mainImageHTML}

            </div>

            <div class="thumbnails">

                ${thumbnailsHTML}

            </div>

        </div>


        <div class="info">

            <h1>
                ${escapeHTML(product.title)}
            </h1>


            <div class="rating">

                ⭐⭐⭐⭐⭐

                <span>
                    محصول بازارک
                </span>

            </div>


            <div class="price">

                ${formatPrice(product.price)}

                افغانی

            </div>


            <p class="description">

                ${escapeHTML(
                    product.description ||
                    "توضیحاتی برای این محصول ثبت نشده است."
                )}

            </p>


            <div class="details">

                <div class="detail">

                    <span>
                        دسته‌بندی
                    </span>

                    <span>
                        ${getCategoryName(
                            product.category
                        )}
                    </span>

                </div>


                <div class="detail">

                    <span>
                        وضعیت
                    </span>

                    <span>
                        ${getConditionName(
                            product.condition
                        )}
                    </span>

                </div>


                <div class="detail">

                    <span>
                        شهر
                    </span>

                    <span>
                        ${getCityName(
                            product.city
                        )}
                    </span>

                </div>


                <div class="detail">

                    <span>
                        موجودی
                    </span>

                    <span>
                        ${escapeHTML(
                            product.stock ?? 1
                        )}
                    </span>

                </div>

            </div>


            <div class="seller">

                <div class="seller-avatar">
                    👤
                </div>

                <div>

                    <div class="seller-name">
                        فروشنده بازارک
                    </div>

                    <div class="seller-location">

                        📍

                        ${getCityName(
                            product.city ||
                            "Afghanistan"
                        )}

                    </div>

                </div>

            </div>


            <button
                class="contact-button"
                id="whatsappButton"
                type="button"
            >

                💬 تماس با فروشنده در واتساپ

            </button>


            <div class="contact-note">

                با فروشنده درباره موجودی،
                قیمت و جزئیات محصول صحبت کنید.

            </div>

        </div>

    `;


    /* =================================================
       GALLERY CLICK
    ================================================= */

    const mainImage =
        document.getElementById(
            "mainProductImage"
        );


    const thumbnails =
        document.querySelectorAll(
            ".thumbnail[data-image]"
        );


    thumbnails.forEach(
        thumbnail => {

            thumbnail.addEventListener(
                "click",
                function() {

                    const image =
                        this.dataset.image;


                    if (mainImage) {

                        mainImage.src =
                            image;

                        mainImage.style.display =
                            "block";
                    }


                    thumbnails.forEach(
                        item => {

                            item.classList.remove(
                                "active"
                            );

                        }
                    );


                    this.classList.add(
                        "active"
                    );

                }
            );

        }
    );


    /* =================================================
       WHATSAPP
    ================================================= */

    const whatsappButton =
        document.getElementById(
            "whatsappButton"
        );


    whatsappButton.addEventListener(
        "click",
        function() {

            contactSellerOnWhatsApp(
                product
            );

        }
    );

}


/* =====================================================
   WHATSAPP
===================================================== */

function contactSellerOnWhatsApp(product) {

    if (!product.whatsapp) {

        alert(
            "❌ شماره واتساپ برای این محصول ثبت نشده است."
        );

        return;
    }


    let phone =
        String(product.whatsapp)
            .replace(/\D/g, "");


    if (phone.startsWith("0093")) {

        phone =
            phone.substring(2);

    }

    else if (phone.startsWith("07")) {

        phone =
            "93" +
            phone.substring(1);

    }

    else if (phone.startsWith("7")) {

        phone =
            "93" +
            phone;

    }


    if (!/^937\d{8}$/.test(phone)) {

        alert(
            "❌ شماره واتساپ فروشنده معتبر نیست."
        );

        return;
    }


    const message =

        `سلام، من محصول «${product.title}» را در بازارک دیدم.\n\n` +

        `💰 قیمت: ${formatPrice(product.price)} افغانی\n` +

        `📍 شهر: ${getCityName(product.city)}\n\n` +

        `آیا این محصول هنوز موجود است؟`;


    const whatsappURL =

        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(message);


    window.open(
        whatsappURL,
        "_blank"
    );
}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("searchForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const value =
                document
                    .getElementById("searchInput")
                    .value
                    .trim();


            if (!value) {
                return;
            }


            window.location.href =
                "products.html?search=" +
                encodeURIComponent(value);

        }
    );


/* =====================================================
   CATEGORY
===================================================== */

function getCategoryName(category) {

    const categories = {

        mobile: "📱 موبایل",

        computer: "💻 کامپیوتر",

        fashion: "👕 فیشن",

        shoes: "👟 کفش",

        gaming: "🎮 گیمینگ",

        home: "🏠 خانه",

        tools: "🔧 ابزار",

        vehicle: "🚗 موتر"

    };


    return escapeHTML(
        categories[category] ||
        category ||
        "مشخص نشده"
    );
}


/* =====================================================
   CONDITION
===================================================== */

function getConditionName(condition) {

    const conditions = {

        new: "✨ نو",

        used: "♻️ استفاده‌شده"

    };


    return escapeHTML(
        conditions[condition] ||
        condition ||
        "مشخص نشده"
    );
}


/* =====================================================
   CITY
===================================================== */

function getCityName(city) {

    const cities = {

        "Mazar-e-Sharif": "مزار شریف",

        Kabul: "کابل",

        Herat: "هرات",

        Kandahar: "کندهار",

        Jowzjan: "جوزجان",

        Balkh: "بلخ",

        Nangarhar: "ننگرهار",

        Other: "سایر"

    };


    return escapeHTML(
        cities[city] ||
        city ||
        "افغانستان"
    );
}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

    productBox.innerHTML = `

        <div class="error">

            ❌

            ${escapeHTML(message)}

            <br><br>

            <a
                href="products.html"
                class="back-products"
            >

                ← برگشت به محصولات

            </a>

        </div>

    `;
}


/* =====================================================
   PRICE
===================================================== */

function formatPrice(price) {

    if (
        price === null ||
        price === undefined ||
        price === ""
    ) {

        return "قیمت نامشخص";
    }


    return Number(price)
        .toLocaleString("fa-AF");
}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


/* =====================================================
   START
===================================================== */

loadProduct();

</script>

</body>

</html>
