<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>جزئیات محصول | بازارک</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7f6;
            color: #17211d;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            background: white;
            border-bottom: 1px solid #e4e9e6;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #087a55;
            white-space: nowrap;
        }

        .search {
            flex: 1;
            display: flex;
            background: #f1f4f2;
            border-radius: 12px;
            overflow: hidden;
        }

        .search input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 13px 16px;
            font-size: 14px;
        }

        .search button {
            border: none;
            background: #087a55;
            color: white;
            padding: 0 22px;
            cursor: pointer;
        }

        .header-links {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px;
        }

        .breadcrumb {
            margin-bottom: 20px;
            color: #718079;
            font-size: 14px;
        }

        .product {
            background: white;
            border: 1px solid #e3e8e5;
            border-radius: 20px;
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .main-image {
            height: 430px;
            background: #eef2f0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 100px;
        }

        .main-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .thumbnails {
            display: flex;
            gap: 10px;
        }

        .thumbnail {
            width: 75px;
            height: 75px;
            border: 1px solid #dce3df;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f5;
            overflow: hidden;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info h1 {
            font-size: 30px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .rating {
            color: #f0a800;
            margin-bottom: 20px;
        }

        .price {
            font-size: 30px;
            font-weight: 900;
            color: #087a55;
            margin-bottom: 20px;
        }

        .description {
            color: #626e68;
            line-height: 2;
            margin-bottom: 25px;
            white-space: pre-line;
        }

        .details {
            border-top: 1px solid #e5e9e7;
            border-bottom: 1px solid #e5e9e7;
            padding: 18px 0;
            margin-bottom: 20px;
        }

        .detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        .detail span:first-child {
            color: #737f79;
        }

        .detail span:last-child {
            font-weight: bold;
        }

        .seller {
            background: #f5f8f6;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .seller-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #087a55;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .seller-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .seller-location {
            color: #748079;
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            border: none;
            cursor: pointer;
            padding: 15px 22px;
            border-radius: 11px;
            font-size: 15px;
            font-weight: bold;
        }

        .cart-btn {
            background: #087a55;
            color: white;
            flex: 1;
        }

        .favorite-btn {
            background: #edf2ef;
            color: #17211d;
            width: 55px;
        }

        .buy-btn {
            width: 100%;
            margin-top: 12px;
            background: #f2b84b;
            color: #17120a;
        }

        .loading,
        .error {
            background: white;
            border-radius: 20px;
            padding: 70px 20px;
            text-align: center;
            font-size: 18px;
        }

        .error {
            color: #b42318;
        }

        @media (max-width: 800px) {

            .header-inner {
                flex-wrap: wrap;
            }

            .logo {
                width: 100%;
            }

            .header-links {
                display: none;
            }

            .product {
                grid-template-columns: 1fr;
            }

            .main-image {
                height: 330px;
            }

            .info h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <a href="index.html" class="logo">
            🛒 بازارک
        </a>

        <form class="search" id="searchForm">

            <input
                type="search"
                id="searchInput"
                placeholder="دنبال چه چیزی می‌گردید؟"
            >

            <button type="submit">
                جستجو
            </button>

        </form>

        <div class="header-links">

            <a href="index.html">
                خانه
            </a>

            <a href="products.html">
                محصولات
            </a>

            <a href="#">
                🛒 سبد
            </a>

        </div>

    </div>

</header>


<main class="container">

    <div class="breadcrumb">
        خانه ← محصولات ← جزئیات محصول
    </div>


    <section class="product" id="productBox">

        <div class="loading">
            ⏳ در حال دریافت اطلاعات محصول...
        </div>

    </section>

</main>


<script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
        "https://vhiewoopyqugdxwvsbno.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================
       ELEMENTS
    ========================= */

    const productBox =
        document.getElementById("productBox");


    /* =========================
       GET PRODUCT ID
    ========================= */

    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    const productId =
        urlParams.get("id");


    /* =========================
       LOAD PRODUCT
    ========================= */

    async function loadProduct() {

        if (!productId) {

            showError(
                "شناسه محصول پیدا نشد."
            );

            return;
        }


        const { data, error } =
            await supabaseClient
                .from("products")
                .select(`
                    id,
                    title,
                    description,
                    price,
                    category,
                    city,
                    image_url,
                    condition,
                    stock,
                    seller_id,
                    status,
                    created_at
                `)
                .eq("id", productId)
                .eq("status", "active")
                .single();


        if (error) {

            console.error(
                "Product error:",
                error
            );

            showError(
                "محصول پیدا نشد یا قابل نمایش نیست."
            );

            return;
        }


        if (!data) {

            showError(
                "این محصول وجود ندارد."
            );

            return;
        }


        renderProduct(data);

    }


    /* =========================
       RENDER PRODUCT
    ========================= */

    function renderProduct(product) {

        document.title =
            product.title +
            " | بازارک";


        const imageHTML =
            product.image_url

            ? `
                <img
                    src="${escapeHTML(product.image_url)}"
                    alt="${escapeHTML(product.title)}"
                >
              `

            : `
                📦
              `;


        const thumbnailHTML =
            product.image_url

            ? `
                <div class="thumbnail">
                    <img
                        src="${escapeHTML(product.image_url)}"
                        alt=""
                    >
                </div>
              `

            : `
                <div class="thumbnail">
                    📦
                </div>
              `;


        productBox.innerHTML = `

            <!-- GALLERY -->

            <div class="gallery">

                <div class="main-image">

                    ${imageHTML}

                </div>


                <div class="thumbnails">

                    ${thumbnailHTML}

                </div>

            </div>


            <!-- INFO -->

            <div class="info">

                <h1>
                    ${escapeHTML(product.title)}
                </h1>


                <div class="rating">

                    ⭐⭐⭐⭐⭐
                    <span>
                        (0 نظر)
                    </span>

                </div>


                <div class="price">

                    ${formatPrice(product.price)}
                    افغانی

                </div>


                <p class="description">

                    ${escapeHTML(
                        product.description ||
                        "توضیحاتی برای این محصول ثبت نشده است."
                    )}

                </p>


                <div class="details">

                    <div class="detail">

                        <span>
                            دسته‌بندی
                        </span>

                        <span>
                            ${escapeHTML(
                                product.category || "مشخص نشده"
                            )}
                        </span>

                    </div>


                    <div class="detail">

                        <span>
                            وضعیت
                        </span>

                        <span>
                            ${escapeHTML(
                                product.condition || "موجود"
                            )}
                        </span>

                    </div>


                    <div class="detail">

                        <span>
                            شهر
                        </span>

                        <span>
                            ${escapeHTML(
                                product.city || "مشخص نشده"
                            )}
                        </span>

                    </div>


                    <div class="detail">

                        <span>
                            موجودی
                        </span>

                        <span>
                            ${product.stock ?? 1}
                        </span>

                    </div>

                </div>


                <div class="seller">

                    <div class="seller-avatar">
                        👤
                    </div>

                    <div>

                        <div class="seller-name">
                            فروشنده بازارک
                        </div>

                        <div class="seller-location">
                            ${escapeHTML(
                                product.city || "افغانستان"
                            )}
                        </div>

                    </div>

                </div>


                <div class="actions">

                    <button
                        class="btn cart-btn"
                        id="cartButton">

                        🛒 افزودن به سبد خرید

                    </button>


                    <button
                        class="btn favorite-btn"
                        id="favoriteButton">

                        ♡

                    </button>

                </div>


                <button
                    class="btn buy-btn"
                    id="buyButton">

                    خرید این محصول

                </button>

            </div>

        `;


        /* CART */

        document
            .getElementById("cartButton")
            .addEventListener(
                "click",
                function() {

                    alert(
                        "محصول به سبد خرید اضافه شد."
                    );

                }
            );


        /* FAVORITE */

        document
            .getElementById("favoriteButton")
            .addEventListener(
                "click",
                function() {

                    this.textContent = "♥";

                }
            );


        /* BUY */

        document
            .getElementById("buyButton")
            .addEventListener(
                "click",
                function() {

                    alert(
                        "سیستم خرید بعداً فعال می‌شود."
                    );

                }
            );

    }


    /* =========================
       SEARCH
    ========================= */

    document
        .getElementById("searchForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const value =
                    document
                        .getElementById("searchInput")
                        .value
                        .trim();


                if (!value) {

                    alert(
                        "نام محصول را وارد کنید."
                    );

                    return;
                }


                window.location.href =
                    "products.html?search=" +
                    encodeURIComponent(value);

            }
        );


    /* =========================
       ERROR
    ========================= */

    function showError(message) {

        productBox.innerHTML = `

            <div class="error">

                ❌ ${escapeHTML(message)}

                <br><br>

                <a
                    href="products.html"
                    style="
                        color:#087a55;
                        font-weight:bold;
                    "
                >
                    ← برگشت به محصولات
                </a>

            </div>

        `;

    }


    /* =========================
       PRICE
    ========================= */

    function formatPrice(price) {

        if (
            price === null ||
            price === undefined ||
            price === ""
        ) {

            return "قیمت نامشخص";

        }


        return Number(price)
            .toLocaleString("fa-AF");

    }


    /* =========================
       SECURITY
    ========================= */

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       START
    ========================= */

    loadProduct();

</script>


</body>

</html>
