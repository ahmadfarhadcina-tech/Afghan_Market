<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جزئیات محصول | بازارک</title>
<meta name="description" content="جزئیات محصول در بازارک">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f5f7f6;
    --panel:#fff;
    --panel-soft:#f5f8f6;
    --text:#17211d;
    --muted:#718079;
    --border:#e3e8e5;
    --input:#f1f4f2;
    --primary:#087a55;
    --primary-dark:#055c40;
    --gold:#f0a800;
    --danger:#b42318;
    --shadow:0 10px 30px rgba(0,0,0,.04);
}

html.dark,
body.dark{
    --bg:#0e1512;
    --panel:#17201c;
    --panel-soft:#1d2924;
    --text:#eef5f1;
    --muted:#9baaa3;
    --border:#2a3832;
    --input:#202c27;
    --primary:#16a36f;
    --primary-dark:#087a55;
    --shadow:0 12px 35px rgba(0,0,0,.25);
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
    transition:.2s;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* HEADER */

header{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:100;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    font-size:24px;
    font-weight:900;
    color:var(--primary);
    white-space:nowrap;
}

.search{
    flex:1;
    display:flex;
    background:var(--input);
    border-radius:12px;
    overflow:hidden;
}

.search input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    padding:13px 16px;
    font-size:14px;
}

.search button{
    border:none;
    background:var(--primary);
    color:#fff;
    padding:0 22px;
}

.search button:hover{
    background:var(--primary-dark);
}

.header-links{
    display:flex;
    gap:18px;
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
}

.header-links a:hover{
    color:var(--primary);
}

/* MAIN */

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px 60px;
}

.breadcrumb{
    margin-bottom:20px;
    color:var(--muted);
    font-size:14px;
}

.breadcrumb a{
    color:var(--primary);
    font-weight:bold;
}

/* PRODUCT */

.product{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:35px;
    box-shadow:var(--shadow);
}

/* GALLERY */

.gallery{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.main-image{
    height:430px;
    background:var(--input);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:100px;
    position:relative;
}

.main-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.image-counter{
    position:absolute;
    left:12px;
    bottom:12px;
    background:rgba(0,0,0,.6);
    color:#fff;
    border-radius:20px;
    padding:4px 10px;
    font-size:12px;
}

.thumbnails{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.thumbnail{
    width:75px;
    height:75px;
    border:2px solid var(--border);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--input);
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
    padding:0;
}

.thumbnail:hover{
    border-color:var(--primary);
    transform:translateY(-2px);
}

.thumbnail.active{
    border-color:var(--primary);
    box-shadow:0 0 0 2px rgba(8,122,85,.12);
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* INFO */

.info h1{
    font-size:30px;
    line-height:1.5;
    margin-bottom:10px;
}

.rating-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.stars{
    color:var(--gold);
    letter-spacing:2px;
}

.rating-text{
    color:var(--muted);
    font-size:13px;
}

.price{
    font-size:30px;
    font-weight:900;
    color:var(--primary);
    margin-bottom:18px;
}

.description{
    color:var(--muted);
    line-height:2;
    margin-bottom:22px;
    white-space:pre-line;
}

.details{
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:15px 0;
    margin-bottom:20px;
}

.detail{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:7px 0;
}

.detail span:first-child{
    color:var(--muted);
}

.detail span:last-child{
    font-weight:bold;
}

/* ACTIONS */

.action-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin-bottom:18px;
}

.action-btn{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    border-radius:11px;
    padding:11px 5px;
    font-size:12px;
    font-weight:bold;
    transition:.2s;
}

.action-btn:hover{
    border-color:var(--primary);
    color:var(--primary);
    transform:translateY(-2px);
}

.action-btn.active{
    background:rgba(8,122,85,.09);
    border-color:var(--primary);
    color:var(--primary);
}

.action-btn.like-active{
    color:#e53935;
    border-color:#e53935;
    background:rgba(229,57,53,.06);
}

/* SELLER */

.seller{
    background:var(--panel-soft);
    border-radius:14px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:13px;
    margin-bottom:15px;
}

.seller-avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
    overflow:hidden;
}

.seller-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.seller-info{
    flex:1;
    min-width:0;
}

.seller-name{
    font-weight:bold;
    margin-bottom:3px;
}

.seller-location{
    color:var(--muted);
    font-size:12px;
}

.seller-actions{
    display:flex;
    gap:7px;
}

.seller-btn{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    border-radius:9px;
    padding:7px 10px;
    font-size:11px;
}

.seller-btn:hover{
    border-color:var(--primary);
    color:var(--primary);
}

/* WHATSAPP */

.contact-button{
    width:100%;
    border:none;
    background:var(--primary);
    color:#fff;
    padding:16px 20px;
    border-radius:13px;
    font-size:16px;
    font-weight:bold;
    transition:.2s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.contact-button:hover{
    background:var(--primary-dark);
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(8,122,85,.18);
}

.contact-note{
    text-align:center;
    color:var(--muted);
    font-size:10px;
    margin-top:7px;
}

/* SECTIONS */

.section{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    margin-top:22px;
    box-shadow:var(--shadow);
}

.section-title{
    font-size:19px;
    font-weight:900;
    margin-bottom:17px;
}

/* COMMENTS */

.comment-form{
    background:var(--panel-soft);
    border-radius:13px;
    padding:15px;
    margin-bottom:20px;
}

.comment-form textarea{
    width:100%;
    min-height:95px;
    resize:vertical;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    border-radius:10px;
    outline:none;
    padding:12px;
}

.comment-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.comment-rating{
    display:flex;
    align-items:center;
    gap:6px;
}

.comment-rating button{
    border:none;
    background:none;
    font-size:21px;
    color:#c9cfcc;
}

.comment-rating button.active{
    color:var(--gold);
}

.submit-btn{
    border:none;
    background:var(--primary);
    color:#fff;
    border-radius:9px;
    padding:9px 16px;
    font-weight:bold;
}

.comments-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.comment{
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px;
}

.comment-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.comment-user{
    font-weight:bold;
}

.comment-date{
    color:var(--muted);
    font-size:11px;
}

.comment-stars{
    color:var(--gold);
    font-size:13px;
    margin:4px 0;
}

.comment-text{
    color:var(--muted);
    white-space:pre-line;
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:25px;
}

/* SIMILAR */

.products-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:13px;
}

.similar-card{
    border:1px solid var(--border);
    border-radius:13px;
    overflow:hidden;
    background:var(--panel);
    transition:.2s;
    cursor:pointer;
}

.similar-card:hover{
    transform:translateY(-3px);
    border-color:var(--primary);
}

.similar-image{
    width:100%;
    aspect-ratio:1/1;
    background:var(--input);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.similar-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.similar-info{
    padding:10px;
}

.similar-title{
    font-weight:bold;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.similar-price{
    color:var(--primary);
    font-weight:900;
    font-size:13px;
    margin-top:4px;
}

/* LOADING */

.loading{
    grid-column:1/-1;
    background:var(--panel);
    border-radius:20px;
    padding:70px 20px;
    text-align:center;
    color:var(--muted);
}

.loading-icon{
    width:55px;
    height:55px;
    border:4px solid var(--border);
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 14px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ERROR */

.error{
    grid-column:1/-1;
    background:var(--panel);
    border-radius:20px;
    padding:70px 20px;
    text-align:center;
    color:var(--danger);
}

.back-products{
    display:inline-block;
    margin-top:15px;
    color:var(--primary);
    font-weight:bold;
}

/* ================================
   MAIN MODAL / پنجره اصلی
================================ */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:5000;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(430px,100%);
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:22px;
    padding:24px;
    box-shadow:0 25px 80px rgba(0,0,0,.3);
    animation:modalIn .22s ease;
    text-align:right;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(15px) scale(.96);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.modal-icon{
    width:58px;
    height:58px;
    border-radius:16px;
    background:var(--panel-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    margin-bottom:13px;
}

.modal-title{
    font-size:20px;
    font-weight:900;
    margin-bottom:8px;
}

.modal-message{
    color:var(--muted);
    font-size:14px;
    line-height:2;
    white-space:pre-line;
    word-break:break-word;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-actions button{
    flex:1;
    border:none;
    border-radius:11px;
    padding:12px;
    font-weight:bold;
    font-size:13px;
}

.modal-primary{
    background:var(--primary);
    color:#fff;
}

.modal-primary:hover{
    background:var(--primary-dark);
}

.modal-secondary{
    background:var(--input);
    color:var(--text);
}

.modal-secondary:hover{
    background:var(--border);
}

/* REPORT MODAL */

.report-options{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:16px;
}

.report-option{
    width:100%;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    padding:12px;
    border-radius:11px;
    text-align:right;
    transition:.2s;
}

.report-option:hover{
    border-color:var(--danger);
    color:var(--danger);
    background:rgba(180,35,24,.04);
}

/* RESPONSIVE */

@media(max-width:1000px){

    .products-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:800px){

    .header-inner{
        flex-wrap:wrap;
    }

    .logo{
        width:100%;
    }

    .header-links{
        display:none;
    }

    .product{
        grid-template-columns:1fr;
    }

    .main-image{
        height:330px;
    }

    .info h1{
        font-size:24px;
    }

    .price{
        font-size:26px;
    }
}

@media(max-width:600px){

    .container{
        padding:22px 12px 45px;
    }

    .product{
        padding:14px;
        border-radius:16px;
    }

    .main-image{
        height:290px;
    }

    .action-row{
        grid-template-columns:repeat(4,1fr);
    }

    .action-btn{
        font-size:10px;
        padding:10px 2px;
    }

    .seller{
        align-items:flex-start;
    }

    .seller-actions{
        flex-direction:column;
    }

    .products-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .section{
        padding:15px;
    }

    .thumbnail{
        width:63px;
        height:63px;
    }

    .comment-bottom{
        align-items:flex-end;
        flex-direction:column;
    }

    .modal{
        padding:14px;
    }

    .modal-box{
        padding:20px;
        border-radius:18px;
    }
}

@media(max-width:400px){

    .search button{
        padding:0 12px;
    }

    .search input{
        font-size:11px;
    }

    .action-btn{
        font-size:9px;
    }
}

    .comment-user-wrap{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
}

.comment-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex-shrink:0;
    font-size:16px;
    font-weight:bold;
}

.comment-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.comment-user-info{
    min-width:0;
}

.comment-user{
    font-weight:bold;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

</style>
</head>

/* THEME */

function syncTheme(){

    const keys = [
        "bazaarak-theme",
        "theme",
        "themeMode"
    ];

    let theme = null;

    for(const key of keys){

        const value =
        localStorage.getItem(key);

        if(
            value === "dark" ||
            value === "light"
        ){

            theme = value;
            break;
        }
    }

    if(!theme){

        const dark =
        localStorage.getItem("darkMode");

        if(dark === "true"){
            theme = "dark";
        }
    }

    if(!theme){

        theme =
        window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches
        ? "dark"
        : "light";
    }

    document.documentElement.classList.toggle(
        "dark",
        theme === "dark"
    );

    document.body.classList.toggle(
        "dark",
        theme === "dark"
    );
}

/* LOAD PRODUCT */

async function loadProduct(){

    if(!productId){

        showError(
            "شناسه محصول پیدا نشد."
        );

        return;
    }

    const {
        data,
        error
    } =
    await supabaseClient
    .from("products")
    .select(`
        id,
        title,
        description,
        price,
        category,
        city,
        image_url,
        image_urls,
        condition,
        stock,
        whatsapp,
        seller_id,
        status,
        created_at
    `)
    .eq("id",productId)
    .eq("status","active")
    .single();

    if(error){

        console.error(
            "Product error:",
            error
        );

        showError(
            "محصول پیدا نشد یا قابل نمایش نیست."
        );

        return;
    }

    if(!data){

        showError(
            "این محصول وجود ندارد."
        );

        return;
    }

    currentProduct = data;

    await loadSeller(
        data.seller_id
    );

    await renderProduct(data);

    await Promise.all([
        loadLikeState(),
        loadWishlistState(),
        loadComments(),
        loadSimilarProducts()
    ]);
}

/* IMAGES */

function getProductImages(product){

    let images = [];

    if(Array.isArray(product.image_urls)){

        images =
        product.image_urls.filter(
            url =>
            typeof url === "string" &&
            url.trim() !== ""
        );
    }

    if(
        images.length === 0 &&
        product.image_url
    ){

        images = [
            product.image_url
        ];
    }

    return images;
}

/* ACTIONS */

function bindProductActions(images){

    const mainImage =
    document.getElementById(
        "mainProductImage"
    );

    const counter =
    document.getElementById(
        "imageCounter"
    );

    document
    .querySelectorAll(
        ".thumbnail[data-image]"
    )
    .forEach(
    thumbnail => {

        thumbnail.addEventListener(
        "click",
        function(){

            const image =
            this.dataset.image;

            const index =
            Number(this.dataset.index);

            if(mainImage){

                mainImage.src = image;
                mainImage.style.display = "block";

            }

            if(counter){

                counter.textContent =
                `${index + 1} / ${images.length}`;

            }

            document
            .querySelectorAll(".thumbnail")
            .forEach(
                item =>
                item.classList.remove("active")
            );

            this.classList.add("active");

        });

    });

    document
    .getElementById("likeButton")
    .addEventListener("click",toggleLike);

    document
    .getElementById("wishlistButton")
    .addEventListener("click",toggleWishlist);

    document
    .getElementById("shareButton")
    .addEventListener("click",shareProduct);

    document
    .getElementById("reportButton")
    .addEventListener("click",openReportModal);

    document
    .getElementById("whatsappButton")
    .addEventListener(
        "click",
        () =>
        contactSellerOnWhatsApp(currentProduct)
    );

    document
    .getElementById("sellerProfileButton")
    .addEventListener(
        "click",
        openSellerProfile
    );

    document
    .getElementById("followSellerButton")
    .addEventListener(
        "click",
        toggleFollowSeller
    );
}

/* LIKE */

async function loadLikeState(){

    if(!currentUser) return;

    const {
        data,
        error
    } =
    await supabaseClient
    .from("product_likes")
    .select("product_id")
    .eq("product_id",productId)
    .eq("user_id",currentUser.id)
    .maybeSingle();

    if(!error && data){

        productLiked = true;
        updateLikeButton();

    }
}

async function toggleLike(){

    if(!currentUser){

        requireLogin();
        return;

    }

    const button =
    document.getElementById("likeButton");

    button.disabled = true;

    try{

        if(productLiked){

            const {
                error
            } =
            await supabaseClient
            .from("product_likes")
            .delete()
            .eq("product_id",productId)
            .eq("user_id",currentUser.id);

            if(error) throw error;

            productLiked = false;

        }else{

            const {
                error
            } =
            await supabaseClient
            .from("product_likes")
            .insert({
                product_id:productId,
                user_id:currentUser.id
            });

            if(error) throw error;

            productLiked = true;
        }

        updateLikeButton();

    }catch(error){

        console.error(error);

        showModal(
            "⚠️",
            "خطا",
            "عملیات پسندیدن محصول انجام نشد.",
            null,
            null
        );
    }

    button.disabled = false;
}

function updateLikeButton(){

    const button =
    document.getElementById("likeButton");

    if(!button) return;

    button.classList.toggle(
        "like-active",
        productLiked
    );

    button.textContent =
    productLiked
    ? "❤️ پسندیده شد"
    : "👍 پسندیدن";
}

/* SHARE */

async function shareProduct(){

    const url =
    window.location.href;

    const title =
    currentProduct?.title ||
    "محصول در بازارک";

    try{

        if(navigator.share){

            await navigator.share({
                title:title,
                text:
                `این محصول را در بازارک ببینید: ${title}`,
                url:url
            });

            return;
        }

        await navigator.clipboard.writeText(url);

        showModal(
            "📋",
            "لینک کپی شد",
            "لینک محصول با موفقیت کپی شد.",
            null,
            null
        );

    }catch(error){

        if(error?.name !== "AbortError"){

            showModal(
                "📤",
                "اشتراک‌گذاری",
                "لینک محصول:\n" + url,
                null,
                null
            );
        }
    }
}

async function toggleFollowSeller(){

    if(!currentUser){

        requireLogin();
        return;
    }

    if(!currentProduct?.seller_id) return;

    if(
        currentProduct.seller_id ===
        currentUser.id
    ){

        showModal(
            "👤",
            "فروشنده",
            "نمی‌توانید خودتان را دنبال کنید.",
            null,
            null
        );

        return;
    }

    const button =
    document.getElementById(
        "followSellerButton"
    );

    button.disabled = true;

    try{

        const {
            data:existing,
            error:checkError
        } =
        await supabaseClient
        .from("followers")
        .select("follower_id")
        .eq(
            "follower_id",
            currentUser.id
        )
        .eq(
            "following_id",
            currentProduct.seller_id
        )
        .maybeSingle();

        if(checkError) throw checkError;

        if(existing){

            const {
                error
            } =
            await supabaseClient
            .from("followers")
            .delete()
            .eq(
                "follower_id",
                currentUser.id
            )
            .eq(
                "following_id",
                currentProduct.seller_id
            );

            if(error) throw error;

            button.textContent =
            "+ دنبال‌کردن";

        }else{

            const {
                error
            } =
            await supabaseClient
            .from("followers")
            .insert({
                follower_id:
                currentUser.id,

                following_id:
                currentProduct.seller_id
            });

            if(error) throw error;

            button.textContent =
            "✓ دنبال می‌کنید";
        }

    }catch(error){

        console.error(error);

        showModal(
            "⚠️",
            "خطا",
            "تغییر وضعیت دنبال‌کردن انجام نشد.",
            null,
            null
        );
    }

    button.disabled = false;
}


/* COMMENTS */
async function loadComments(){

    const list =
    document.getElementById(
        "commentsList"
    );

    if(!list) return;

    const {
        data,
        error
    } =
    await supabaseClient
    .from("product_comments")
    .select("*")
    .eq("product_id",productId)
    .order("created_at",{
        ascending:false
    });

    if(error){

        console.error(
            "Comments:",
            error
        );

        list.innerHTML = `
            <div class="empty">
                هنوز نظری برای این محصول ثبت نشده است.
            </div>
        `;

        renderCommentForm();
        return;
    }

    if(!data?.length){

        list.innerHTML = `
            <div class="empty">
                هنوز نظری برای این محصول ثبت نشده است.
            </div>
        `;

        calculateRating([]);
        renderCommentForm();
        return;
    }

    /*
     * دریافت پروفایل تمام کاربرانی که
     * برای این محصول نظر داده‌اند
     */
    const userIds = [
        ...new Set(
            data
            .map(item => item.user_id)
            .filter(Boolean)
        )
    ];

    let profiles = [];

    if(userIds.length){

        const {
            data:profileData,
            error:profileError
        } =
        await supabaseClient
        .from("seller_profiles")
        .select(`
            id,
            username,
            full_name,
            avatar_url
        `)
        .in("id",userIds);

        if(profileError){

            console.error(
                "Comment profiles:",
                profileError
            );

        }else{

            profiles = profileData || [];
        }
    }

    const profileMap = new Map(
        profiles.map(
            profile => [
                profile.id,
                profile
            ]
        )
    );

    list.innerHTML =
    data.map(
        comment => {

            const profile =
            profileMap.get(
                comment.user_id
            ) || null;

            return renderComment(
                comment,
                profile
            );
        }
    ).join("");

    calculateRating(data || []);
    renderCommentForm();
}

function renderComment(
    comment,
    profile = null
){

    const name =
    profile?.full_name ||
    profile?.username ||
    comment.user_name ||
    comment.full_name ||
    comment.username ||
    "کاربر بازارک";

    const avatar =
    profile?.avatar_url || "";

    const avatarHTML =
    avatar
    ? `
        <img
            src="${escapeHTML(avatar)}"
            alt="${escapeHTML(name)}"
            onerror="this.parentElement.innerHTML='👤'"
        >
    `
    : "👤";

    const rating =
    Number(comment.rating || 5);

    const safeRating =
    Math.max(
        0,
        Math.min(
            5,
            Math.round(rating)
        )
    );

    const stars =
    "★".repeat(safeRating) +
    "☆".repeat(5-safeRating);

    const date =
    comment.created_at
    ? new Date(
        comment.created_at
      ).toLocaleDateString("fa-AF")
    : "";

    return `
        <article class="comment">

            <div class="comment-head">

                <div class="comment-user-wrap">

                    <div class="comment-avatar">
                        ${avatarHTML}
                    </div>

                    <div class="comment-user-info">

                        <div class="comment-user">
                            ${escapeHTML(name)}
                        </div>

                        <div class="comment-date">
                            ${escapeHTML(date)}
                        </div>

                    </div>

                </div>

            </div>

            <div class="comment-stars">
                ${stars}
            </div>

            <div class="comment-text">
                ${escapeHTML(
                    comment.comment ||
                    comment.content ||
                    ""
                )}
            </div>

        </article>
    `;
}

function calculateRating(comments){

    const ratingText =
    document.getElementById("ratingText");

    const stars =
    document.getElementById("productStars");

    if(!comments.length){

        if(ratingText)
        ratingText.textContent =
        "بدون امتیاز";

        return;
    }

    const ratings =
    comments
    .map(
        item =>
        Number(item.rating)
    )
    .filter(
        value =>
        value >= 1 &&
        value <= 5
    );

    if(!ratings.length){

        if(ratingText)
        ratingText.textContent =
        "بدون امتیاز";

        return;
    }

    const average =
    ratings.reduce(
        (a,b)=>a+b,
        0
    ) / ratings.length;

    if(ratingText){

        ratingText.textContent =
        `${average.toFixed(1)} از 5 (${ratings.length} نظر)`;
    }

    if(stars){

        const rounded =
        Math.round(average);

        stars.textContent =
        "★".repeat(rounded) +
        "☆".repeat(5-rounded);
    }
}

    document.getElementById(
        "commentInput"

    input?.value.trim();

    if(!text){

        showModal(
            "💬",
            "نظر شما",
            "لطفاً متن نظر را وارد کنید.",
            null,
            null
        );

        return;
    }

    const button =

}


/* SIMILAR PRODUCTS */

async function loadSimilarProducts(){

    const container =
    document.getElementById(
        "similarProducts"
    );

    if(!container || !currentProduct)
    return;

    const {
        data,
        error
    } =
    await supabaseClient
    .from("products")
    .select(`
        id,
        title,
        price,
        image_url,
        image_urls,
        category
    `)
    .eq("status","active")
    .eq(
        "category",
        currentProduct.category
    )
    .neq(
        "id",
        currentProduct.id
    )
    .limit(10);

    if(error){

        console.error(
            "Similar products:",
            error
        );

        container.innerHTML = `
            <div class="empty">
                محصول مشابهی پیدا نشد.
            </div>
        `;

        return;
    }

    if(!data?.length){

        container.innerHTML = `
            <div class="empty">
                محصول مشابهی پیدا نشد.
            </div>
        `;

        return;
    }

    container.innerHTML =
    data.map(
        product =>
        renderSimilarProduct(product)
    ).join("");

    container
    .querySelectorAll(".similar-card")
    .forEach(
        card => {

            card.addEventListener(
                "click",
                function(){

                    window.location.href =
                    "product.html?id=" +
                    encodeURIComponent(
                        this.dataset.id
                    );

                }
            );
        }
    );
}

function renderSimilarProduct(product){

    const images =
    getProductImages(product);

    const image =
    images[0];

    return `
        <article
            class="similar-card"
            data-id="${escapeHTML(product.id)}"
        >

            <div class="similar-image">

                ${
                    image
                    ? `
                        <img
                            src="${escapeHTML(image)}"
                            alt="${escapeHTML(product.title)}"
                        >
                    `
                    : "📦"
                }

            </div>

            <div class="similar-info">

                <div class="similar-title">
                    ${escapeHTML(product.title)}
                </div>

                <div class="similar-price">
                    ${formatPrice(product.price)}
                    افغانی
                </div>

            </div>

        </article>
    `;
}

}


/* WHATSAPP */

function contactSellerOnWhatsApp(product){

    if(!product?.whatsapp){

        showModal(
            "💬",
            "واتساپ فروشنده",
            "شماره واتساپ برای این محصول ثبت نشده است.",
            null,
            null
        );

        return;
    }

    let phone =
    String(product.whatsapp)
    .replace(/\D/g,"");

    if(phone.startsWith("0093")){

        phone =
        phone.substring(2);

    }else if(phone.startsWith("07")){

        phone =
        "93" +
        phone.substring(1);

    }else if(phone.startsWith("7")){

        phone =
        "93" +
        phone;
    }

    if(!/^937\d{8}$/.test(phone)){

        showModal(
            "⚠️",
            "شماره نامعتبر",
            "شماره واتساپ فروشنده معتبر نیست.",
            null,
            null
        );

        return;
    }

    const message =
    `سلام، من محصول «${product.title}» را در بازارک دیدم.\n\n` +
    `💰 قیمت: ${formatPrice(product.price)} افغانی\n` +
    `📍 شهر: ${getCityName(product.city)}\n\n` +
    `آیا این محصول هنوز موجود است؟`;

    const whatsappURL =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(message);

    window.open(
        whatsappURL,
        "_blank"
    );
}

/* =========================================
   MODAL FUNCTIONS
========================================= */

function showModal(
    icon,
    title,
    message,
    primaryText,
    primaryAction
){

    const modal =
    document.getElementById(
        "appModal"
    );

    const modalIcon =
    document.getElementById(
        "modalIcon"
    );

    const modalTitle =
    document.getElementById(
        "modalTitle"
    );

    const modalMessage =
    document.getElementById(
        "modalMessage"
    );

    const primary =
    document.getElementById(
        "modalPrimary"
    );

    modalIcon.textContent =
    icon || "ℹ️";

    modalTitle.textContent =
    title || "بازارک";

    modalMessage.textContent =
    message || "";

    primary.style.display =
    "none";

    primary.onclick = null;

    if(
        primaryText &&
        typeof primaryAction === "function"
    ){

        primary.style.display =
        "block";

        primary.textContent =
        primaryText;

        primary.onclick =
        function(){

            closeModal();

            primaryAction();

        };
    }

    modal.classList.add("show");

    document.body.style.overflow =
    "hidden";
}

function closeModal(){

    const modal =
    document.getElementById(
        "appModal"
    );

    modal.classList.remove("show");

    document.body.style.overflow = "";
}


/* CLOSE MODALS BY OUTSIDE CLICK */

document

document

/* HELPERS */

function getCategoryName(category){

    const categories = {

        mobile:"📱 موبایل",
        computer:"💻 کامپیوتر",
        fashion:"👕 فیشن",
        shoes:"👟 کفش",
        gaming:"🎮 گیمینگ",
        home:"🏠 خانه",
        tools:"🔧 ابزار",
        vehicle:"🚗 موتر"

    };

    return escapeHTML(
        categories[category] ||
        category ||
        "مشخص نشده"
    );
}

function getConditionName(condition){

    const conditions = {

        new:"✨ نو",
        used:"♻️ استفاده‌شده"

    };

    return escapeHTML(
        conditions[condition] ||
        condition ||
        "مشخص نشده"
    );
}

function getCityName(city){

    const cities = {

        "Mazar-e-Sharif":"مزار شریف",
        Kabul:"کابل",
        Herat:"هرات",
        Kandahar:"کندهار",
        Jowzjan:"جوزجان",
        Balkh:"بلخ",
        Nangarhar:"ننگرهار",
        Other:"سایر"

    };

    return escapeHTML(
        cities[city] ||
        city ||
        "افغانستان"
    );
}

function formatPrice(price){

    if(
        price === null ||
        price === undefined ||
        price === ""
    ){

        return "قیمت نامشخص";
    }

    const number =
    Number(price);

    if(Number.isNaN(number)){

        return escapeHTML(price);

    }

    return number.toLocaleString("fa-AF");
}

function showError(message){

    productBox.innerHTML = `

        <div class="error">

            ❌

            ${escapeHTML(message)}

            <br><br>

            <a
                href="products.html"
                class="back-products"
            >
                ← برگشت به محصولات
            </a>

        </div>
    `;
}

function escapeHTML(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
