<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>محصولات من | بازارک</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f7f5;
            color: #17251d;
        }

        header {
            background: #087443;
            color: white;
            padding: 15px 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.1);
        }

        .header {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,.12);
            padding: 10px 14px;
            border-radius: 10px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 15px;
        }

        h1 {
            margin: 0 0 20px;
            color: #087443;
            font-size: 25px;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error {
            background: #fdeaea;
            color: #c62828;
        }

        .success {
            background: #e8f5ee;
            color: #087443;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #777;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .product-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }

        .product-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
            background: #eef2ef;
        }

        .product-info {
            padding: 16px;
        }

        .product-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .price {
            color: #087443;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .category {
            color: #777;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            border: none;
            padding: 11px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        .edit-btn {
            background: #e8f5ee;
            color: #087443;
        }

        .delete-btn {
            background: #fdeaea;
            color: #c62828;
        }

        .empty {
            background: white;
            border-radius: 18px;
            padding: 50px 20px;
            text-align: center;
            color: #777;
        }

        @media (max-width: 750px) {

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 500px) {

            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .back {
                text-align: center;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .container {
                margin-top: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header">

        <a
            href="index.html"
            class="logo"
        >
            🛒 بازارک
        </a>


        <a
            href="profile.html"
            class="back"
        >
            ← برگشت به پروفایل
        </a>

    </div>

</header>


<main class="container">

    <h1>
        📦 محصولات من
    </h1>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="loading"
        class="loading"
    >
        ⏳ در حال دریافت محصولات...
    </div>


    <div
        id="products"
        class="products"
        style="display:none;"
    ></div>

</main>


<script>


const SUPABASE_URL =
    "https://vhiewoopyqugdxwvsbno.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


const loading =
    document.getElementById("loading");


const products =
    document.getElementById("products");


const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


</script>


</body>

</html>
