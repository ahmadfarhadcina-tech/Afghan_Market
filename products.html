<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>محصولات | بازارک</title>

    <meta
        name="description"
        content="مشاهده محصولات و کالاهای موجود در بازارک، بازار آنلاین افغانستان"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        :root {
            --bg: #f5f7f6;
            --surface: #ffffff;
            --surface-soft: #f8faf9;
            --surface-muted: #eef2f0;

            --text: #17211d;
            --text-soft: #39443f;
            --muted: #69746f;

            --border: #e5e9e7;
            --border-soft: #edf1ef;

            --primary: #087a55;
            --primary-dark: #055c40;
            --primary-soft: #eef8f4;
            --primary-border: #d5eee3;

            --danger: #e53935;
            --danger-soft: #fff0f0;

            --error-bg: #fff4f4;
            --error-border: #ffd0d0;
            --error-text: #b42318;

            --shadow: rgba(0, 0, 0, 0.08);

            color-scheme: light;
        }


        html[data-theme="dark"],
        body.dark,
        html.dark {
            --bg: #101513;
            --surface: #171d1a;
            --surface-soft: #1d2521;
            --surface-muted: #222b27;

            --text: #f0f5f2;
            --text-soft: #d5dfda;
            --muted: #9ca9a3;

            --border: #2c3833;
            --border-soft: #26312d;

            --primary: #16a875;
            --primary-dark: #0d875d;
            --primary-soft: #17352b;
            --primary-border: #275442;

            --danger: #ff625e;
            --danger-soft: #3a2020;

            --error-bg: #351d1d;
            --error-border: #653333;
            --error-text: #ff9b96;

            --shadow: rgba(0, 0, 0, 0.28);

            color-scheme: dark;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            background: var(--bg);
        }


        body {
            font-family: Tahoma, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;

            transition:
                background-color .25s ease,
                color .25s ease;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        a,
        button,
        input,
        select {
            -webkit-tap-highlight-color: transparent;
        }


        button,
        input,
        select {
            font-family: inherit;
        }


        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;

            transition:
                background-color .25s ease,
                border-color .25s ease;
        }


        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 16px 20px;

            display: flex;
            align-items: center;
            gap: 20px;
        }


        .logo {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            white-space: nowrap;
        }


        .search {
            flex: 1;
            display: flex;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;

            transition:
                background-color .25s ease,
                border-color .25s ease;
        }


        .search input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);

            padding: 13px 16px;
            font-size: 14px;
        }


        .search input::placeholder {
            color: var(--muted);
        }


        .search button {
            border: none;
            background: var(--primary);
            color: white;

            padding: 0 22px;
            cursor: pointer;

            transition:
                background-color .2s ease,
                transform .18s ease;
        }


        .search button:hover {
            background: var(--primary-dark);
        }


        .search button:active {
            transform: scale(.96);
        }


        .header-links {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }


        .header-links a {
            color: var(--text-soft);
            transition:
                color .2s ease,
                transform .18s ease;
        }


        .header-links a:hover {
            color: var(--primary);
        }


        .header-links a:active {
            transform: scale(.94);
        }


        .container {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            padding: 35px 20px 50px;
        }


        .page-title {
            margin-bottom: 25px;
        }


        .page-title h1 {
            font-size: 30px;
            margin-bottom: 8px;
            color: var(--text);
        }


        .page-title p {
            color: var(--muted);
        }


        .toolbar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;

            padding: 15px;

            display: flex;
            gap: 12px;
            flex-wrap: wrap;

            margin-bottom: 25px;

            transition:
                background-color .25s ease,
                border-color .25s ease;
        }


        .toolbar select {
            padding: 12px 15px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: var(--surface);
            color: var(--text);

            outline: none;
            cursor: pointer;

            transition:
                background-color .2s ease,
                border-color .2s ease;
        }


        .toolbar select:focus {
            border-color: var(--primary);
        }


        .active-category {
            display: none;

            background: var(--primary-soft);
            color: var(--primary);

            border: 1px solid var(--primary-border);
            border-radius: 10px;

            padding: 10px 14px;

            font-size: 13px;
            font-weight: bold;

            margin-bottom: 20px;
        }


        .active-category.show {
            display: block;
        }


        /* =====================================
           PRODUCTS GRID
        ===================================== */

        .products-grid {
            width: 100%;

            display: grid;

            /*
             * Desktop / laptop:
             * exactly 5 products per row
             */
            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap: 24px 16px;

            align-items: start;
        }


        .product-item {
            min-width: 0;
            width: 100%;
        }


        /* =====================================
           SELLER
        ===================================== */

        .seller-box {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 8px;

            min-width: 0;
            min-height: 36px;

            margin: 0 4px 9px;
        }


        .seller-link {
            display: flex;
            align-items: center;

            gap: 8px;

            min-width: 0;
            max-width: 100%;
            width: fit-content;

            transition:
                transform .18s ease,
                opacity .18s ease;
        }


        .seller-link:hover .seller-name {
            color: var(--primary);
        }


        .seller-link:active {
            transform: scale(.94);
            opacity: .75;
        }


        .seller-clicked {
            transform: scale(.94);
            opacity: .75;
        }


        .seller-avatar {
            width: 34px;
            height: 34px;

            border-radius: 50%;

            object-fit: cover;
            object-position: center;

            background: var(--surface-muted);

            border: 1px solid var(--border);

            flex-shrink: 0;
        }


        .seller-avatar-placeholder {
            width: 34px;
            height: 34px;

            border-radius: 50%;

            background: var(--primary);
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 16px;

            flex-shrink: 0;
        }


        .seller-name {
            font-size: 12px;
            font-weight: bold;

            color: var(--text-soft);

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            transition: color .2s ease;
        }


        /* =====================================
           FOLLOW
        ===================================== */

        .follow-btn {
            border: none;

            background: var(--primary);
            color: white;

            padding: 6px 11px;
            border-radius: 8px;

            font-size: 10px;
            font-weight: bold;

            cursor: pointer;
            white-space: nowrap;

            transition:
                transform .18s ease,
                background-color .18s ease,
                opacity .18s ease;

            flex-shrink: 0;
        }


        .follow-btn:hover {
            background: var(--primary-dark);
        }


        .follow-btn:active {
            transform: scale(.92);
        }


        .follow-btn:disabled {
            opacity: .6;
            cursor: wait;
        }


        /* =====================================
           PRODUCT CARD
        ===================================== */

        .product-card {
            width: 100%;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: 16px;

            overflow: hidden;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background-color .25s ease,
                border-color .25s ease;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }


        .product-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 30px var(--shadow);
        }


        .product-card:active {
            transform: scale(.985);
        }


        /* =====================================
           PRODUCT IMAGE
        ===================================== */

        .product-image {
            width: 100%;

            background: var(--surface-muted);

            display: block;
            position: relative;

            overflow: hidden;

            line-height: 0;

            /*
             * Keep image area stable so cards don't jump
             * while images load.
             */
            aspect-ratio: 1 / 1;
        }


        .product-image img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
            object-position: center;

            transition:
                transform .35s ease;
        }


        .product-card:hover
        .product-image img {
            transform: scale(1.035);
        }


        .no-image {
            width: 100%;
            height: 100%;

            min-height: 150px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--surface-muted);

            color: var(--muted);

            font-size: 55px;
            line-height: normal;
        }


        .photo-count {
            position: absolute;

            left: 10px;
            bottom: 10px;

            background: rgba(0,0,0,.65);
            color: white;

            padding: 5px 9px;
            border-radius: 8px;

            font-size: 11px;
            direction: rtl;

            pointer-events: none;
            line-height: normal;
        }


        /* =====================================
           PRODUCT INFO
        ===================================== */

        .product-info {
            padding: 16px;
        }


        .product-info h3 {
            font-size: 16px;

            margin-bottom: 10px;

            line-height: 1.6;

            color: var(--text);

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;

            min-height: 51px;
        }


        .price {
            color: var(--primary);

            font-weight: 900;
            font-size: 18px;

            margin-bottom: 8px;
        }


        .location {
            color: var(--muted);

            font-size: 13px;

            margin-bottom: 7px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .condition {
            display: inline-block;

            background: var(--primary-soft);
            color: var(--primary);

            padding: 5px 9px;
            border-radius: 7px;

            font-size: 11px;
        }


        /* =====================================
           SOCIAL ACTIONS
        ===================================== */

        .social-actions {
            display: flex;
            align-items: center;

            gap: 8px;

            padding: 10px 12px 12px;

            border-top: 1px solid var(--border-soft);

            background: var(--surface);
        }


        .social-btn {
            flex: 1;

            border: 1px solid var(--border);

            background: var(--surface-soft);
            color: var(--text-soft);

            min-height: 40px;

            border-radius: 11px;

            font-size: 13px;
            font-weight: bold;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 6px;

            transition:
                transform .18s ease,
                background-color .18s ease,
                border-color .18s ease,
                color .18s ease;
        }


        .social-btn:hover {
            background: var(--primary-soft);
            border-color: var(--primary-border);
            color: var(--primary);
        }


        .social-btn:active {
            transform: scale(.94);
        }


        .social-btn:disabled {
            opacity: .6;
            cursor: wait;
        }


        .like-btn.liked {
            background: var(--danger-soft);
            border-color: #ffd2d2;
            color: var(--danger);
        }


        .social-count {
            font-size: 12px;
            font-weight: 900;
        }


        /* =====================================
           EMPTY
        ===================================== */

        .empty {
            grid-column: 1 / -1;

            background: var(--surface);

            border: 1px dashed var(--border);

            border-radius: 20px;

            padding: 70px 20px;

            text-align: center;
        }


        .empty-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }


        .empty h2 {
            margin-bottom: 10px;
            color: var(--text);
        }


        .empty p {
            color: var(--muted);
            margin-bottom: 22px;
        }


        .sell-button {
            display: inline-block;

            background: var(--primary);
            color: white;

            padding: 13px 24px;

            border-radius: 10px;

            font-weight: bold;

            transition:
                transform .18s ease,
                background-color .18s ease;
        }


        .sell-button:hover {
            background: var(--primary-dark);
        }


        .sell-button:active {
            transform: scale(.96);
        }


        /* =====================================
           BAZAARAK LOCAL LOADING
        ===================================== */

        .products-loading {
            grid-column: 1 / -1;

            width: 100%;

            min-height: 260px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 35px 20px;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 20px;

            text-align: center;

            animation:
                loadingAppear .3s ease both;
        }


        .products-loading-inner {
            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 14px;
        }


        .bazaarak-loader {
            position: relative;

            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .bazaarak-loader::before {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: 50%;

            border: 4px solid var(--primary-soft);

            border-top-color: var(--primary);
            border-left-color: var(--primary);

            animation:
                bazaarakSpin .85s linear infinite;
        }


        .bazaarak-loader-icon {
            position: relative;

            width: 34px;
            height: 34px;

            border-radius: 11px;

            background: var(--primary);

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;

            box-shadow:
                0 7px 18px
                rgba(8,122,85,.18);

            animation:
                bazaarakPulse 1.2s ease-in-out infinite;
        }


        .products-loading-title {
            color: var(--text);

            font-size: 15px;
            font-weight: 900;
        }


        .products-loading-text {
            color: var(--muted);

            font-size: 12px;

            animation:
                loadingDots 1.4s ease-in-out infinite;
        }


        @keyframes bazaarakSpin {

            to {
                transform: rotate(360deg);
            }

        }


        @keyframes bazaarakPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(.88);
            }

        }


        @keyframes loadingAppear {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @keyframes loadingDots {

            0%,
            100% {
                opacity: .55;
            }

            50% {
                opacity: 1;
            }

        }


        /* =====================================
           ERROR
        ===================================== */

        .error {
            grid-column: 1 / -1;

            background: var(--error-bg);

            border: 1px solid var(--error-border);

            color: var(--error-text);

            border-radius: 20px;

            padding: 30px;

            text-align: center;
        }


        .error h2 {
            margin-bottom: 10px;
        }


        .error p {
            line-height: 1.8;
            word-break: break-word;
        }


        /* =====================================
           LAPTOP
        ===================================== */

        @media (min-width: 901px) and (max-width: 1250px) {

            .container {
                max-width: 1180px;
                padding-left: 18px;
                padding-right: 18px;
            }


            .products-grid {
                grid-template-columns:
                    repeat(5, minmax(0, 1fr));

                gap: 20px 13px;
            }


            .product-info {
                padding: 13px;
            }


            .product-info h3 {
                font-size: 14px;
            }


            .price {
                font-size: 16px;
            }


            .social-actions {
                padding:
                    8px 9px 10px;

                gap: 5px;
            }


            .social-btn {
                min-height: 37px;
                font-size: 11px;
            }


            .seller-name {
                max-width: 105px;
            }


            .follow-btn {
                padding:
                    5px 7px;

                font-size: 9px;
            }

        }


        /* =====================================
           TABLET
        ===================================== */

        @media (min-width: 651px) and (max-width: 900px) {

            .products-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

                gap: 22px 14px;
            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 650px) {

            .header-inner {
                flex-wrap: wrap;
                gap: 12px;
            }


            .logo {
                width: 100%;
            }


            .header-links {
                display: none;
            }


            .search {
                width: 100%;
            }


            .search button {
                padding: 0 16px;
            }


            .container {
                padding:
                    24px 10px 35px;
            }


            .page-title {
                margin-bottom: 18px;
            }


            .page-title h1 {
                font-size: 24px;
            }


            .page-title p {
                font-size: 13px;
                line-height: 1.8;
            }


            .toolbar {
                padding: 10px;
                margin-bottom: 18px;
                border-radius: 14px;
            }


            .toolbar select {
                flex: 1;

                min-width:
                    calc(50% - 6px);

                padding:
                    10px 9px;

                font-size: 12px;
            }


            /*
             * IMPORTANT:
             * Mobile is ALWAYS exactly 2 columns.
             */
            .products-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap:
                    18px 8px;
            }


            .seller-box {
                gap: 4px;

                margin:
                    0 2px 7px;

                min-height: 31px;
            }


            .seller-link {
                gap: 5px;
                flex: 1;
            }


            .seller-avatar,
            .seller-avatar-placeholder {
                width: 30px;
                height: 30px;

                font-size: 14px;
            }


            .seller-name {
                max-width: 75px;
                font-size: 10px;
            }


            .follow-btn {
                padding:
                    5px 6px;

                font-size: 8px;

                border-radius: 7px;
            }


            .product-card {
                border-radius: 12px;
            }


            .product-info {
                padding: 10px;
            }


            .product-info h3 {
                font-size: 12px;

                line-height: 1.55;

                margin-bottom: 7px;

                min-height:
                    37px;
            }


            .price {
                font-size: 14px;

                margin-bottom: 6px;

                line-height: 1.5;
            }


            .location {
                font-size: 10px;

                margin-bottom: 6px;
            }


            .condition {
                padding:
                    4px 6px;

                font-size: 9px;
            }


            .social-actions {
                gap: 5px;

                padding:
                    7px 7px 8px;
            }


            .social-btn {
                min-height: 34px;

                border-radius: 8px;

                font-size: 10px;

                gap: 3px;
            }


            .social-count {
                font-size: 10px;
            }


            .photo-count {
                left: 6px;
                bottom: 6px;

                padding:
                    4px 6px;

                font-size: 9px;
            }


            .products-loading {
                min-height: 230px;

                border-radius: 16px;

                padding:
                    30px 15px;
            }


            .products-loading-title {
                font-size: 14px;
            }


            .products-loading-text {
                font-size: 11px;
            }


            .empty {
                padding:
                    55px 15px;

                border-radius: 16px;
            }

        }


        /* =====================================
           VERY SMALL MOBILE
           STILL 2 PRODUCTS PER ROW
        ===================================== */

        @media (max-width: 400px) {

            .products-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap:
                    15px 7px;
            }


            .container {
                padding-left: 8px;
                padding-right: 8px;
            }


            .product-info {
                padding: 8px;
            }


            .product-info h3 {
                font-size: 11px;
            }


            .price {
                font-size: 13px;
            }


            .location {
                font-size: 9px;
            }


            .social-btn {
                font-size: 9px;
            }


            .social-count {
                font-size: 9px;
            }


            .seller-name {
                max-width: 62px;
            }


            .follow-btn {
                font-size: 7px;
                padding:
                    4px 5px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="header-inner">

        <a href="index.html" class="logo">
            🛒 بازارک
        </a>

        <form class="search" id="searchForm">

            <input
                type="search"
                id="searchInput"
                placeholder="دنبال چه چیزی می‌گردید؟"
                autocomplete="off"
            >

            <button type="submit">
                جستجو
            </button>

        </form>

        <div class="header-links">

            <a href="index.html">
                خانه
            </a>

            <a href="login.html">
                ورود
            </a>

        </div>

    </div>

</header>


<main class="container">

    <div class="page-title">

        <h1 id="pageTitle">
            همه محصولات
        </h1>

        <p id="pageDescription">
            محصولات ثبت‌شده توسط فروشندگان بازارک
        </p>

    </div>


    <div
        id="activeCategory"
        class="active-category"
    ></div>


    <div class="toolbar">

        <select id="categoryFilter">

            <option value="all">
                همه دسته‌بندی‌ها
            </option>

            <option value="mobile">
                📱 موبایل
            </option>

            <option value="computer">
                💻 کامپیوتر و لپ‌تاپ

    /* =====================================
       THEME SYSTEM
       Reads the theme used by index.html.
    ===================================== */

    function getStoredTheme() {

        const possibleKeys = [

            "bazaarak-theme",
            "theme",
            "themeMode",
            "darkMode"

        ];


        for (
            const key of possibleKeys
        ) {

            try {

                const value =
                    localStorage.getItem(key);


                if (
                    value === "dark" ||
                    value === "light"
                ) {

                    return value;

                }


                if (
                    key === "darkMode" &&
                    value === "true"
                ) {

                    return "dark";

                }


                if (
                    key === "darkMode" &&
                    value === "false"
                ) {

                    return "light";

                }

            } catch (error) {

                console.warn(
                    "Theme read error:",
                    error
                );

            }

        }


        return null;

    }


    function applyTheme(
        theme
    ) {

        let finalTheme =
            theme;


        if (
            finalTheme !== "dark" &&
            finalTheme !== "light"
        ) {

            finalTheme =
                window.matchMedia &&
                window.matchMedia(
                    "(prefers-color-scheme: dark)"
                ).matches
                    ? "dark"
                    : "light";

        }


        document.documentElement
            .setAttribute(
                "data-theme",
                finalTheme
            );


        document.body.classList.toggle(
            "dark",
            finalTheme === "dark"
        );


        document.documentElement.classList.toggle(
            "dark",
            finalTheme === "dark"
        );

    }


    function syncTheme() {

        applyTheme(
            getStoredTheme()
        );

    }


    syncTheme();

        "storage",
        function(event) {

            if (
                [
                    "bazaarak-theme",

                    event.key

    /* =====================================
       LOAD LIKE + COMMENT DATA
    ===================================== */

    async function loadSocialData(
        products
    ) {

        if (!products.length) {
            return;
        }


        const productIds =
            products.map(
                product =>
                    product.id
            );


        /* =================================
           LIKES
        ================================= */

        const {
            data: likes,
            error: likesError
        } =
        await supabaseClient
            .from("product_likes")
            .select(
                "product_id,user_id"
            )
            .in(
                "product_id",
                productIds
            );


        if (likesError) {

            console.error(
                "Likes Error:",
                likesError
            );

        }


        const likeCounts = {};


        (likes || []).forEach(
            like => {

                likeCounts[
                    like.product_id
                ] =
                    (
                        likeCounts[
                            like.product_id
                        ] || 0
                    ) + 1;

            }
        );


        productIds.forEach(
            productId => {

                const count =
                    likeCounts[
                        productId
                    ] || 0;


                const element =
                    document.querySelector(
                        `[data-like-count="${productId}"]`
                    );


                if (element) {

                    element.textContent =
                        count;

                }

            }
        );


        /* =================================
           CURRENT USER LIKES
        ================================= */

        if (currentUser) {

            (likes || []).forEach(
                like => {

                    if (
                        like.user_id ===
                        currentUser.id
                    ) {

                        const button =
                            document.getElementById(
                                `like-btn-${like.product_id}`
                            );


                        if (button) {

                            button.classList.add(
                                "liked"
                            );

                        }

                    }

                }
            );

        }


        /* =================================
           COMMENTS
        ================================= */

        const {
            data: comments,
            error: commentsError
        } =
        await supabaseClient
            .from("product_comments")
            .select(
                "product_id"
            )
            .in(
                "product_id",
                productIds
            );


        if (commentsError) {

            console.error(
                "Comments Error:",
                commentsError
            );

            return;

        }


        const commentCounts = {};


        (comments || []).forEach(
            comment => {

                commentCounts[
                    comment.product_id
                ] =
                    (
                        commentCounts[
                            comment.product_id
                        ] || 0
                    ) + 1;

            }
        );


        productIds.forEach(
            productId => {

                const count =
                    commentCounts[
                        productId
                    ] || 0;


                const element =
                    document.querySelector(
                        `[data-comment-count="${productId}"]`
                    );


                if (element) {

                    element.textContent =
                        count;

                }

            }
        );

    }


    /* =====================================
       LIKE
    ===================================== */

    async function toggleLike(
        productId
    ) {

        if (!currentUser) {

            alert(
                "برای لایک کردن ابتدا وارد حساب شوید."
            );

            return;

        }


        const button =
            document.getElementById(
                `like-btn-${productId}`
            );


        if (!button) {
            return;
        }


        button.disabled = true;


        const alreadyLiked =
            button.classList.contains(
                "liked"
            );


        if (alreadyLiked) {

            const {
                error
            } =
            await supabaseClient
                .from("product_likes")
                .delete()
                .eq(
                    "product_id",
                    productId
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


            if (error) {

                console.error(
                    "Unlike Error:",
                    error
                );

                alert(
                    "لغو لایک انجام نشد."
                );

            } else {

                button.classList.remove(
                    "liked"
                );


                const countElement =
                    document.querySelector(
                        `[data-like-count="${productId}"]`
                    );


                if (countElement) {

                    const oldCount =
                        Number(
                            countElement.textContent
                        ) || 0;


                    countElement.textContent =
                        Math.max(
                            0,
                            oldCount - 1
                        );

                }

            }

        } else {

            const {
                error
            } =
            await supabaseClient
                .from("product_likes")
                .insert({

                    product_id:
                        productId,

                    user_id:
                        currentUser.id

                });


            if (error) {

                console.error(
                    "Like Error:",
                    error
                );


                if (
                    error.code !==
                    "23505"
                ) {

                    alert(
                        "لایک انجام نشد."
                    );

                }

            } else {

                button.classList.add(
                    "liked"
                );


                const countElement =
                    document.querySelector(
                        `[data-like-count="${productId}"]`
                    );


                if (countElement) {

                    const oldCount =
                        Number(
                            countElement.textContent
                        ) || 0;


                    countElement.textContent =
                        oldCount + 1;

                }

            }

        }


        button.disabled = false;

    }

    async function toggleFollowFromProducts(
        button,

        if (!currentUser) {

            alert(
                "برای دنبال کردن فروشنده ابتدا وارد حساب شوید."

            return;

        }


        if (
            currentUser.id === sellerId

        if (button.disabled) {

        }


        button.disabled = true;


        const {
            error
        } =
        await supabaseClient
            .from("followers")
            .insert({

                follower_id:
                    currentUser.id,

                following_id:
                    sellerId

            });


        if (error) {

            console.error(
                "Follow Error:",
                error
            );


            if (
                error.code === "23505"
            ) {

                followingUsers.add(
                    sellerId
                );

                button.remove();

            } else {

                alert(
                    "دنبال کردن انجام نشد."
                );

                button.disabled = false;

            }


            return;

        }


        followingUsers.add(
            sellerId
        );


        button.remove();

    }


    /* =====================================
       GET IMAGES
    ===================================== */

    function getProductImages(
        product
    ) {

        let images = [];


        if (
            Array.isArray(
                product.image_urls
            )
        ) {

            images =
                product.image_urls.filter(
                    url =>
                        typeof url === "string" &&
                        url.trim() !== ""
                );

        }


        if (
            images.length === 0 &&
            product.image_url
        ) {

            images = [
                product.image_url
            ];

        }


        return images;

    }

        window.location.href =
            "product.html?id=" +
            encodeURIComponent(id);

    }


    /* =====================================
       SEARCH
    ===================================== */

    searchForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            updateURL();

            applyFilters();

        }
    );


    searchInput.addEventListener(
        "input",
        function() {

            updateURL();

            applyFilters();

        }
    );


    /* =====================================
       CATEGORY
    ===================================== */

    categoryFilter.addEventListener(
        "change",
        function() {

            updateURL();

            applyFilters();

        }
    );


    /* =====================================
       SORT
    ===================================== */

    sortFilter.addEventListener(
        "change",
        function() {

            applyFilters();

        }
    );


    /* =====================================
       FILTER
    ===================================== */

    function applyFilters() {

        let filtered =
            [...allProducts];


        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const category =
            categoryFilter.value;


        const sort =
            sortFilter.value;


        if (search) {

            filtered =
                filtered.filter(
                    product => {

                        const title =
                            String(
                                product.title ||
                                ""
                            )
                            .toLowerCase();


                        const description =
                            String(
                                product.description ||
                                ""
                            )
                            .toLowerCase();


                        const city =
                            String(
                                product.city ||
                                ""
                            )
                            .toLowerCase();


                        return (

                            title.includes(
                                search
                            ) ||

                            description.includes(
                                search
                            ) ||

                            city.includes(
                                search
                            )

                        );

                    }
                );

        }


        if (
            category !== "all"
        ) {

            filtered =
                filtered.filter(
                    product =>
                        product.category ===
                        category
                );

        }


        if (
            sort === "cheap"
        ) {

            filtered.sort(
                (a, b) =>
                    Number(a.price) -
                    Number(b.price)
            );

        }


        if (
            sort === "expensive"
        ) {

            filtered.sort(
                (a, b) =>
                    Number(b.price) -
                    Number(a.price)
            );

        }


        if (
            sort === "new"
        ) {

            filtered.sort(
                (a, b) =>
                    new Date(
                        b.created_at
                    ) -
                    new Date(
                        a.created_at
                    )
            );

        }


        updateCategoryUI(
            category,
            filtered.length
        );


        renderProducts(
            filtered
        );

    }


    /* =====================================
       CATEGORY UI
    ===================================== */

    function updateCategoryUI(
        category,
        count
    ) {

        if (
            category &&
            category !== "all"
        ) {

            const name =
                categoryNames[
                    category
                ] || category;


            pageTitle.textContent =
                name;


            pageDescription.textContent =
                `${count} محصول در این دسته‌بندی`;


            activeCategory.textContent =
                `🏷️ دسته‌بندی فعال: ${name}`;


            activeCategory.classList.add(
                "show"
            );

        } else {

            pageTitle.textContent =
                "همه محصولات";


            pageDescription.textContent =
                "کالاهای ثبت‌شده توسط فروشندگان بازارک";


            activeCategory.textContent =
                "";


            activeCategory.classList.remove(
                "show"
            );

        }

    }


    /* =====================================
       UPDATE URL
    ===================================== */

    function updateURL() {

        const params =
            new URLSearchParams();


        const category =
            categoryFilter.value;


        const search =
            searchInput.value.trim();


        if (
            category &&
            category !== "all"
        ) {

            params.set(
                "category",
                category
            );

        }


        if (search) {

            params.set(
                "search",
                search
            );

        }


        const query =
            params.toString();


        const newURL =
            query
                ? "products.html?" + query
                : "products.html";


        window.history.replaceState(
            {},
            "",
            newURL
        );

    }


    /* =====================================
       CONDITION
    ===================================== */

    function getConditionName(
        condition
    ) {

        const conditions = {

            new:
                "✨ نو",

            used:
                "♻️ کارکرده"

        };


        return (
            conditions[condition] ||
            condition ||
            "موجود"
        );

    }


    /* =====================================
       CITY
    ===================================== */

    function getCityName(
        city
    ) {

        const cities = {

            "Mazar-e-Sharif":
                "مزار شریف",

            Kabul:
                "کابل",

            Herat:
                "هرات",

            Kandahar:
                "کندهار",

            Jowzjan:
                "جوزجان",

            Balkh:
                "بلخ",

            Nangarhar:
                "ننگرهار",

            Other:
                "سایر"

        };


        return (
            cities[city] ||
            city ||
            "افغانستان"
        );

    }


    /* =====================================
       PRICE
    ===================================== */

    function formatPrice(
        price
    ) {

        if (
            price === null ||
            price === undefined ||
            price === ""
        ) {

            return "قیمت نامشخص";

        }


        return Number(price)
            .toLocaleString("fa-AF");

    }


    /* =====================================
       ESCAPE HTML
    ===================================== */

    function escapeHTML(
        value
    ) {

        return String(
            value ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* =====================================
       START
    ===================================== */

    loadProducts();

</script>

</body>
</html>
