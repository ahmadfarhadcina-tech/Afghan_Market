<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>محصولات | بازارک</title>

    <meta
        name="description"
        content="مشاهده محصولات و کالاهای موجود در بازارک، بازار آنلاین افغانستان"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7f6;
            color: #17211d;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        a,
        button {
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e9e7;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #087a55;
            white-space: nowrap;
        }

        .search {
            flex: 1;
            display: flex;
            background: #f1f4f2;
            border-radius: 12px;
            overflow: hidden;
        }

        .search input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 13px 16px;
            font-size: 14px;
        }

        .search button {
            border: none;
            background: #087a55;
            color: white;
            padding: 0 22px;
            cursor: pointer;
        }

        .search button:hover {
            background: #055c40;
        }

        .header-links {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #69746f;
        }

        .toolbar {
            background: white;
            border: 1px solid #e5e9e7;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .toolbar select {
            padding: 12px 15px;
            border: 1px solid #dce2df;
            border-radius: 10px;
            background: white;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        .active-category {
            display: none;
            background: #eef8f4;
            color: #087a55;
            border: 1px solid #d5eee3;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .active-category.show {
            display: block;
        }


        /* ==============================
           PRODUCTS GRID
        ============================== */

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px 18px;
            align-items: start;
        }

        .product-item {
            min-width: 0;
        }


        /* ==============================
           SELLER
        ============================== */

        .seller-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-width: 0;
            margin: 0 4px 9px;
            min-height: 36px;
        }

        .seller-link {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            max-width: 100%;
            width: fit-content;

            transition:
                transform 0.18s ease,
                opacity 0.18s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .seller-link:hover .seller-name {
            color: #087a55;
        }

        .seller-link:active {
            transform: scale(0.94);
            opacity: 0.75;
        }

        .seller-clicked {
            transform: scale(0.94);
            opacity: 0.75;
        }

        .seller-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            background: #e8eeeb;
            border: 1px solid #dce5e0;
            flex-shrink: 0;
        }

        .seller-avatar-placeholder {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #087a55;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .seller-name {
            font-size: 12px;
            font-weight: bold;
            color: #39443f;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }


        /* ==============================
           FOLLOW
        ============================== */

        .follow-btn {
            border: none;
            background: #087a55;
            color: white;
            padding: 6px 11px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                opacity 0.18s ease;

            flex-shrink: 0;
        }

        .follow-btn:hover {
            background: #055c40;
        }

        .follow-btn:active {
            transform: scale(0.92);
        }

        .follow-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }


        /* ==============================
           PRODUCT CARD
        ============================== */

        .product-card {
            background: white;
            border: 1px solid #e5e9e7;
            border-radius: 16px;
            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .product-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 30px
                rgba(0,0,0,0.08);
        }

        .product-card:active {
            transform: scale(0.985);
        }


        /* ==============================
           PRODUCT IMAGE
        ============================== */

        .product-image {
            width: 100%;
            background: transparent;
            display: block;
            position: relative;
            overflow: hidden;
            line-height: 0;
        }

        .product-image img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: initial;
            object-position: initial;
        }

        .no-image {
            min-height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef2f0;
            font-size: 55px;
            line-height: normal;
        }

        .photo-count {
            position: absolute;
            left: 10px;
            bottom: 10px;

            background: rgba(0,0,0,.65);
            color: white;

            padding: 5px 9px;
            border-radius: 8px;

            font-size: 11px;
            direction: rtl;

            pointer-events: none;
            line-height: normal;
        }


        /* ==============================
           PRODUCT INFO
        ============================== */

        .product-info {
            padding: 16px;
        }

        .product-info h3 {
            font-size: 16px;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .price {
            color: #087a55;
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .location {
            color: #7a8580;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .condition {
            display: inline-block;
            background: #eef8f4;
            color: #087a55;
            padding: 5px 9px;
            border-radius: 7px;
            font-size: 11px;
        }


        /* ==============================
           SOCIAL ACTIONS
        ============================== */

        .social-actions {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 10px 12px 12px;

            border-top: 1px solid #edf1ef;
            background: #ffffff;
        }

        .social-btn {
            flex: 1;

            border: 1px solid #e3e9e6;
            background: #f8faf9;
            color: #39443f;

            min-height: 40px;

            border-radius: 11px;

            font-family: inherit;
            font-size: 13px;
            font-weight: bold;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease;
        }

        .social-btn:hover {
            background: #eef8f4;
            border-color: #cfe9dd;
            color: #087a55;
        }

        .social-btn:active {
            transform: scale(0.94);
        }

        .like-btn.liked {
            background: #fff0f0;
            border-color: #ffd2d2;
            color: #e53935;
        }

        .social-count {
            font-size: 12px;
            font-weight: 900;
        }


        /* ==============================
           OTHER
        ============================== */

        .empty {
            background: white;
            border: 1px dashed #cfd8d3;
            border-radius: 20px;
            padding: 70px 20px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .empty-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #69746f;
            margin-bottom: 22px;
        }

        .sell-button {
            display: inline-block;
            background: #087a55;
            color: white;
            padding: 13px 24px;
            border-radius: 10px;
            font-weight: bold;
        }

        .loading {
            grid-column: 1 / -1;
            background: white;
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            color: #087a55;
            font-size: 18px;
        }

        .error {
            grid-column: 1 / -1;
            background: #fff4f4;
            border: 1px solid #ffd0d0;
            color: #b42318;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 900px) {

            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 650px) {

            .header-inner {
                flex-wrap: wrap;
            }

            .logo {
                width: 100%;
            }

            .header-links {
                display: none;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .page-title h1 {
                font-size: 24px;
            }

            .toolbar select {
                flex: 1;
                min-width: 140px;
            }

            .seller-box {
                gap: 5px;
                margin-left: 2px;
                margin-right: 2px;
            }

            .seller-link {
                gap: 6px;
                flex: 1;
            }

            .seller-name {
                max-width: 85px;
            }

            .follow-btn {
                padding: 6px 8px;
                font-size: 9px;
            }

        }

        @media (max-width: 400px) {

            .products-grid {
                grid-template-columns: 1fr;
            }

            .seller-name {
                max-width: 140px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="header-inner">

        <a href="index.html" class="logo">
            🛒 بازارک
        </a>

        <form class="search" id="searchForm">

            <input
                type="search"
                id="searchInput"
                placeholder="دنبال چه چیزی می‌گردید؟"
            >

            <button type="submit">
                جستجو
            </button>

        </form>

        <div class="header-links">

            <a href="index.html">
                خانه
            </a>

            <a href="login.html">
                ورود
            </a>

        </div>

    </div>

</header>


<main class="container">

    <div class="page-title">

        <h1 id="pageTitle">
            همه محصولات
        </h1>

        <p id="pageDescription">
            کالاهای ثبت‌شده توسط فروشندگان بازارک
        </p>

    </div>


    <div
        id="activeCategory"
        class="active-category"
    ></div>


    <div class="toolbar">

        <select id="categoryFilter">

            <option value="all">
                همه دسته‌بندی‌ها
            </option>

            <option value="mobile">
                📱 موبایل
            </option>

            <option value="computer">
                💻 کامپیوتر و لپ‌تاپ
            </option>

            <option value="fashion">
                👕 فیشن
            </option>

            <option value="shoes">
                👟 کفش
            </option>

            <option value="gaming">
                🎮 گیمینگ
            </option>

            <option value="home">
                🏠 خانه
            </option>

            <option value="tools">
                🔧 ابزار
            </option>

            <option value="vehicle">
                🚗 موتر
            </option>

        </select>


        <select id="sortFilter">

            <option value="new">
                جدیدترین
            </option>

            <option value="cheap">
                ارزان‌ترین
            </option>

            <option value="expensive">
                گران‌ترین
            </option>

        </select>

    </div>


    <section
        class="products-grid"
        id="productsGrid"
    >

        <div class="loading">
            ⏳ در حال دریافت محصولات...
        </div>

    </section>

</main>


<script>

    /* ==============================
       SUPABASE
    ============================== */

    const SUPABASE_URL =
        "https://vhiewoopyqugdxwvsbno.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* ==============================
       ELEMENTS
    ============================== */

    const productsGrid =
        document.getElementById(
            "productsGrid"
        );

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const searchForm =
        document.getElementById(
            "searchForm"
        );

    const categoryFilter =
        document.getElementById(
            "categoryFilter"
        );

    const sortFilter =
        document.getElementById(
            "sortFilter"
        );

    const activeCategory =
        document.getElementById(
            "activeCategory"
        );

    const pageTitle =
        document.getElementById(
            "pageTitle"
        );

    const pageDescription =
        document.getElementById(
            "pageDescription"
        );


    let allProducts = [];

    let currentUser = null;

    let followingUsers = new Set();


    /* ==============================
       CATEGORY NAMES
    ============================== */

    const categoryNames = {

        all:
            "همه دسته‌بندی‌ها",

        mobile:
            "📱 موبایل",

        computer:
            "💻 کامپیوتر و لپ‌تاپ",

        fashion:
            "👕 فیشن",

        shoes:
            "👟 کفش",

        gaming:
            "🎮 گیمینگ",

        home:
            "🏠 خانه",

        tools:
            "🔧 ابزار",

        vehicle:
            "🚗 موتر"

    };


    /* ==============================
       URL VALUES
    ============================== */

    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    const urlCategory =
        urlParams.get("category");

    const urlSearch =
        urlParams.get("search");


    if (
        urlCategory &&
        categoryNames[urlCategory]
    ) {

        categoryFilter.value =
            urlCategory;

    }


    if (urlSearch) {

        searchInput.value =
            urlSearch;

    }


    /* ==============================
       GET CURRENT USER
    ============================== */

    async function getCurrentUser() {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getUser();


        if (
            !error &&
            data &&
            data.user
        ) {

            currentUser =
                data.user;

        } else {

            currentUser = null;

        }

    }


    /* ==============================
       LOAD FOLLOWING USERS
    ============================== */

    async function loadFollowingUsers(
        sellerIds
    ) {

        followingUsers =
            new Set();


        if (
            !currentUser ||
            !sellerIds.length
        ) {

            return;

        }


        const {
            data,
            error
        } =
        await supabaseClient
            .from("followers")
            .select(
                "following_id"
            )
            .eq(
                "follower_id",
                currentUser.id
            )
            .in(
                "following_id",
                sellerIds
            );


        if (error) {

            console.error(
                "Following Error:",
                error
            );

            return;

        }


        (data || []).forEach(
            row => {

                followingUsers.add(
                    row.following_id
                );

            }
        );

    }


    /* ==============================
       LOAD PRODUCTS
    ============================== */

    async function loadProducts() {

        productsGrid.innerHTML = `

            <div class="loading">
                ⏳ در حال دریافت محصولات...
            </div>

        `;


        await getCurrentUser();


        const {
            data,
            error
        } =
        await supabaseClient
            .from("products")
            .select(`
                id,
                title,
                description,
                price,
                category,
                city,
                image_url,
                image_urls,
                condition,
                stock,
                seller_id,
                status,
                created_at
            `)
            .eq("status", "active")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "Supabase Error:",
                error
            );


            productsGrid.innerHTML = `

                <div class="error">

                    <h2>
                        ❌ خطا در دریافت محصولات
                    </h2>

                    <p>
                        ${escapeHTML(
                            error.message
                        )}
                    </p>

                </div>

            `;

            return;
        }


        allProducts =
            data || [];


        /* ==============================
           LOAD SELLER PROFILES
        ============================== */

        const sellerIds =
            [
                ...new Set(
                    allProducts
                        .map(
                            product =>
                                product.seller_id
                        )
                        .filter(Boolean)
                )
            ];


        let sellerProfiles = {};


        if (sellerIds.length) {

            const {
                data: profiles,
                error: profileError
            } =
            await supabaseClient
                .from("profiles")
                .select(`
                    id,
                    username,
                    full_name,
                    avatar_url
                `)
                .in(
                    "id",
                    sellerIds
                );


            if (profileError) {

                console.error(
                    "Profile Error:",
                    profileError
                );

            } else {

                (profiles || []).forEach(
                    profile => {

                        sellerProfiles[
                            profile.id
                        ] = profile;

                    }
                );

            }

        }


        /* ==============================
           LOAD FOLLOW STATUS
        ============================== */

        await loadFollowingUsers(
            sellerIds
        );


        allProducts =
            allProducts.map(
                product => ({

                    ...product,

                    sellerProfile:
                        sellerProfiles[
                            product.seller_id
                        ] || null

                })
            );


        applyFilters();

    }


    /* ==============================
       RENDER PRODUCTS
    ============================== */

    function renderProducts(
        products
    ) {

        if (!products.length) {

            const currentCategory =
                categoryFilter.value;


            const categoryText =
                categoryNames[
                    currentCategory
                ] || "این دسته";


            productsGrid.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🔍
                    </div>

                    <h2>
                        محصولی پیدا نشد
                    </h2>

                    <p>
                        در ${escapeHTML(categoryText)}
                        محصول فعالی پیدا نشد.
                    </p>

                    <a
                        href="seller.html"
                        class="sell-button"
                    >
                        فروشنده شوید
                    </a>

                </div>

            `;

            return;
        }


        productsGrid.innerHTML =
            products
                .map(
                    product =>
                        createProductCard(
                            product
                        )
                )
                .join("");


        loadSocialData(
            products
        );

    }


    /* ==============================
       PRODUCT CARD
    ============================== */

    function createProductCard(
        product
    ) {

        const images =
            getProductImages(
                product
            );


        const firstImage =
            images.length
                ? images[0]
                : null;


        let imageHTML;


        if (firstImage) {

            imageHTML = `

                <img
                    src="${escapeHTML(firstImage)}"
                    alt="${escapeHTML(product.title)}"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                        this.parentElement.insertAdjacentHTML(
                            'beforeend',
                            '<div class=&quot;no-image&quot;>🛍️</div>'
                        )
                    "
                >

            `;

        } else {

            imageHTML = `

                <div class="no-image">
                    🛍️
                </div>

            `;

        }


        const photoCountHTML =
            images.length > 1

            ? `

                <div class="photo-count">

                    📷 ${images.length}

                </div>

              `

            : "";


        const city =
            product.city ||
            "افغانستان";


        const condition =
            getConditionName(
                product.condition
            );


        /* ==============================
           SELLER
        ============================== */

        const seller =
            product.sellerProfile;


        const sellerName =
            seller?.username ||
            seller?.full_name ||
            "فروشنده";


        const sellerId =
            product.seller_id;


        let sellerAvatarHTML;


        if (
            seller &&
            seller.avatar_url
        ) {

            sellerAvatarHTML = `

                <img
                    class="seller-avatar"
                    src="${escapeHTML(
                        seller.avatar_url
                    )}"
                    alt="${escapeHTML(
                        sellerName
                    )}"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                    "
                >

                <div
                    class="seller-avatar-placeholder"
                    style="display:none;"
                >
                    👤
                </div>

            `;

        } else {

            sellerAvatarHTML = `

                <div class="seller-avatar-placeholder">
                    👤
                </div>

            `;

        }


        const alreadyFollowing =
            sellerId &&
            followingUsers.has(
                sellerId
            );


        const isOwnProfile =
            currentUser &&
            sellerId === currentUser.id;


        let followButtonHTML = "";


        if (
            sellerId &&
            !isOwnProfile &&
            !alreadyFollowing
        ) {

            followButtonHTML = `

                <button
                    type="button"
                    class="follow-btn"
                    data-seller-id="${escapeHTML(
                        sellerId
                    )}"
                    onclick="
                        event.stopPropagation();
                        toggleFollowFromProducts(
                            this,
                            '${escapeHTML(sellerId)}'
                        );
                    "
                >
                    + دنبال کردن
                </button>

            `;

        }


        const sellerHTML =
            sellerId

            ? `

                <div class="seller-box">

                    <a
                        href="seller-profile.html?id=${encodeURIComponent(
                            sellerId
                        )}"
                        class="seller-link"
                        onclick="
                            event.stopPropagation();
                            sellerClickAnimation(this, event);
                        "
                    >

                        ${sellerAvatarHTML}

                        <span class="seller-name">
                            ${escapeHTML(
                                sellerName
                            )}
                        </span>

                    </a>

                    ${followButtonHTML}

                </div>

              `

            : "";


        /* ==============================
           SOCIAL
        ============================== */

        const socialHTML = `

            <div
                class="social-actions"
                onclick="event.stopPropagation();"
            >

                <button
                    type="button"
                    class="social-btn like-btn"
                    id="like-btn-${escapeHTML(product.id)}"
                    onclick="
                        toggleLike(
                            '${escapeHTML(product.id)}'
                        );
                    "
                >

                    ❤️

                    <span>
                        لایک
                    </span>

                    <span
                        class="social-count"
                        data-like-count="${escapeHTML(product.id)}"
                    >
                        0
                    </span>

                </button>


                <button
                    type="button"
                    class="social-btn"
                    onclick="
                        openComments(
                            '${escapeHTML(product.id)}'
                        );
                    "
                >

                    💬

                    <span>
                        نظر
                    </span>

                    <span
                        class="social-count"
                        data-comment-count="${escapeHTML(product.id)}"
                    >
                        0
                    </span>

                </button>

            </div>

        `;


        return `

            <div class="product-item">

                ${sellerHTML}

                <article
                    class="product-card"
                    onclick="
                        openProduct(
                            '${escapeHTML(product.id)}'
                        )
                    "
                >

                    <div class="product-image">

                        ${imageHTML}

                        ${photoCountHTML}

                    </div>


                    <div class="product-info">

                        <h3>

                            ${escapeHTML(
                                product.title
                            )}

                        </h3>


                        <div class="price">

                            ${formatPrice(
                                product.price
                            )}

                            افغانی

                        </div>


                        <div class="location">

                            📍

                            ${escapeHTML(
                                getCityName(city)
                            )}

                        </div>


                        <span class="condition">

                            ${condition}

                        </span>

                    </div>


                    ${socialHTML}

                </article>

            </div>

        `;

    }


    /* ==============================
       LOAD LIKE + COMMENT DATA
    ============================== */

    async function loadSocialData(
        products
    ) {

        if (!products.length) {
            return;
        }


        const productIds =
            products.map(
                product =>
                    product.id
            );


        /* ==============================
           LOAD LIKES
        ============================== */

        const {
            data: likes,
            error: likesError
        } =
        await supabaseClient
            .from("product_likes")
            .select(
                "product_id,user_id"
            )
            .in(
                "product_id",
                productIds
            );


        if (likesError) {

            console.error(
                "Likes Error:",
                likesError
            );

        }


        const likeCounts = {};


        (likes || []).forEach(
            like => {

                likeCounts[
                    like.product_id
                ] =
                    (
                        likeCounts[
                            like.product_id
                        ] || 0
                    ) + 1;

            }
        );


        productIds.forEach(
            productId => {

                const count =
                    likeCounts[
                        productId
                    ] || 0;


                const element =
                    document.querySelector(
                        `[data-like-count="${productId}"]`
                    );


                if (element) {

                    element.textContent =
                        count;

                }

            }
        );


        /* ==============================
           CURRENT USER LIKES
        ============================== */

        if (currentUser) {

            (likes || []).forEach(
                like => {

                    if (
                        like.user_id ===
                        currentUser.id
                    ) {

                        const button =
                            document.getElementById(
                                `like-btn-${like.product_id}`
                            );


                        if (button) {

                            button.classList.add(
                                "liked"
                            );

                        }

                    }

                }
            );

        }


        /* ==============================
           LOAD COMMENTS COUNT
        ============================== */

        const {
            data: comments,
            error: commentsError
        } =
        await supabaseClient
            .from("product_comments")
            .select(
                "product_id"
            )
            .in(
                "product_id",
                productIds
            );


        if (commentsError) {

            console.error(
                "Comments Error:",
                commentsError
            );

            return;

        }


        const commentCounts = {};


        (comments || []).forEach(
            comment => {

                commentCounts[
                    comment.product_id
                ] =
                    (
                        commentCounts[
                            comment.product_id
                        ] || 0
                    ) + 1;

            }
        );


        productIds.forEach(
            productId => {

                const count =
                    commentCounts[
                        productId
                    ] || 0;


                const element =
                    document.querySelector(
                        `[data-comment-count="${productId}"]`
                    );


                if (element) {

                    element.textContent =
                        count;

                }

            }
        );

    }


    /* ==============================
       LIKE
    ============================== */

    async function toggleLike(
        productId
    ) {

        if (!currentUser) {

            alert(
                "برای لایک کردن ابتدا وارد حساب شوید."
            );

            return;

        }


        const button =
            document.getElementById(
                `like-btn-${productId}`
            );


        if (!button) {
            return;
        }


        button.disabled = true;


        const alreadyLiked =
            button.classList.contains(
                "liked"
            );


        if (alreadyLiked) {

            const {
                error
            } =
            await supabaseClient
                .from("product_likes")
                .delete()
                .eq(
                    "product_id",
                    productId
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


            if (error) {

                console.error(
                    "Unlike Error:",
                    error
                );

                alert(
                    "لغو لایک انجام نشد."
                );

            } else {

                button.classList.remove(
                    "liked"
                );


                const countElement =
                    document.querySelector(
                        `[data-like-count="${productId}"]`
                    );


                if (countElement) {

                    const oldCount =
                        Number(
                            countElement.textContent
                        ) || 0;


                    countElement.textContent =
                        Math.max(
                            0,
                            oldCount - 1
                        );

                }

            }

        } else {

            const {
                error
            } =
            await supabaseClient
                .from("product_likes")
                .insert({

                    product_id:
                        productId,

                    user_id:
                        currentUser.id

                });


            if (error) {

                console.error(
                    "Like Error:",
                    error
                );


                if (
                    error.code !==
                    "23505"
                ) {

                    alert(
                        "لایک انجام نشد."
                    );

                }

            } else {

                button.classList.add(
                    "liked"
                );


                const countElement =
                    document.querySelector(
                        `[data-like-count="${productId}"]`
                    );


                if (countElement) {

                    const oldCount =
                        Number(
                            countElement.textContent
                        ) || 0;


                    countElement.textContent =
                        oldCount + 1;

                }

            }

        }


        button.disabled = false;

    }


    /* ==============================
       OPEN COMMENTS
    ============================== */

    function openComments(
        productId
    ) {

        window.location.href =
            "comments.html?id=" +
            encodeURIComponent(
                productId
            );

    }


    /* ==============================
       SELLER CLICK ANIMATION
    ============================== */

    function sellerClickAnimation(
        element,
        event
    ) {

        event.stopPropagation();

        element.classList.add(
            "seller-clicked"
        );


        setTimeout(
            () => {

                window.location.href =
                    element.href;

            },
            120
        );

    }


    /* ==============================
       FOLLOW
    ============================== */

    async function toggleFollowFromProducts(
        button,
        sellerId
    ) {

        if (!currentUser) {

            alert(
                "برای دنبال کردن فروشنده ابتدا وارد حساب شوید."
            );

            return;

        }


        if (
            currentUser.id === sellerId
        ) {

            return;

        }


        if (button.disabled) {

            return;

        }


        button.disabled = true;


        const {
            error
        } =
        await supabaseClient
            .from("followers")
            .insert({

                follower_id:
                    currentUser.id,

                following_id:
                    sellerId

            });


        if (error) {

            console.error(
                "Follow Error:",
                error
            );


            if (
                error.code === "23505"
            ) {

                followingUsers.add(
                    sellerId
                );

                button.remove();

            } else {

                alert(
                    "دنبال کردن انجام نشد."
                );

                button.disabled = false;

            }


            return;

        }


        followingUsers.add(
            sellerId
        );


        button.remove();

    }


    /* ==============================
       GET IMAGES
    ============================== */

    function getProductImages(
        product
    ) {

        let images = [];


        if (
            Array.isArray(
                product.image_urls
            )
        ) {

            images =
                product.image_urls.filter(
                    url =>
                        typeof url === "string" &&
                        url.trim() !== ""
                );

        }


        if (
            images.length === 0 &&
            product.image_url
        ) {

            images = [
                product.image_url
            ];

        }


        return images;

    }


    /* ==============================
       OPEN PRODUCT
    ============================== */

    function openProduct(
        id
    ) {

        window.location.href =
            "product.html?id=" +
            encodeURIComponent(id);

    }


    /* ==============================
       SEARCH
    ============================== */

    searchForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            updateURL();

            applyFilters();

        }
    );


    searchInput.addEventListener(
        "input",
        function() {

            updateURL();

            applyFilters();

        }
    );


    /* ==============================
       CATEGORY
    ============================== */

    categoryFilter.addEventListener(
        "change",
        function() {

            updateURL();

            applyFilters();

        }
    );


    /* ==============================
       SORT
    ============================== */

    sortFilter.addEventListener(
        "change",
        function() {

            applyFilters();

        }
    );


    /* ==============================
       FILTER
    ============================== */

    function applyFilters() {

        let filtered =
            [...allProducts];


        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const category =
            categoryFilter.value;


        const sort =
            sortFilter.value;


        if (search) {

            filtered =
                filtered.filter(
                    product => {

                        const title =
                            String(
                                product.title ||
                                ""
                            )
                            .toLowerCase();


                        const description =
                            String(
                                product.description ||
                                ""
                            )
                            .toLowerCase();


                        const city =
                            String(
                                product.city ||
                                ""
                            )
                            .toLowerCase();


                        return (

                            title.includes(
                                search
                            ) ||

                            description.includes(
                                search
                            ) ||

                            city.includes(
                                search
                            )

                        );

                    }
                );

        }


        if (
            category !== "all"
        ) {

            filtered =
                filtered.filter(
                    product =>
                        product.category ===
                        category
                );

        }


        if (
            sort === "cheap"
        ) {

            filtered.sort(
                (a, b) =>
                    Number(a.price) -
                    Number(b.price)
            );

        }


        if (
            sort === "expensive"
        ) {

            filtered.sort(
                (a, b) =>
                    Number(b.price) -
                    Number(a.price)
            );

        }


        if (
            sort === "new"
        ) {

            filtered.sort(
                (a, b) =>
                    new Date(
                        b.created_at
                    ) -
                    new Date(
                        a.created_at
                    )
            );

        }


        updateCategoryUI(
            category,
            filtered.length
        );


        renderProducts(
            filtered
        );

    }


    /* ==============================
       CATEGORY UI
    ============================== */

    function updateCategoryUI(
        category,
        count
    ) {

        if (
            category &&
            category !== "all"
        ) {

            const name =
                categoryNames[
                    category
                ] || category;


            pageTitle.textContent =
                name;


            pageDescription.textContent =
                `${count} محصول در این دسته‌بندی`;


            activeCategory.textContent =
                `🏷️ دسته‌بندی فعال: ${name}`;


            activeCategory.classList.add(
                "show"
            );

        } else {

            pageTitle.textContent =
                "همه محصولات";


            pageDescription.textContent =
                "کالاهای ثبت‌شده توسط فروشندگان بازارک";


            activeCategory.textContent =
                "";


            activeCategory.classList.remove(
                "show"
            );

        }

    }


    /* ==============================
       UPDATE URL
    ============================== */

    function updateURL() {

        const params =
            new URLSearchParams();


        const category =
            categoryFilter.value;


        const search =
            searchInput.value.trim();


        if (
            category &&
            category !== "all"
        ) {

            params.set(
                "category",
                category
            );

        }


        if (search) {

            params.set(
                "search",
                search
            );

        }


        const query =
            params.toString();


        const newURL =
            query
                ? "products.html?" + query
                : "products.html";


        window.history.replaceState(
            {},
            "",
            newURL
        );

    }


    /* ==============================
       CONDITION
    ============================== */

    function getConditionName(
        condition
    ) {

        const conditions = {

            new:
                "✨ نو",

            used:
                "♻️ کارکرده"

        };


        return (
            conditions[condition] ||
            condition ||
            "موجود"
        );

    }


    /* ==============================
       CITY
    ============================== */

    function getCityName(
        city
    ) {

        const cities = {

            "Mazar-e-Sharif":
                "مزار شریف",

            Kabul:
                "کابل",

            Herat:
                "هرات",

            Kandahar:
                "کندهار",

            Jowzjan:
                "جوزجان",

            Balkh:
                "بلخ",

            Nangarhar:
                "ننگرهار",

            Other:
                "سایر"

        };


        return (
            cities[city] ||
            city ||
            "افغانستان"
        );

    }


    /* ==============================
       PRICE
    ============================== */

    function formatPrice(
        price
    ) {

        if (
            price === null ||
            price === undefined ||
            price === ""
        ) {

            return "قیمت نامشخص";

        }


        return Number(price)
            .toLocaleString("fa-AF");

    }


    /* ==============================
       ESCAPE HTML
    ============================== */

    function escapeHTML(
        value
    ) {

        return String(
            value ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* ==============================
       START
    ============================== */

    loadProducts();

</script>
