<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>محصولات | بازارک</title>

    <meta
        name="description"
        content="مشاهده محصولات و کالاهای موجود در بازارک، بازار آنلاین افغانستان"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7f6;
            color: #17211d;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e9e7;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #087a55;
            white-space: nowrap;
        }

        .search {
            flex: 1;
            display: flex;
            background: #f1f4f2;
            border-radius: 12px;
            overflow: hidden;
        }

        .search input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 13px 16px;
            font-size: 14px;
        }

        .search button {
            border: none;
            background: #087a55;
            color: white;
            padding: 0 22px;
            cursor: pointer;
        }

        .search button:hover {
            background: #055c40;
        }

        .header-links {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #69746f;
        }

        .toolbar {
            background: white;
            border: 1px solid #e5e9e7;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .toolbar select {
            padding: 12px 15px;
            border: 1px solid #dce2df;
            border-radius: 10px;
            background: white;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        .active-category {
            display: none;
            background: #eef8f4;
            color: #087a55;
            border: 1px solid #d5eee3;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .active-category.show {
            display: block;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .product-card {
            background: white;
            border: 1px solid #e5e9e7;
            border-radius: 16px;
            overflow: hidden;
            transition: 0.25s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow:
                0 12px 30px
                rgba(0,0,0,0.08);
        }

        .product-image {
            height: 190px;
            background: #eef2f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
        }

        .no-image {
            font-size: 55px;
        }

        .photo-count {
            position: absolute;
            left: 10px;
            bottom: 10px;
            background: rgba(0,0,0,.65);
            color: white;
            padding: 5px 9px;
            border-radius: 8px;
            font-size: 11px;
            direction: rtl;
        }

        /* ==============================
           SELLER
        ============================== */

        .seller-box {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 13px;
            min-width: 0;
        }

        .seller-link {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
            width: fit-content;
            max-width: 100%;
        }

        .seller-link:hover .seller-name {
            color: #087a55;
        }

        .seller-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            background: #e8eeeb;
            border: 1px solid #dce5e0;
            flex-shrink: 0;
        }

        .seller-avatar-placeholder {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #087a55;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .seller-name {
            font-size: 12px;
            font-weight: bold;
            color: #39443f;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-info {
            padding: 16px;
        }

        .product-info h3 {
            font-size: 16px;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .price {
            color: #087a55;
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .location {
            color: #7a8580;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .condition {
            display: inline-block;
            background: #eef8f4;
            color: #087a55;
            padding: 5px 9px;
            border-radius: 7px;
            font-size: 11px;
        }

        .empty {
            background: white;
            border: 1px dashed #cfd8d3;
            border-radius: 20px;
            padding: 70px 20px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .empty-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #69746f;
            margin-bottom: 22px;
        }

        .sell-button {
            display: inline-block;
            background: #087a55;
            color: white;
            padding: 13px 24px;
            border-radius: 10px;
            font-weight: bold;
        }

        .loading {
            grid-column: 1 / -1;
            background: white;
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            color: #087a55;
            font-size: 18px;
        }

        .error {
            grid-column: 1 / -1;
            background: #fff4f4;
            border: 1px solid #ffd0d0;
            color: #b42318;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }

        @media (max-width: 900px) {

            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 650px) {

            .header-inner {
                flex-wrap: wrap;
            }

            .logo {
                width: 100%;
            }

            .header-links {
                display: none;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .product-image {
                height: 150px;
            }

            .page-title h1 {
                font-size: 24px;
            }

            .toolbar select {
                flex: 1;
                min-width: 140px;
            }

        }

        @media (max-width: 400px) {

            .products-grid {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 200px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="header-inner">

        <a href="index.html" class="logo">
            🛒 بازارک
        </a>

        <form class="search" id="searchForm">

            <input
                type="search"
                id="searchInput"
                placeholder="دنبال چه چیزی می‌گردید؟"
            >

            <button type="submit">
                جستجو
            </button>

        </form>

        <div class="header-links">

            <a href="index.html">
                خانه
            </a>

            <a href="login.html">
                ورود
            </a>

        </div>

    </div>

</header>


<main class="container">

    <div class="page-title">

        <h1 id="pageTitle">
            همه محصولات
        </h1>

        <p id="pageDescription">
            کالاهای ثبت‌شده توسط فروشندگان بازارک
        </p>

    </div>


    <div
        id="activeCategory"
        class="active-category"
    ></div>


    <div class="toolbar">

        <select id="categoryFilter">

            <option value="all">
                همه دسته‌بندی‌ها
            </option>

            <option value="mobile">
                📱 موبایل
            </option>

            <option value="computer">
                💻 کامپیوتر و لپ‌تاپ
            </option>

            <option value="fashion">
                👕 فیشن
            </option>

            <option value="shoes">
                👟 کفش
            </option>

            <option value="gaming">
                🎮 گیمینگ
            </option>

            <option value="home">
                🏠 خانه
            </option>

            <option value="tools">
                🔧 ابزار
            </option>

            <option value="vehicle">
                🚗 موتر
            </option>

        </select>


        <select id="sortFilter">

            <option value="new">
                جدیدترین
            </option>

            <option value="cheap">
                ارزان‌ترین
            </option>

            <option value="expensive">
                گران‌ترین
            </option>

        </select>

    </div>


    <section
        class="products-grid"
        id="productsGrid"
    >

        <div class="loading">
            ⏳ در حال دریافت محصولات...
        </div>

    </section>

</main>


<script>

    /* ==============================
       SUPABASE
    ============================== */

    const SUPABASE_URL =
        "https://vhiewoopyqugdxwvsbno.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* ==============================
       ELEMENTS
    ============================== */

    const productsGrid =
        document.getElementById(
            "productsGrid"
        );

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const searchForm =
        document.getElementById(
            "searchForm"
        );

    const categoryFilter =
        document.getElementById(
            "categoryFilter"
        );

    const sortFilter =
        document.getElementById(
            "sortFilter"
        );

    const activeCategory =
        document.getElementById(
            "activeCategory"
        );

    const pageTitle =
        document.getElementById(
            "pageTitle"
        );

    const pageDescription =
        document.getElementById(
            "pageDescription"
        );


    let allProducts = [];


    /* ==============================
       CATEGORY NAMES
    ============================== */

    const categoryNames = {

        all:
            "همه دسته‌بندی‌ها",

        mobile:
            "📱 موبایل",

        computer:
            "💻 کامپیوتر و لپ‌تاپ",

        fashion:
            "👕 فیشن",

        shoes:
            "👟 کفش",

        gaming:
            "🎮 گیمینگ",

        home:
            "🏠 خانه",

        tools:
            "🔧 ابزار",

        vehicle:
            "🚗 موتر"

    };


    /* ==============================
       GET URL VALUES
    ============================== */

    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    const urlCategory =
        urlParams.get("category");

    const urlSearch =
        urlParams.get("search");


    if (
        urlCategory &&
        categoryNames[urlCategory]
    ) {

        categoryFilter.value =
            urlCategory;

    }


    if (urlSearch) {

        searchInput.value =
            urlSearch;

    }


    /* ==============================
       LOAD PRODUCTS
    ============================== */

    async function loadProducts() {

        productsGrid.innerHTML = `

            <div class="loading">

                ⏳ در حال دریافت محصولات...

            </div>

        `;


        const {
            data,
            error
        } =
        await supabaseClient
            .from("products")
            .select(`
                id,
                title,
                description,
                price,
                category,
                city,
                image_url,
                image_urls,
                condition,
                stock,
                seller_id,
                status,
                created_at
            `)
            .eq("status", "active")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "Supabase Error:",
                error
            );


            productsGrid.innerHTML = `

                <div class="error">

                    <h2>
                        ❌ خطا در دریافت محصولات
                    </h2>

                    <p>
                        ${escapeHTML(
                            error.message
                        )}
                    </p>

                </div>

            `;

            return;
        }


        allProducts =
            data || [];


        /* ==============================
           LOAD SELLER PROFILES
        ============================== */

        const sellerIds =
            [
                ...new Set(
                    allProducts
                        .map(
                            product =>
                                product.seller_id
                        )
                        .filter(Boolean)
                )
            ];


        let sellerProfiles = {};


        if (sellerIds.length) {

            const {
                data: profiles,
                error: profileError
            } =
            await supabaseClient
                .from("profiles")
                .select(`
                    id,
                    username,
                    full_name,
                    avatar_url
                `)
                .in(
                    "id",
                    sellerIds
                );


            if (profileError) {

                console.error(
                    "Profile Error:",
                    profileError
                );

            } else {

                (profiles || []).forEach(
                    profile => {

                        sellerProfiles[
                            profile.id
                        ] = profile;

                    }
                );

            }

        }


        /*
           پروفایل فروشنده را
           به هر محصول وصل می‌کنیم
        */

        allProducts =
            allProducts.map(
                product => ({

                    ...product,

                    sellerProfile:
                        sellerProfiles[
                            product.seller_id
                        ] || null

                })
            );


        applyFilters();

    }


    /* ==============================
       RENDER PRODUCTS
    ============================== */

    function renderProducts(
        products
    ) {

        if (!products.length) {

            const currentCategory =
                categoryFilter.value;


            const categoryText =
                categoryNames[
                    currentCategory
                ] || "این دسته";


            productsGrid.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🔍
                    </div>

                    <h2>
                        محصولی پیدا نشد
                    </h2>

                    <p>
                        در ${escapeHTML(categoryText)}
                        محصول فعالی پیدا نشد.
                    </p>

                    <a
                        href="seller.html"
                        class="sell-button"
                    >
                        فروشنده شوید
                    </a>

                </div>

            `;

            return;
        }


        productsGrid.innerHTML =
            products
                .map(
                    product =>
                        createProductCard(
                            product
                        )
                )
                .join("");

    }


    /* ==============================
       PRODUCT CARD
    ============================== */

    function createProductCard(
        product
    ) {

        const images =
            getProductImages(
                product
            );


        const firstImage =
            images.length
                ? images[0]
                : null;


        let imageHTML;


        if (firstImage) {

            imageHTML = `

                <img
                    src="${escapeHTML(firstImage)}"
                    alt="${escapeHTML(product.title)}"
                    loading="lazy"
                    onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('beforeend','<div class=&quot;no-image&quot;>🛍️</div>')"
                >

            `;

        } else {

            imageHTML = `

                <div class="no-image">
                    🛍️
                </div>

            `;

        }


        const photoCountHTML =
            images.length > 1

            ? `

                <div class="photo-count">

                    📷 ${images.length}

                </div>

              `

            : "";


        const city =
            product.city ||
            "افغانستان";


        const condition =
            getConditionName(
                product.condition
            );


        /* ==============================
           SELLER INFORMATION
        ============================== */

        const seller =
            product.sellerProfile;


        const sellerName =
            seller?.username ||
            seller?.full_name ||
            "فروشنده";


        const sellerId =
            product.seller_id;


        let sellerAvatarHTML;


        if (
            seller &&
            seller.avatar_url
        ) {

            sellerAvatarHTML = `

                <img
                    class="seller-avatar"
                    src="${escapeHTML(seller.avatar_url)}"
                    alt="${escapeHTML(sellerName)}"
                    loading="lazy"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >

                <div
                    class="seller-avatar-placeholder"
                    style="display:none;"
                >
                    👤
                </div>

            `;

        } else {

            sellerAvatarHTML = `

                <div class="seller-avatar-placeholder">
                    👤
                </div>

            `;

        }


        const sellerHTML =
            sellerId

            ? `

                <div class="seller-box">

                    <a
                        href="seller-profile.html?id=${encodeURIComponent(sellerId)}"
                        class="seller-link"
                        onclick="event.stopPropagation();"
                    >

                        ${sellerAvatarHTML}

                        <span class="seller-name">

                            ${escapeHTML(
                                sellerName
                            )}

                        </span>

                    </a>

                </div>

              `

            : "";


        return `

            <article
                class="product-card"
                onclick="openProduct('${escapeHTML(product.id)}')"
            >

                <div class="product-image">

                    ${imageHTML}

                    ${photoCountHTML}

                </div>


                <div class="product-info">

                    ${sellerHTML}


                    <h3>

                        ${escapeHTML(
                            product.title
                        )}

                    </h3>


                    <div class="price">

                        ${formatPrice(
                            product.price
                        )}

                        افغانی

                    </div>


                    <div class="location">

                        📍

                        ${escapeHTML(
                            getCityName(city)
                        )}

                    </div>


                    <span class="condition">

                        ${condition}

                    </span>

                </div>

            </article>

        `;

    }


    /* ==============================
       GET IMAGES
    ============================== */

    function getProductImages(
        product
    ) {

        let images = [];


        if (
            Array.isArray(
                product.image_urls
            )
        ) {

            images =
                product.image_urls.filter(
                    url =>
                        typeof url === "string" &&
                        url.trim() !== ""
                );

        }


        if (
            images.length === 0 &&
            product.image_url
        ) {

            images = [
                product.image_url
            ];

        }


        return images;

    }


    /* ==============================
       OPEN PRODUCT
    ============================== */

    function openProduct(
        id
    ) {

        window.location.href =
            "product.html?id=" +
            encodeURIComponent(id);

    }


    /* ==============================
       SEARCH
    ============================== */

    searchForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            updateURL();

            applyFilters();

        }
    );


    searchInput.addEventListener(
        "input",
        function() {

            updateURL();

            applyFilters();

        }
    );


    /* ==============================
       CATEGORY
    ============================== */

    categoryFilter.addEventListener(
        "change",
        function() {

            updateURL();

            applyFilters();

        }
    );


    /* ==============================
       SORT
    ============================== */

    sortFilter.addEventListener(
        "change",
        function() {

            applyFilters();

        }
    );


    /* ==============================
       FILTER SYSTEM
    ============================== */

    function applyFilters() {

        let filtered =
            [...allProducts];


        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const category =
            categoryFilter.value;


        const sort =
            sortFilter.value;


        if (search) {

            filtered =
                filtered.filter(
                    product => {

                        const title =
                            String(
                                product.title ||
                                ""
                            )
                            .toLowerCase();


                        const description =
                            String(
                                product.description ||
                                ""
                            )
                            .toLowerCase();


                        const city =
                            String(
                                product.city ||
                                ""
                            )
                            .toLowerCase();


                        return (

                            title.includes(
                                search
                            ) ||

                            description.includes(
                                search
                            ) ||

                            city.includes(
                                search
                            )

                        );

                    }
                );

        }


        if (
            category !== "all"
        ) {

            filtered =
                filtered.filter(
                    product =>
                        product.category ===
                        category
                );

        }


        if (
            sort === "cheap"
        ) {

            filtered.sort(
                (a, b) =>
                    Number(a.price) -
                    Number(b.price)
            );

        }


        if (
            sort === "expensive"
        ) {

            filtered.sort(
                (a, b) =>
                    Number(b.price) -
                    Number(a.price)
            );

        }


        if (
            sort === "new"
        ) {

            filtered.sort(
                (a, b) =>
                    new Date(
                        b.created_at
                    ) -
                    new Date(
                        a.created_at
                    )
            );

        }


        updateCategoryUI(
            category,
            filtered.length
        );


        renderProducts(
            filtered
        );

    }


    /* ==============================
       CATEGORY UI
    ============================== */

    function updateCategoryUI(
        category,
        count
    ) {

        if (
            category &&
            category !== "all"
        ) {

            const name =
                categoryNames[
                    category
                ] || category;


            pageTitle.textContent =
                name;


            pageDescription.textContent =
                `${count} محصول در این دسته‌بندی`;


            activeCategory.textContent =
                `🏷️ دسته‌بندی فعال: ${name}`;


            activeCategory.classList.add(
                "show"
            );

        } else {

            pageTitle.textContent =
                "همه محصولات";


            pageDescription.textContent =
                "کالاهای ثبت‌شده توسط فروشندگان بازارک";


            activeCategory.textContent =
                "";


            activeCategory.classList.remove(
                "show"
            );

        }

    }


    /* ==============================
       UPDATE URL
    ============================== */

    function updateURL() {

        const params =
            new URLSearchParams();


        const category =
            categoryFilter.value;


        const search =
            searchInput.value.trim();


        if (
            category &&
            category !== "all"
        ) {

            params.set(
                "category",
                category
            );

        }


        if (search) {

            params.set(
                "search",
                search
            );

        }


        const query =
            params.toString();


        const newURL =
            query
                ? "products.html?" + query
                : "products.html";


        window.history.replaceState(
            {},
            "",
            newURL
        );

    }


    /* ==============================
       CONDITION NAME
    ============================== */

    function getConditionName(
        condition
    ) {

        const conditions = {

            new:
                "✨ نو",

            used:
                "♻️ کارکرده"

        };


        return (
            conditions[condition] ||
            condition ||
            "موجود"
        );

    }


    /* ==============================
       CITY NAME
    ============================== */

    function getCityName(
        city
    ) {

        const cities = {

            "Mazar-e-Sharif":
                "مزار شریف",

            Kabul:
                "کابل",

            Herat:
                "هرات",

            Kandahar:
                "کندهار",

            Jowzjan:
                "جوزجان",

            Balkh:
                "بلخ",

            Nangarhar:
                "ننگرهار",

            Other:
                "سایر"

        };


        return (
            cities[city] ||
            city ||
            "افغانستان"
        );

    }


    /* ==============================
       PRICE
    ============================== */

    function formatPrice(
        price
    ) {

        if (
            price === null ||
            price === undefined ||
            price === ""
        ) {

            return "قیمت نامشخص";

        }


        return Number(price)
            .toLocaleString("fa-AF");

    }


    /* ==============================
       HTML SAFETY
    ============================== */

    function escapeHTML(
        value
    ) {

        return String(
            value ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* ==============================
       START
    ============================== */

    loadProducts();

</script>
