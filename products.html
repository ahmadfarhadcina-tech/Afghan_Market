<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>محصولات | بازارک</title>

    <meta name="description"
          content="مشاهده محصولات و کالاهای موجود در بازارک، بازار آنلاین افغانستان">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7f6;
            color: #17211d;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* HEADER */

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e9e7;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #087a55;
            white-space: nowrap;
        }

        .search {
            flex: 1;
            display: flex;
            background: #f1f4f2;
            border-radius: 12px;
            overflow: hidden;
        }

        .search input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 13px 16px;
            font-size: 14px;
        }

        .search button {
            border: none;
            background: #087a55;
            color: white;
            padding: 0 22px;
            cursor: pointer;
        }

        .header-links {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }

        /* PAGE */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #69746f;
        }

        /* FILTER */

        .toolbar {
            background: white;
            border: 1px solid #e5e9e7;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .toolbar select {
            padding: 12px 15px;
            border: 1px solid #dce2df;
            border-radius: 10px;
            background: white;
            outline: none;
        }

        /* PRODUCTS */

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .product-card {
            background: white;
            border: 1px solid #e5e9e7;
            border-radius: 16px;
            overflow: hidden;
            transition: 0.25s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .product-image {
            height: 190px;
            background: #eef2f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }

        .product-info {
            padding: 16px;
        }

        .product-info h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .price {
            color: #087a55;
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .location {
            color: #7a8580;
            font-size: 13px;
        }

        /* EMPTY STATE */

        .empty {
            background: white;
            border: 1px dashed #cfd8d3;
            border-radius: 20px;
            padding: 70px 20px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .empty-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #69746f;
            margin-bottom: 22px;
        }

        .sell-button {
            display: inline-block;
            background: #087a55;
            color: white;
            padding: 13px 24px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 650px) {

            .header-inner {
                flex-wrap: wrap;
            }

            .logo {
                width: 100%;
            }

            .header-links {
                display: none;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .product-image {
                height: 150px;
            }

            .page-title h1 {
                font-size: 24px;
            }

        }

        @media (max-width: 400px) {

            .products-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

<header>

    <div class="header-inner">

        <a href="index.html" class="logo">
            🛒 بازارک
        </a>

        <form class="search" id="searchForm">

            <input
                type="search"
                id="searchInput"
                placeholder="دنبال چه چیزی می‌گردید؟"
            >

            <button type="submit">
                جستجو
            </button>

        </form>

        <div class="header-links">

            <a href="index.html">
                خانه
            </a>

            <a href="#">
                ورود
            </a>

            <a href="#">
                🛒 سبد
            </a>

        </div>

    </div>

</header>


<main class="container">

    <div class="page-title">

        <h1>
            همه محصولات
        </h1>

        <p>
            کالاهای ثبت‌شده توسط فروشندگان بازارک
        </p>

    </div>


    <div class="toolbar">

        <select id="categoryFilter">

            <option value="all">
                همه دسته‌بندی‌ها
            </option>

            <option value="mobile">
                موبایل
            </option>

            <option value="computer">
                کامپیوتر و لپ‌تاپ
            </option>

            <option value="fashion">
                فیشن
            </option>

            <option value="gaming">
                گیمینگ
            </option>

            <option value="home">
                خانه
            </option>

            <option value="vehicle">
                موتر
            </option>

        </select>


        <select id="sortFilter">

            <option value="new">
                جدیدترین
            </option>

            <option value="cheap">
                ارزان‌ترین
            </option>

            <option value="expensive">
                گران‌ترین
            </option>

        </select>

    </div>


    <section class="products-grid" id="productsGrid">

        <!--
        محصولات واقعی بعداً از دیتابیس
        به صورت خودکار اینجا نمایش داده می‌شوند.
        -->

        <div class="empty">

            <div class="empty-icon">
                🛍️
            </div>

            <h2>
                هنوز محصولی ثبت نشده است
            </h2>

            <p>
                فعلاً هیچ فروشنده‌ای محصولی برای فروش ثبت نکرده است.
            </p>

            <a href="#" class="sell-button">
                فروشنده شوید
            </a>

        </div>

    </section>

</main>


<script>

    const searchForm = document.getElementById("searchForm");

    const searchInput = document.getElementById("searchInput");


    searchForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const value = searchInput.value.trim();

        if (!value) {

            alert("لطفاً نام محصول را وارد کنید.");

            return;

        }

        alert("جستجو برای: " + value);

    });


    const categoryFilter =
        document.getElementById("categoryFilter");

    categoryFilter.addEventListener("change", function() {

        console.log(
            "دسته انتخاب شد:",
            this.value
        );

    });


    const sortFilter =
        document.getElementById("sortFilter");

    sortFilter.addEventListener("change", function() {

        console.log(
            "مرتب‌سازی:",
            this.value
        );

    });

</script>

</body>
</html>
