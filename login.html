<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود | بازارک</title>

<meta name="theme-color" content="#087a55" id="themeColor">

<script>
(() => {
    try {
        const saved = localStorage.getItem("bazaarak-theme");
        document.documentElement.dataset.theme =
            saved === "dark" ? "dark" : "light";
    } catch (_) {
        document.documentElement.dataset.theme = "light";
    }
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    color-scheme: light;

    --primary:#087a55;
    --primary-dark:#055c40;
    --primary-soft:#eaf7f1;

    --gold:#f2b84b;

    --bg:#f4f7f5;
    --surface:#fff;
    --surface-2:#f8faf9;

    --text:#17211d;
    --text-soft:#42514a;
    --muted:#718078;

    --border:#e1e8e4;

    --danger:#d94b4b;
    --success:#16865d;

    --shadow-sm:0 5px 20px rgba(17,35,27,.045);
    --shadow-md:0 15px 45px rgba(17,35,27,.08);
    --shadow-lg:0 25px 70px rgba(17,35,27,.14);

    --radius-md:18px;
    --radius-lg:26px;
}

html[data-theme="dark"] {
    color-scheme: dark;

    --primary:#21c982;
    --primary-dark:#0e9b61;
    --primary-soft:#12382a;

    --gold:#f5c761;

    --bg:#0b1210;
    --surface:#111b17;
    --surface-2:#16221d;

    --text:#f1f6f3;
    --text-soft:#c3d0ca;
    --muted:#91a39b;

    --border:#26362f;

    --danger:#ff7272;
    --success:#45d49a;

    --shadow-sm:0 5px 20px rgba(0,0,0,.20);
    --shadow-md:0 15px 45px rgba(0,0,0,.28);
    --shadow-lg:0 25px 70px rgba(0,0,0,.38);
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html {
    scroll-behavior:smooth;
}

body {
    font-family:Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:
        background-color .25s,
        color .25s;
}

a {
    text-decoration:none;
    color:inherit;
}

button,
input {
    font:inherit;
}

button {
    border:0;
    cursor:pointer;
}

button:disabled {
    opacity:.6;
    cursor:not-allowed;
}

/* Header */

header {
    height:72px;

    background:
        color-mix(
            in srgb,
            var(--surface) 92%,
            transparent
        );

    backdrop-filter:blur(18px);

    border-bottom:1px solid var(--border);

    color:var(--text);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    position:sticky;
    top:0;
    z-index:1000;

    box-shadow:var(--shadow-sm);

    transition:
        background-color .25s,
        color .25s,
        border-color .25s,
        box-shadow .25s;
}

.logo {
    color:var(--primary);
    text-decoration:none;

    font-size:25px;
    font-weight:900;

    white-space:nowrap;
}

.logo span {
    color:var(--gold);
}

.header-right {
    display:flex;
    align-items:center;
    gap:9px;
}

.back {
    color:var(--text-soft);
    text-decoration:none;

    font-size:13px;
    font-weight:bold;

    padding:9px 12px;
    border-radius:10px;

    transition:
        background .2s,
        color .2s;
}

.back:hover {
    background:var(--primary-soft);
    color:var(--primary);
}

.theme-button {
    width:43px;
    height:43px;

    display:grid;
    place-items:center;

    border-radius:12px;

    background:var(--surface-2);
    border:1px solid var(--border);

    color:var(--text);

    font-size:18px;

    transition:
        transform .2s,
        background .2s,
        color .2s,
        border-color .2s;
}

.theme-button:hover {
    transform:translateY(-2px);
    background:var(--primary-soft);
    color:var(--primary);
}

.theme-button:active {
    transform:scale(.92);
}

/* Main */

main {
    min-height:calc(100vh - 72px);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:45px 15px;

    background:
        radial-gradient(
            circle at 10% 15%,
            rgba(33,201,130,.07),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(242,184,75,.07),
            transparent 28%
        );
}

/* Login card */

.login-box {
    width:100%;
    max-width:470px;

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius-lg);

    padding:38px;

    box-shadow:var(--shadow-lg);

    transition:
        background-color .25s,
        border-color .25s,
        box-shadow .25s;

    animation:cardIn .4s ease both;
}

@keyframes cardIn {
    from {
        opacity:0;
        transform:translateY(14px) scale(.985);
    }

    to {
        opacity:1;
        transform:none;
    }
}

.login-icon {
    width:68px;
    height:68px;

    display:grid;
    place-items:center;

    margin:0 auto 17px;

    border-radius:20px;

    background:var(--primary-soft);

    font-size:31px;

    border:1px solid var(--border);
}

.title {
    text-align:center;

    margin-bottom:8px;

    font-size:27px;

    color:var(--text);
}

.title span {
    color:var(--primary);
}

.subtitle {
    text-align:center;

    color:var(--muted);

    font-size:13px;

    margin-bottom:28px;

    line-height:1.9;
}

/* Form */

.form-group {
    margin-bottom:18px;
}

label {
    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:bold;

    color:var(--text);
}

.input-wrap {
    position:relative;
}

input {
    width:100%;
    height:51px;

    border:1px solid var(--border);

    border-radius:12px;

    padding:0 15px;

    font-size:14px;

    outline:none;

    background:var(--surface-2);

    color:var(--text);

    direction:rtl;

    transition:
        border-color .2s,
        box-shadow .2s,
        background-color .25s,
        color .25s;
}

input::placeholder {
    color:var(--muted);
}

input:focus {
    border-color:var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(33,201,130,.10);

    background:var(--surface);
}

.password-wrapper {
    position:relative;
}

.password-wrapper input {
    padding-left:65px;
}

.show-password {
    position:absolute;

    left:10px;
    top:9px;

    height:33px;

    padding:0 8px;

    border:none;

    background:transparent;

    cursor:pointer;

    color:var(--primary);

    font-size:12px;

    font-weight:bold;

    border-radius:8px;

    transition:
        background .2s,
        color .2s;
}

.show-password:hover {
    background:var(--primary-soft);
}

.forgot {
    display:block;

    text-align:left;

    margin-top:8px;

    color:var(--primary);

    text-decoration:none;

    font-size:12px;

    font-weight:bold;
}

.forgot:hover {
    text-decoration:underline;
}

/* Login button */

.login-btn {
    width:100%;

    height:52px;

    border:none;

    border-radius:13px;

    background:var(--primary);

    color:#fff;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    margin-top:8px;

    transition:
        background .2s,
        transform .2s,
        box-shadow .2s;
}

.login-btn:hover {
    background:var(--primary-dark);

    transform:translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(8,122,85,.20);
}

.login-btn:active {
    transform:scale(.98);
}

.login-btn:disabled {
    transform:none;
    box-shadow:none;
}

/* Message */

.message {
    display:none;

    padding:12px 13px;

    border-radius:11px;

    margin-bottom:17px;

    font-size:13px;

    line-height:1.8;

    border:1px solid transparent;
}

.success {
    display:block;

    background:
        rgba(22,134,93,.10);

    color:var(--success);

    border-color:
        rgba(22,134,93,.16);
}

.error {
    display:block;

    background:
        rgba(217,75,75,.10);

    color:var(--danger);

    border-color:
        rgba(217,75,75,.16);
}

/* Bottom */

.register-link {
    text-align:center;

    margin-top:23px;

    color:var(--muted);

    font-size:13px;
}

.register-link a {
    color:var(--primary);

    text-decoration:none;

    font-weight:bold;
}

.register-link a:hover {
    text-decoration:underline;
}

.terms {
    margin-top:18px;

    text-align:center;

    color:var(--muted);

    font-size:10px;

    line-height:1.9;
}

/* Responsive */

@media(max-width:600px) {

    header {
        height:65px;
        padding:0 15px;
    }

    .logo {
        font-size:21px;
    }

    .header-right {
        gap:5px;
    }

    .back {
        font-size:11px;
        padding:8px 7px;
    }

    .theme-button {
        width:40px;
        height:40px;
        font-size:17px;
    }

    main {
        min-height:calc(100vh - 65px);
        padding:25px 12px;
    }

    .login-box {
        padding:29px 20px;
        border-radius:21px;
    }

    .login-icon {
        width:61px;
        height:61px;
        font-size:28px;
        border-radius:18px;
    }

    .title {
        font-size:23px;
    }

    .subtitle {
        font-size:12px;
        margin-bottom:23px;
    }

    input {
        height:49px;
        font-size:13px;
    }

    .login-btn {
        height:50px;
    }
}

@media(max-width:380px) {

    .back {
        font-size:10px;
    }

    .login-box {
        padding:25px 16px;
    }

    .title {
        font-size:21px;
    }
}

@media(prefers-reduced-motion:reduce) {

    *,
    *::before,
    *::after {
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
    }
}

</style>

</head>

<body>

<header>

    <a class="logo" href="index.html">
        بازار<span>ک</span>
    </a>

    <div class="header-right">

        <button
            type="button"
            class="theme-button"
            id="themeButton"
            aria-label="تغییر حالت نمایش"
            title="تغییر حالت نمایش"
        >🌙</button>

        <a class="back" href="index.html">
            ← بازگشت به بازار
        </a>

    </div>

</header>

<main>

    <div class="login-box">

        <div class="login-icon" aria-hidden="true">
            👤
        </div>

        <h1 class="title">
            ورود به <span>بازارک</span>
        </h1>

        <p class="subtitle">
            وارد حساب خود شوید و خرید و فروش را شروع کنید
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    ایمیل
                </label>

                <div class="input-wrap">

                    <input
                        id="email"
                        type="email"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>

            <div class="form-group">

                <label for="password">
                    رمز عبور
                </label>

                <div class="password-wrapper">

                    <input
                        id="password"
                        type="password"
                        placeholder="رمز عبور"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        نمایش
                    </button>

                </div>

                <a
                    href="#"
                    class="forgot"
                    id="forgotPassword"
                >
                    رمز عبور را فراموش کرده‌اید؟
                </a>

            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                ورود
            </button>

        </form>

        <div class="register-link">

            حساب ندارید؟

            <a href="register.html">
                ثبت‌نام کنید
            </a>

        </div>

        <div class="terms">

            با ورود به بازارک، قوانین و شرایط استفاده را می‌پذیرید.

        </div>

    </div>

</main>

<script>

"use strict";

/* ==============================
   THEME
============================== */

const THEME_KEY = "bazaarak-theme";

const themeButton =
    document.getElementById("themeButton");

const themeColor =
    document.getElementById("themeColor");

function getTheme() {

    try {

        return localStorage.getItem(THEME_KEY) === "dark"
            ? "dark"
            : "light";

    } catch (_) {

        return document.documentElement.dataset.theme === "dark"
            ? "dark"
            : "light";

    }

}

function applyTheme(theme, persist = true) {

    const nextTheme =
        theme === "dark"
            ? "dark"
            : "light";

    document.documentElement.dataset.theme =
        nextTheme;

    if (persist) {

        try {

            localStorage.setItem(
                THEME_KEY,
                nextTheme
            );

        } catch (_) {}

    }

    themeButton.textContent =
        nextTheme === "dark"
            ? "☀️"
            : "🌙";

    themeButton.title =
        nextTheme === "dark"
            ? "حالت روشن"
            : "حالت تاریک";

    themeButton.setAttribute(
        "aria-label",
        themeButton.title
    );

    themeColor.setAttribute(
        "content",
        nextTheme === "dark"
            ? "#0b1210"
            : "#087a55"
    );

}

applyTheme(getTheme(), false);

themeButton.addEventListener(
    "click",
    () => {

        applyTheme(
            getTheme() === "dark"
                ? "light"
                : "dark"
        );

    }
);


/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
    "https://vhiewoopyqugdxwvsbno.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

const { createClient } = supabase;

const supabaseClient =
    createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==============================
   ELEMENTS
============================== */

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");


/* ==============================
   MESSAGE
============================== */

function showMessage(text, type) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* ==============================
   SHOW PASSWORD
============================== */

document
    .getElementById("showPassword")
    .addEventListener(
        "click",
        function() {

            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

                this.textContent =
                    "پنهان";

            } else {

                passwordInput.type =
                    "password";

                this.textContent =
                    "نمایش";

            }

        }
    );


/* ==============================
   CHECK PROFILE
============================== */

async function checkUserProfile(userId) {

    const {
        data: profile,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            full_name,
            username
        `)
        .eq(
            "id",
            userId
        )
        .maybeSingle();


    if (error) {

        console.error(
            "PROFILE CHECK ERROR:",
            error
        );

        throw error;

    }


    if (!profile) {

        const {
            error: insertError
        } =
        await supabaseClient
            .from("profiles")
            .insert({
                id: userId
            });


        if (
            insertError &&
            insertError.code !== "23505"
        ) {

            console.error(
                "PROFILE CREATE ERROR:",
                insertError
            );

            throw insertError;

        }


        return false;

    }


    const profileComplete =
        Boolean(
            profile.full_name &&
            profile.username
        );


    return profileComplete;

}


/* ==============================
   LOGIN
============================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        message.className =
            "message";

        message.textContent =
            "";


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (
            !email ||
            !password
        ) {

            showMessage(
                "لطفاً ایمیل و رمز عبور را وارد کنید.",
                "error"
            );

            return;

        }


        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "در حال ورود...";


        try {

            const {
                data,
                error
            } =
            await supabaseClient.auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


            if (error) {

                console.error(
                    error
                );


                if (
                    error.message
                        .toLowerCase()
                        .includes(
                            "email not confirmed"
                        )
                ) {

                    showMessage(
                        "ایمیل شما هنوز تأیید نشده است.",
                        "error"
                    );

                } else {

                    showMessage(
                        "ایمیل یا رمز عبور اشتباه است.",
                        "error"
                    );

                }


                return;

            }


            if (
                !data ||
                !data.user
            ) {

                showMessage(
                    "ورود انجام نشد. دوباره تلاش کنید.",
                    "error"
                );

                return;

            }


            console.log(
                "Logged in:",
                data.user
            );


            const profileComplete =
                await checkUserProfile(
                    data.user.id
                );


            showMessage(
                profileComplete
                    ? "ورود موفق بود! در حال انتقال..."
                    : "حساب شما آماده است. ابتدا پروفایل خود را تکمیل کنید...",
                "success"
            );


            setTimeout(
                function() {

                    if (
                        profileComplete
                    ) {

                        window.location.href =
                            "index.html";

                    } else {

                        window.location.href =
                            "edit-profile.html";

                    }

                },
                700
            );


        } catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            showMessage(
                "خطایی در بررسی پروفایل رخ داد. دوباره تلاش کنید.",
                "error"
            );

        } finally {

            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "ورود";

        }

    }
);


/* ==============================
   FORGOT PASSWORD
============================== */

document
    .getElementById("forgotPassword")
    .addEventListener(
        "click",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();


            if (!email) {

                showMessage(
                    "اول ایمیل خود را وارد کنید.",
                    "error"
                );

                emailInput.focus();

                return;

            }


            try {

                const {
                    error
                } =
                await supabaseClient.auth
                    .resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                "https://ahmadfarhadcina-tech.github.io/Afghan_Market/"
                        }
                    );


                if (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                    return;

                }


                showMessage(
                    "لینک تغییر رمز به ایمیل شما ارسال شد.",
                    "success"
                );


            } catch (error) {

                console.error(
                    error
                );


                showMessage(
                    "ارسال لینک تغییر رمز انجام نشد.",
                    "error"
                );

            }

        }
    );

</script>

</body>

</html>
