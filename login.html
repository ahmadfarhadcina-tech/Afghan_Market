<meta name="theme-color" content="#087a55" id="themeColor">

<script>
(() => {
    try {
        const saved =
            localStorage.getItem("bazaarak-theme");

        document.documentElement.dataset.theme =
            saved === "dark" ? "dark" : "light";

    } catch (_) {
        document.documentElement.dataset.theme = "light";
    }
})();
</script>

/* ==============================
   MAIN
============================== */

main {

/* ==============================
   LOGIN CARD
============================== */

.login-box {

    position:relative;

    width:100%;
    max-width:470px;

    padding:38px;

    border-radius:var(--radius-lg);

    overflow:hidden;

    /*
       مهم:
       پس‌زمینه کارت شفاف است تا عکس دیده شود.
    */

    background:transparent;

    border:1px solid rgba(255,255,255,.28);

    box-shadow:
        0 25px 70px rgba(0,0,0,.20);

    isolation:isolate;

    animation:cardIn .4s ease both;
}

@keyframes cardIn {

    from {
        opacity:0;
        transform:
            translateY(14px)
            scale(.985);
    }

    to {
        opacity:1;
        transform:none;
    }

}


/* ==============================
   LOGIN SLIDESHOW
============================== */

.login-slideshow {

    position:absolute;

    inset:0;

    z-index:0;

    overflow:hidden;

    background:#087a55;

    pointer-events:none;
}

.login-slide {

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    opacity:0;

    transform:scale(1.08);

    filter:saturate(1.08);

    transition:
        opacity 1.35s ease,
        transform 6s cubic-bezier(.2,.65,.25,1);
}

.login-slide.active {

    opacity:1;

    transform:scale(1);
}

.login-slide.zoom {

    transform:scale(1.14);
}

.login-slide.active.zoom {

    transform:scale(1.02);
}

.login-slide.slide-left {

    transform:
        translateX(5%)
        scale(1.04);
}

.login-slide.active.slide-left {

    transform:
        translateX(0)
        scale(1);
}

.login-slide.slide-right {

    transform:
        translateX(-5%)
        scale(1.04);
}

.login-slide.active.slide-right {

    transform:
        translateX(0)
        scale(1);
}


/* ==============================
   PHOTO OVERLAY
============================== */

.login-overlay {

    position:absolute;

    inset:0;

    z-index:1;

    pointer-events:none;

    background:
        linear-gradient(
            135deg,
            rgba(2,42,29,.88) 0%,
            rgba(8,122,85,.68) 48%,
            rgba(5,75,52,.76) 100%

============================== */

<script>

"use strict";


/* ==============================
   THEME
============================== */

const THEME_KEY =
    "bazaarak-theme";

const themeButton =
    document.getElementById(
        "themeButton"
    );

const themeColor =
    document.getElementById(
        "themeColor"
    );


function getTheme() {

    try {

        return localStorage.getItem(
            THEME_KEY
        ) === "dark"
            ? "dark"
            : "light";

    } catch (_) {

        return document
            .documentElement
            .dataset
            .theme === "dark"
                ? "dark"
                : "light";

    }

}


function applyTheme(
    theme,
    persist = true
) {

    const nextTheme =
        theme === "dark"
            ? "dark"
            : "light";


    document
        .documentElement
        .dataset
        .theme =
        nextTheme;


    if (persist) {

        try {

            localStorage.setItem(
                THEME_KEY,
                nextTheme
            );

        } catch (_) {}

    }


    themeButton.textContent =
        nextTheme === "dark"
            ? "☀️"
            : "🌙";


    themeButton.title =
        nextTheme === "dark"
            ? "حالت روشن"
            : "حالت تاریک";


    themeButton.setAttribute(
        "aria-label",
        themeButton.title
    );


    themeColor.setAttribute(
        "content",
        nextTheme === "dark"
            ? "#0b1210"
            : "#087a55"
    );

}


applyTheme(
    getTheme(),
    false
);


themeButton.addEventListener(
    "click",
    () => {

        applyTheme(
            getTheme() === "dark"
                ? "light"
                : "dark"
        );

    }
);


/* ==============================
   LOGIN SLIDESHOW
============================== */

const loginSlides =
    Array.from(
        document.querySelectorAll(
            ".login-slide"
        )
    );

const loginEffects = [
    "",
    "zoom",
    "slide-left",
    "slide-right"
];


function randomLoginIndex(
    length,
    current
) {

    if (length <= 1)
        return 0;

    let next;

    do {

        next =
            Math.floor(
                Math.random() * length
            );

    } while (
        next === current
    );

    return next;
}


function startLoginSlideshow() {

    if (loginSlides.length < 2)
        return;


    let current = 0;


    loginSlides.forEach(
        (slide,index) => {

            slide.classList.remove(
                "active",
                "zoom",
                "slide-left",
                "slide-right"
            );

            if(index === 0) {

                slide.classList.add(
                    "active"
                );

            }

        }
    );


    window.setInterval(
        () => {

            const next =
                randomLoginIndex(
                    loginSlides.length,
                    current
                );


            const effect =
                loginEffects[
                    Math.floor(
                        Math.random() *
                        loginEffects.length
                    )
                ];


            const currentSlide =
                loginSlides[current];

            const nextSlide =
                loginSlides[next];


            currentSlide.classList.remove(
                "active"
            );


            nextSlide.classList.remove(
                "zoom",
                "slide-left",
                "slide-right"
            );


            if(effect) {

                nextSlide.classList.add(
                    effect
                );

            }


            void nextSlide.offsetWidth;


            nextSlide.classList.add(
                "active"
            );


            current = next;

        },
        5000
    );

}


startLoginSlideshow();


/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
    "https://vhiewoopyqugdxwvsbno.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

const {
    createClient
} = supabase;


const supabaseClient =
    createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==============================
   ELEMENTS
============================== */

const loginForm =
    document.getElementById(
        "loginForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const message =
    document.getElementById(
        "message"
    );


/* ==============================
   MESSAGE
============================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;
}


/* ==============================
   SHOW PASSWORD
============================== */

document
    .getElementById(
        "showPassword"
    )
    .addEventListener(
        "click",
        function() {

            if(
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

                this.textContent =
                    "پنهان";

            } else {

                passwordInput.type =
                    "password";

                this.textContent =
                    "نمایش";
            }

        }
    );


/* ==============================
   CHECK PROFILE
============================== */

async function checkUserProfile(
    userId
) {

    const {
        data: profile,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            full_name,
            username
        `)
        .eq(
            "id",
            userId
        )
        .maybeSingle();


    if(error) {

        console.error(
            "PROFILE CHECK ERROR:",
            error
        );

        throw error;
    }


    if(!profile) {

        const {
            error:insertError
        } =
        await supabaseClient
            .from("profiles")
            .insert({
                id:userId
            });


        if(
            insertError &&
            insertError.code !==
            "23505"
        ) {

            console.error(
                "PROFILE CREATE ERROR:",
                insertError
            );

            throw insertError;
        }


        return false;
    }


    return Boolean(
        profile.full_name &&
        profile.username
    );
}


/* ==============================
   LOGIN
============================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        message.className =
            "message";

        message.textContent =
            "";


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if(
            !email ||
            !password
        ) {

            showMessage(
                "لطفاً ایمیل و رمز عبور را وارد کنید.",
                "error"
            );

            return;
        }


        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "در حال ورود...";


        try {

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


            if(error) {

                console.error(error);


                if(
                    error.message
                        .toLowerCase()
                        .includes(
                            "email not confirmed"
                        )
                ) {

                    showMessage(
                        "ایمیل شما هنوز تأیید نشده است.",
                        "error"
                    );

                } else {

                    showMessage(
                        "ایمیل یا رمز عبور اشتباه است.",
                        "error"
                    );

                }


                return;
            }


            if(
                !data ||
                !data.user
            ) {

                showMessage(
                    "ورود انجام نشد. دوباره تلاش کنید.",
                    "error"
                );

                return;
            }


            console.log(
                "Logged in:",
                data.user
            );


            const profileComplete =
                await checkUserProfile(
                    data.user.id
                );


            showMessage(
                profileComplete
                    ? "ورود موفق بود! در حال انتقال..."
                    : "حساب شما آماده است. ابتدا پروفایل خود را تکمیل کنید...",
                "success"
            );


            setTimeout(
                function() {

                    if(profileComplete) {

                        window.location.href =
                            "index.html";

                    } else {

                        window.location.href =
                            "edit-profile.html";

                    }

                },
                700
            );


        } catch(error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            showMessage(
                "خطایی در بررسی پروفایل رخ داد. دوباره تلاش کنید.",
                "error"
            );

        } finally {

            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "ورود";
        }

    }
);


/* ==============================
   FORGOT PASSWORD
============================== */

document
    .getElementById(
        "forgotPassword"
    )
    .addEventListener(
        "click",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();


            if(!email) {

                showMessage(
                    "اول ایمیل خود را وارد کنید.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            try {

                const {
                    error
                } =
                await supabaseClient
                    .auth
                    .resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                "https://ahmadfarhadcina-tech.github.io/Afghan_Market/"
                        }
                    );


                if(error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                    return;
                }


                showMessage(
                    "لینک تغییر رمز به ایمیل شما ارسال شد.",
                    "success"
                );


            } catch(error) {

                console.error(error);


                showMessage(
                    "ارسال لینک تغییر رمز انجام نشد.",
                    "error"
                );

            }

        }
    );

window.addEventListener(
    "storage",
    event => {

        if(
            event.key ===
            THEME_KEY
        ) {

            applyTheme(
                event.newValue === "dark"
                    ? "dark"
                    : "light",
                false
            );

        }

    }
);
