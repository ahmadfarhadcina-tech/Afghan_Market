<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ورود | بازارک</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f7f6;
            color: #17201d;
            min-height: 100vh;
        }

        header {
            height: 70px;
            background: #0b3d2e;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .logo {
            color: white;
            text-decoration: none;

            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #39d98a;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        main {
            min-height: calc(100vh - 70px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 35px 15px;
        }

        .login-box {
            width: 100%;
            max-width: 470px;

            background: white;

            border-radius: 22px;

            padding: 35px;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.08);
        }

        .title {
            text-align: center;
            margin-bottom: 8px;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 50px;

            border: 1px solid #dce3df;

            border-radius: 12px;

            padding: 0 15px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

            direction: rtl;
        }

        input:focus {
            border-color: #19a968;

            box-shadow:
                0 0 0 3px
                rgba(25, 169, 104, 0.10);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-left: 55px;
        }

        .show-password {
            position: absolute;

            left: 10px;
            top: 9px;

            height: 32px;

            border: none;

            background: transparent;

            cursor: pointer;

            color: #178b59;

            font-size: 13px;
        }

        .forgot {
            display: block;

            text-align: left;

            margin-top: 8px;

            color: #0b8f5a;

            text-decoration: none;

            font-size: 13px;
        }

        .login-btn {
            width: 100%;

            height: 52px;

            border: none;

            border-radius: 13px;

            background: #0b8f5a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #08794b;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 17px;

            font-size: 14px;

            line-height: 1.7;
        }

        .success {
            display: block;

            background: #e8f8ef;

            color: #147a45;
        }

        .error {
            display: block;

            background: #fff0f0;

            color: #b42323;
        }

        .register-link {
            text-align: center;

            margin-top: 22px;

            color: #666;

            font-size: 14px;
        }

        .register-link a {
            color: #0b8f5a;

            text-decoration: none;

            font-weight: bold;
        }

        .terms {
            margin-top: 18px;

            text-align: center;

            color: #888;

            font-size: 11px;

            line-height: 1.8;
        }

        @media (max-width: 500px) {

            header {
                padding: 0 20px;
            }

            .login-box {
                padding: 25px 20px;
                border-radius: 18px;
            }

            .title {
                font-size: 23px;
            }

        }

    </style>

</head>


<body>


<header>

    <a
        class="logo"
        href="index.html"
    >
        بازار<span>ک</span>
    </a>


    <a
        class="back"
        href="index.html"
    >
        ← بازگشت به بازار
    </a>

</header>



<main>

    <div class="login-box">


        <h1 class="title">
            ورود به بازارک
        </h1>


        <p class="subtitle">
            وارد حساب خود شوید و خرید و فروش را شروع کنید
        </p>



        <div
            id="message"
            class="message"
        ></div>



        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    ایمیل
                </label>


                <input
                    id="email"
                    type="email"
                    placeholder="example@gmail.com"
                    autocomplete="email"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">
                    رمز عبور
                </label>


                <div class="password-wrapper">


                    <input
                        id="password"
                        type="password"
                        placeholder="رمز عبور"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        نمایش
                    </button>


                </div>


                <a
                    href="#"
                    class="forgot"
                    id="forgotPassword"
                >
                    رمز عبور را فراموش کرده‌اید؟
                </a>

            </div>



            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                ورود
            </button>


        </form>



        <div class="register-link">

            حساب ندارید؟

            <a href="register.html">
                ثبت‌نام کنید
            </a>

        </div>



        <div class="terms">

            با ورود به بازارک، قوانین و شرایط استفاده را می‌پذیرید.

        </div>


    </div>

</main>



<script>


    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://vhiewoopyqugdxwvsbno.supabase.co";


    const SUPABASE_ANON_KEY =
        "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";


    const { createClient } =
        supabase;


    const supabaseClient =
        createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    // ==========================================
    // ELEMENTS
    // ==========================================

    const loginForm =
        document.getElementById("loginForm");


    const emailInput =
        document.getElementById("email");


    const passwordInput =
        document.getElementById("password");


    const loginBtn =
        document.getElementById("loginBtn");


    const message =
        document.getElementById("message");


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(text, type) {

        message.textContent =
            text;

        message.className =
            "message " + type;

    }


    // ==========================================
    // SHOW PASSWORD
    // ==========================================

    document
        .getElementById("showPassword")
        .addEventListener(
            "click",
            function() {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    this.textContent =
                        "پنهان";

                } else {

                    passwordInput.type =
                        "password";

                    this.textContent =
                        "نمایش";

                }

            }
        );


    // ==========================================
    // CHECK PROFILE
    // ==========================================

    async function checkUserProfile(userId) {

        const {
            data: profile,
            error
        } =
        await supabaseClient
            .from("profiles")
            .select(`
                id,
                full_name,
                username
            `)
            .eq(
                "id",
                userId
            )
            .maybeSingle();


        if (error) {

            console.error(
                "PROFILE CHECK ERROR:",
                error
            );

            throw error;

        }


        /*
           اگر پروفایل وجود نداشته باشد،
           یک پروفایل خالی می‌سازیم.
        */

        if (!profile) {

            const {
                error: insertError
            } =
            await supabaseClient
                .from("profiles")
                .insert({
                    id: userId
                });


            if (
                insertError &&
                insertError.code !== "23505"
            ) {

                console.error(
                    "PROFILE CREATE ERROR:",
                    insertError
                );

                throw insertError;

            }


            return false;

        }


        /*
           اگر پروفایل کامل باشد،
           کاربر قدیمی است.
        */

        const profileComplete =
            Boolean(
                profile.full_name &&
                profile.username
            );


        return profileComplete;

    }


    // ==========================================
    // LOGIN
    // ==========================================

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            message.className =
                "message";

            message.textContent =
                "";


            const email =
                emailInput.value.trim();


            const password =
                passwordInput.value;


            if (
                !email ||
                !password
            ) {

                showMessage(
                    "لطفاً ایمیل و رمز عبور را وارد کنید.",
                    "error"
                );

                return;

            }


            loginBtn.disabled =
                true;


            loginBtn.textContent =
                "در حال ورود...";


            try {


                const {
                    data,
                    error
                } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email:
                            email,

                        password:
                            password

                    });


                if (error) {

                    console.error(
                        error
                    );


                    /*
                       اگر ایمیل تأیید نشده باشد
                       یا رمز اشتباه باشد،
                       اینجا متوقف می‌شود.
                    */

                    if (
                        error.message
                            .toLowerCase()
                            .includes("email not confirmed")
                    ) {

                        showMessage(
                            "ایمیل شما هنوز تأیید نشده است.",
                            "error"
                        );

                    } else {

                        showMessage(
                            "ایمیل یا رمز عبور اشتباه است.",
                            "error"
                        );

                    }


                    return;

                }


                if (
                    !data ||
                    !data.user
                ) {

                    showMessage(
                        "ورود انجام نشد. دوباره تلاش کنید.",
                        "error"
                    );

                    return;

                }


                console.log(
                    "Logged in:",
                    data.user
                );


                /*
                   بررسی پروفایل
                */

                const profileComplete =
                    await checkUserProfile(
                        data.user.id
                    );


                showMessage(
                    profileComplete
                        ? "ورود موفق بود! در حال انتقال..."
                        : "حساب شما آماده است. ابتدا پروفایل خود را تکمیل کنید...",
                    "success"
                );


                setTimeout(
                    function() {

                        if (
                            profileComplete
                        ) {

                            /*
                               کاربر قدیمی
                            */

                            window.location.href =
                                "index.html";

                        } else {

                            /*
                               کاربر جدید یا
                               پروفایل ناقص
                            */

                            window.location.href =
                                "edit-profile.html";

                        }

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                showMessage(
                    "خطایی در بررسی پروفایل رخ داد. دوباره تلاش کنید.",
                    "error"
                );

            } finally {

                loginBtn.disabled =
                    false;

                loginBtn.textContent =
                    "ورود";

            }

        }
    );


    // ==========================================
    // FORGOT PASSWORD
    // ==========================================

    document
        .getElementById("forgotPassword")
        .addEventListener(
            "click",
            async function(event) {

                event.preventDefault();


                const email =
                    emailInput.value.trim();


                if (!email) {

                    showMessage(
                        "اول ایمیل خود را وارد کنید.",
                        "error"
                    );

                    emailInput.focus();

                    return;

                }


                try {

                    const {
                        error
                    } =
                    await supabaseClient.auth
                        .resetPasswordForEmail(
                            email,
                            {
                                redirectTo:
                                    "https://ahmadfarhadcina-tech.github.io/Afghan_Market/"
                            }
                        );


                    if (error) {

                        showMessage(
                            error.message,
                            "error"
                        );

                        return;

                    }


                    showMessage(
                        "لینک تغییر رمز به ایمیل شما ارسال شد.",
                        "success"
                    );


                } catch (error) {

                    console.error(
                        error
                    );


                    showMessage(
                        "ارسال لینک تغییر رمز انجام نشد.",
                        "error"
                    );

                }

            }
        );


</script>


</body>

</html>
