<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ویرایش محصول | بازارک</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f7f5;
            color: #17251d;
        }


        header {
            background: #087443;
            color: white;
            padding: 15px 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.1);
        }


        .header {
            max-width: 900px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }


        .logo {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }


        .back {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,.12);
            padding: 10px 14px;
            border-radius: 10px;
        }


        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }


        h1 {
            margin: 0 0 20px;
            color: #087443;
            font-size: 25px;
        }


        .message {
            display: none;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            white-space: pre-line;
        }


        .error {
            background: #fdeaea;
            color: #c62828;
        }


        .success {
            background: #e8f5ee;
            color: #087443;
        }


        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #777;
        }


        .form-card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }


        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }


        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #d9e2dc;
            border-radius: 11px;
            padding: 12px 13px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            background: white;
        }


        input:focus,
        textarea:focus,
        select:focus {
            border-color: #087443;
        }


        textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.8;
        }


        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }


        .images-title {
            margin: 25px 0 12px;
            font-size: 18px;
            color: #087443;
        }


        .images {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }


        .image-box {
            position: relative;
            height: 150px;
            border-radius: 13px;
            overflow: hidden;
            background: #eef2ef;
            border: 1px solid #e1e8e3;
        }


        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }


        .remove-image {
            position: absolute;
            top: 7px;
            left: 7px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(198,40,40,.92);
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }


        .remove-image:hover {
            background: #b71c1c;
        }


        .add-images {
            margin-top: 15px;
            border: 2px dashed #b8c9be;
            border-radius: 13px;
            padding: 22px;
            text-align: center;
            cursor: pointer;
            color: #087443;
            background: #f8fbf9;
        }


        .add-images:hover {
            background: #eef7f1;
        }


        .add-images input {
            display: none;
        }


        .new-preview-title {
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
        }


        .new-preview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 10px;
        }


        .new-image {
            position: relative;
            height: 130px;
            border-radius: 12px;
            overflow: hidden;
        }


        .new-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        .remove-new {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: rgba(198,40,40,.92);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }


        .save-btn {
            width: 100%;
            border: none;
            background: #087443;
            color: white;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
        }


        .save-btn:hover {
            background: #066238;
        }


        .save-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }


        .cancel-btn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            color: #666;
            margin-top: 13px;
            padding: 10px;
        }


        @media (max-width: 700px) {

            .images,
            .new-preview {
                grid-template-columns: repeat(3, 1fr);
            }

        }


        @media (max-width: 500px) {

            header {
                padding: 13px 15px;
            }


            .header {
                flex-direction: column;
                align-items: stretch;
            }


            .back {
                text-align: center;
            }


            .container {
                margin-top: 20px;
            }


            .form-card {
                padding: 16px;
            }


            .row {
                grid-template-columns: 1fr;
            }


            .images,
            .new-preview {
                grid-template-columns: repeat(2, 1fr);
            }


            .image-box {
                height: 145px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header">

        <a
            href="index.html"
            class="logo"
        >
            🛒 بازارک
        </a>


        <a
            href="my-products.html"
            class="back"
        >
            ← برگشت به محصولات من
        </a>

    </div>

</header>



<main class="container">


    <h1>
        ✏️ ویرایش محصول
    </h1>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="loading"
        class="loading"
    >
        ⏳ در حال دریافت اطلاعات محصول...
    </div>



    <div
        id="formContainer"
        class="form-card"
        style="display:none;"
    >


        <form id="editForm">


            <div class="form-group">

                <label for="title">
                    نام محصول
                </label>

                <input
                    type="text"
                    id="title"
                    required
                    placeholder="مثلاً آیفون 13"
                >

            </div>



            <div class="row">


                <div class="form-group">

                    <label for="price">
                        قیمت
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        required
                        placeholder="مثلاً 25000"
                    >

                </div>



                <div class="form-group">

                    <label for="category">
                        دسته‌بندی
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            انتخاب دسته‌بندی
                        </option>

                        <option value="mobile">
                            📱 موبایل
                        </option>

                        <option value="computer">
                            💻 کامپیوتر
                        </option>

                        <option value="fashion">
                            👕 فیشن
                        </option>

                        <option value="shoes">
                            👟 کفش
                        </option>

                        <option value="gaming">
                            🎮 گیمینگ
                        </option>

                        <option value="home">
                            🏠 خانه
                        </option>

                        <option value="tools">
                            🔧 ابزار
                        </option>

                        <option value="vehicle">
                            🚗 موتر
                        </option>

                    </select>

                </div>


            </div>



            <div class="row">


                <div class="form-group">

                    <label for="city">
                        شهر
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="مثلاً مزار شریف"
                    >

                </div>



                <div class="form-group">

                    <label for="condition">
                        وضعیت محصول
                    </label>

                    <select id="condition">

                        <option value="">
                            انتخاب وضعیت
                        </option>

                        <option value="new">
                            نو
                        </option>

                        <option value="used">
                            استفاده شده
                        </option>

                        <option value="like_new">
                            در حد نو
                        </option>

                    </select>

                </div>


            </div>



            <div class="row">


                <div class="form-group">

                    <label for="stock">
                        موجودی
                    </label>

                    <input
                        type="number"
                        id="stock"
                        min="0"
                        step="1"
                        placeholder="مثلاً 1"
                    >

                </div>



                <div class="form-group">

                    <label for="whatsapp">
                        شماره واتساپ
                    </label>

                    <input
                        type="text"
                        id="whatsapp"
                        placeholder="مثلاً 937XXXXXXXX"
                    >

                </div>


            </div>



            <div class="form-group">

                <label for="description">
                    توضیحات محصول
                </label>

                <textarea
                    id="description"
                    placeholder="توضیحات کامل محصول..."
                ></textarea>

            </div>



            <div class="images-title">
                🖼️ عکس‌های فعلی محصول
            </div>


            <div
                id="existingImages"
                class="images"
            ></div>



            <label class="add-images">

                ➕ اضافه کردن عکس جدید

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    multiple
                >

            </label>



            <div
                id="newPreviewTitle"
                class="new-preview-title"
                style="display:none;"
            >
                عکس‌های جدید
            </div>


            <div
                id="newPreview"
                class="new-preview"
            ></div>



            <button
                type="submit"
                id="saveBtn"
                class="save-btn"
            >
                💾 ذخیره تغییرات
            </button>


            <a
                href="my-products.html"
                class="cancel-btn"
            >
                انصراف
            </a>


        </form>


    </div>


</main>



<script>


const SUPABASE_URL =
    "https://vhiewoopyqugdxwvsbno.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



const message =
    document.getElementById("message");


const loading =
    document.getElementById("loading");


const formContainer =
    document.getElementById("formContainer");


const existingImages =
    document.getElementById("existingImages");


const imageInput =
    document.getElementById("imageInput");


const newPreview =
    document.getElementById("newPreview");


const newPreviewTitle =
    document.getElementById("newPreviewTitle");


const saveBtn =
    document.getElementById("saveBtn");



let currentUser = null;
let currentProduct = null;
let existingImageUrls = [];
let removedImageUrls = [];
let newFiles = [];



function showMessage(text, type) {

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}



function hideMessage() {

    message.style.display =
        "none";

}



function getProductId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");

}



async function loadProduct() {

    try {


        const productId =
            getProductId();


        if (!productId) {

            throw new Error(
                "شناسه محصول پیدا نشد."
            );

        }



        const {
            data: {
                session
            },
            error: sessionError
        } =
            await supabaseClient
                .auth
                .getSession();


        if (sessionError) {

            throw sessionError;

        }


        if (!session) {

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            session.user;



        const {
            data: product,
            error
        } =
            await supabaseClient
                .from("products")
                .select("*")
                .eq(
                    "id",
                    productId
                )
                .eq(
                    "seller_id",
                    currentUser.id
                )
                .maybeSingle();


        if (error) {

            throw error;

        }


        if (!product) {

            throw new Error(
                "محصول پیدا نشد یا شما صاحب این محصول نیستید."
            );

        }


        currentProduct =
            product;



        fillForm(product);


        loading.style.display =
            "none";


        formContainer.style.display =
            "block";


    } catch (error) {


        console.error(error);


        loading.style.display =
            "none";


        showMessage(
            "❌ دریافت محصول انجام نشد:\n" +
            error.message,
            "error"
        );

    }

}



function fillForm(product) {


    document.getElementById("title").value =
        product.title || "";


    document.getElementById("price").value =
        product.price ?? "";


    document.getElementById("category").value =
        product.category || "";


    document.getElementById("city").value =
        product.city || "";


    document.getElementById("condition").value =
        product.condition || "";


    document.getElementById("stock").value =
        product.stock ?? 1;


    document.getElementById("whatsapp").value =
        product.whatsapp || "";


    document.getElementById("description").value =
        product.description || "";



    if (
        Array.isArray(product.image_urls) &&
        product.image_urls.length > 0
    ) {

        existingImageUrls =
            [...product.image_urls];

    } else if (product.image_url) {

        existingImageUrls =
            [product.image_url];

    } else {

        existingImageUrls =
            [];

    }



    renderExistingImages();

}



function renderExistingImages() {


    if (
        existingImageUrls.length === 0
    ) {

        existingImages.innerHTML = `

            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:25px;
                color:#888;
                background:#f5f7f6;
                border-radius:12px;
            ">

                📦 عکس فعلی ندارد

            </div>

        `;

        return;

    }



    existingImages.innerHTML =
        existingImageUrls
            .map(
                (url, index) => `

                    <div class="image-box">

                        <img
                            src="${escapeHtml(url)}"
                            alt="عکس محصول ${index + 1}"
                        >

                        <button
                            type="button"
                            class="remove-image"
                            onclick="removeExistingImage(${index})"
                            title="حذف عکس"
                        >
                            ×
                        </button>

                    </div>

                `
            )
            .join("");

}



function removeExistingImage(index) {


    const removed =
        existingImageUrls[index];


    if (removed) {

        removedImageUrls.push(
            removed
        );

    }


    existingImageUrls.splice(
        index,
        1
    );


    renderExistingImages();

}



imageInput.addEventListener(
    "change",
    function () {


        const selectedFiles =
            Array.from(
                imageInput.files || []
            );


        if (
            selectedFiles.length === 0
        ) {

            return;

        }



        const imageFiles =
            selectedFiles.filter(
                file =>
                    file.type.startsWith(
                        "image/"
                    )
            );



        newFiles =
            [
                ...newFiles,
                ...imageFiles
            ];



        imageInput.value =
            "";


        renderNewPreview();


    }
);



function renderNewPreview() {


    if (
        newFiles.length === 0
    ) {

        newPreview.innerHTML =
            "";

        newPreviewTitle.style.display =
            "none";

        return;

    }



    newPreviewTitle.style.display =
        "block";



    newPreview.innerHTML =
        newFiles
            .map(
                (file, index) => {

                    const url =
                        URL.createObjectURL(
                            file
                        );


                    return `

                        <div class="new-image">

                            <img
                                src="${url}"
                                alt="عکس جدید"
                            >

                            <button
                                type="button"
                                class="remove-new"
                                onclick="removeNewFile(${index})"
                            >
                                ×
                            </button>

                        </div>

                    `;

                }
            )
            .join("");

}



function removeNewFile(index) {

    newFiles.splice(
        index,
        1
    );

    renderNewPreview();

}



async function uploadNewImages() {


    const uploadedUrls = [];


    const uploadedPaths = [];



    for (
        const file of newFiles
    ) {


        const extension =
            (
                file.name
                    .split(".")
                    .pop() ||
                "jpg"
            )
            .toLowerCase()
            .replace(
                /[^a-z0-9]/g,
                ""
            ) || "jpg";



        const randomPart =
            Math.random()
                .toString(36)
                .substring(
                    2,
                    10
                );


        const fileName =
            Date.now() +
            "-" +
            randomPart +
            "." +
            extension;



        const filePath =
            currentUser.id +
            "/" +
            fileName;



        const {
            error
        } =
            await supabaseClient
                .storage
                .from("product-images")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:
                            "3600",
                        upsert:
                            false
                    }
                );


        if (error) {

            throw error;

        }



        uploadedPaths.push(
            filePath
        );



        const {
            data
        } =
            supabaseClient
                .storage
                .from("product-images")
                .getPublicUrl(
                    filePath
                );



        uploadedUrls.push(
            data.publicUrl
        );

    }



    return {
        uploadedUrls,
        uploadedPaths
    };

}



function getStoragePathFromUrl(url) {


    const marker =
        "/storage/v1/object/public/product-images/";


    const index =
        url.indexOf(marker);


    if (index === -1) {

        return null;

    }


    return decodeURIComponent(
        url.substring(
            index + marker.length
        )
    );

}



async function deleteStorageFiles(urls) {


    const paths =
        urls
            .map(
                getStoragePathFromUrl
            )
            .filter(
                path =>
                    path &&
                    path.startsWith(
                        currentUser.id + "/"
                    )
            );


    if (
        paths.length === 0
    ) {

        return;

    }



    const {
        error
    } =
        await supabaseClient
            .storage
            .from("product-images")
            .remove(
                paths
            );


    if (error) {

        console.warn(
            "Storage delete warning:",
            error
        );

    }

}



document
    .getElementById("editForm")
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            hideMessage();


            saveBtn.disabled =
                true;


            saveBtn.textContent =
                "⏳ در حال ذخیره...";



            let uploadedPaths = [];



            try {


                if (!currentProduct) {

                    throw new Error(
                        "اطلاعات محصول آماده نیست."
                    );

                }



                const title =
                    document
                        .getElementById(
                            "title"
                        )
                        .value
                        .trim();



                const price =
                    Number(
                        document
                            .getElementById(
                                "price"
                            )
                            .value
                    );



                const category =
                    document
                        .getElementById(
                            "category"
                        )
                        .value;



                const city =
                    document
                        .getElementById(
                            "city"
                        )
                        .value
                        .trim();



                const condition =
                    document
                        .getElementById(
                            "condition"
                        )
                        .value;



                const stockValue =
                    document
                        .getElementById(
                            "stock"
                        )
                        .value;



                const stock =
                    stockValue === ""
                        ? 0
                        : Number(
                            stockValue
                        );



                const whatsapp =
                    document
                        .getElementById(
                            "whatsapp"
                        )
                        .value
                        .trim();



                const description =
                    document
                        .getElementById(
                            "description"
                        )
                        .value
                        .trim();



                if (!title) {

                    throw new Error(
                        "نام محصول را وارد کنید."
                    );

                }



                if (
                    Number.isNaN(price) ||
                    price < 0
                ) {

                    throw new Error(
                        "قیمت محصول معتبر نیست."
                    );

                }



                if (!category) {

                    throw new Error(
                        "دسته‌بندی را انتخاب کنید."
                    );

                }



                if (
                    Number.isNaN(stock) ||
                    stock < 0
                ) {

                    throw new Error(
                        "موجودی محصول معتبر نیست."
                    );

                }



                if (
                    newFiles.length > 0
                ) {


                    const result =
                        await uploadNewImages();


                    uploadedPaths =
                        result.uploadedPaths;


                    existingImageUrls =
                        [
                            ...existingImageUrls,
                            ...result.uploadedUrls
                        ];

                }



                const finalImageUrls =
                    [
                        ...existingImageUrls
                    ];



                const {
                    error
                } =
                    await supabaseClient
                        .from("products")
                        .update({

                            title:
                                title,

                            description:
                                description,

                            price:
                                price,

                            category:
                                category,

                            city:
                                city,

                            condition:
                                condition,

                            stock:
                                stock,

                            whatsapp:
                                whatsapp,

                            image_url:
                                finalImageUrls[0] ||
                                null,

                            image_urls:
                                finalImageUrls

                        })
                        .eq(
                            "id",
                            currentProduct.id
                        )
                        .eq(
                            "seller_id",
                            currentUser.id
                        );



                if (error) {

                    throw error;

                }



                await deleteStorageFiles(
                    removedImageUrls
                );



                showMessage(
                    "✅ محصول با موفقیت ویرایش شد.",
                    "success"
                );


                saveBtn.textContent =
                    "✅ ذخیره شد";



                setTimeout(
                    function() {

                        window.location.href =
                            "my-products.html";

                    },
                    1000
                );


            } catch (error) {


                console.error(error);



                if (
                    uploadedPaths.length > 0
                ) {

                    await supabaseClient
                        .storage
                        .from("product-images")
                        .remove(
                            uploadedPaths
                        );

                }



                showMessage(
                    "❌ ذخیره تغییرات انجام نشد:\n" +
                    error.message,
                    "error"
                );


                saveBtn.disabled =
                    false;


                saveBtn.textContent =
                    "💾 ذخیره تغییرات";

            }

        }
    );



function escapeHtml(value) {


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
