<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ویرایش محصول | بازارک</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

:root{
    --bg:#f4f7f5;
    --card:#fff;
    --header:#087443;
    --text:#17251d;
    --muted:#737d77;
    --border:#e2e9e4;
    --soft:#f1f7f3;
    --soft2:#f7faf8;
    --green:#087443;
    --green2:#0a8b50;
    --danger:#c62828;
    --danger-bg:#fff3f3;
    --input:#fff;
    --overlay:rgba(0,0,0,.48);
    --shadow:0 8px 30px rgba(0,0,0,.07);
    --shadow2:0 6px 20px rgba(0,0,0,.07);
}

html.dark{
    --bg:#0f1512;
    --card:#17201b;
    --header:#0a2417;
    --text:#edf4ef;
    --muted:#aab7af;
    --border:#2b3931;
    --soft:#202d25;
    --soft2:#1b2720;
    --green:#35b96f;
    --green2:#20b87a;
    --danger:#ff7777;
    --danger-bg:#321d1d;
    --input:#111a15;
    --overlay:rgba(0,0,0,.68);
    --shadow:0 8px 30px rgba(0,0,0,.28);
    --shadow2:0 6px 20px rgba(0,0,0,.25);
}

html{
    background:var(--bg);
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:background .2s,color .2s;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button,
a{
    -webkit-tap-highlight-color:transparent;
}

.header{
    background:var(--header);
    color:#fff;
    box-shadow:0 3px 18px rgba(0,0,0,.12);
    position:sticky;
    top:0;
    z-index:50;
}

.header-inner{
    max-width:980px;
    margin:auto;
    min-height:68px;
    padding:11px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.brand{
    color:#fff;
    text-decoration:none;
    font-size:21px;
    font-weight:900;
    display:flex;
    align-items:center;
    gap:8px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-btn{
    width:42px;
    height:42px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.1);
    color:#fff;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
}

.header-btn:hover{
    background:rgba(255,255,255,.18);
}

.container{
    max-width:980px;
    margin:0 auto;
    padding:28px 16px 50px;
}

.page-heading{
    margin-bottom:20px;
}

.page-heading h1{
    margin:0;
    color:var(--green);
    font-size:25px;
}

.page-heading p{
    margin:8px 0 0;
    color:var(--muted);
    font-size:13px;
    line-height:1.8;
}

.message{
    display:none;
    padding:14px 16px;
    border-radius:13px;
    margin-bottom:18px;
    white-space:pre-line;
    line-height:1.8;
    font-size:13px;
    border:1px solid transparent;
}

.message.error{
    background:var(--danger-bg);
    color:var(--danger);
    border-color:rgba(198,40,40,.15);
}

.message.success{
    background:var(--soft);
    color:var(--green);
    border-color:var(--border);
}

.loading{
    background:var(--card);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    border-radius:18px;
    padding:65px 20px;
    text-align:center;
    color:var(--muted);
}

.spinner{
    width:38px;
    height:38px;
    border:3px solid var(--border);
    border-top-color:var(--green);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 15px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.form-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:24px;
    box-shadow:var(--shadow);
}

.section{
    padding-bottom:24px;
    margin-bottom:24px;
    border-bottom:1px solid var(--border);
}

.section:last-of-type{
    border-bottom:0;
    margin-bottom:0;
    padding-bottom:0;
}

.section-title{
    margin:0 0 17px;
    font-size:17px;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:8px;
}

.section-title span{
    color:var(--green);
}

.form-group{
    margin-bottom:17px;
}

.form-group:last-child{
    margin-bottom:0;
}

.label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    font-size:13px;
    color:var(--text);
}

.input,
textarea,
select{
    width:100%;
    border:1px solid var(--border);
    border-radius:11px;
    padding:12px 13px;
    font-size:14px;
    outline:none;
    color:var(--text);
    background:var(--input);
    transition:.18s;
}

.input:focus,
textarea:focus,
select:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(8,116,67,.08);
}

textarea{
    min-height:140px;
    resize:vertical;
    line-height:1.9;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.images-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.image-box{
    position:relative;
    height:155px;
    border-radius:14px;
    overflow:hidden;
    background:var(--soft);
    border:1px solid var(--border);
}

.image-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.image-number{
    position:absolute;
    right:8px;
    bottom:8px;
    background:rgba(0,0,0,.55);
    color:#fff;
    padding:4px 8px;
    border-radius:7px;
    font-size:11px;
}

.remove-image{
    position:absolute;
    top:8px;
    left:8px;
    width:32px;
    height:32px;
    border:0;
    border-radius:50%;
    background:rgba(198,40,40,.94);
    color:#fff;
    cursor:pointer;
    font-size:20px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

.remove-image:hover{
    background:#b71c1c;
}

.empty-images{
    grid-column:1/-1;
    padding:30px 15px;
    text-align:center;
    background:var(--soft);
    border:1px dashed var(--border);
    border-radius:13px;
    color:var(--muted);
    font-size:13px;
}

.upload-box{
    margin-top:15px;
    border:2px dashed var(--border);
    border-radius:15px;
    padding:25px 15px;
    text-align:center;
    cursor:pointer;
    background:var(--soft2);
    color:var(--green);
    transition:.18s;
}

.upload-box:hover{
    border-color:var(--green);
    background:var(--soft);
}

.upload-icon{
    font-size:28px;
    margin-bottom:7px;
}

.upload-main{
    font-size:14px;
    font-weight:bold;
}

.upload-help{
    color:var(--muted);
    font-size:11px;
    margin-top:6px;
}

.upload-box input{
    display:none;
}

.new-title{
    display:none;
    margin:20px 0 10px;
    font-size:13px;
    font-weight:bold;
    color:var(--text);
}

.new-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.new-image{
    position:relative;
    height:140px;
    border-radius:14px;
    overflow:hidden;
    background:var(--soft);
    border:1px solid var(--border);
}

.new-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.remove-new{
    position:absolute;
    top:8px;
    left:8px;
    width:31px;
    height:31px;
    border:0;
    border-radius:50%;
    background:rgba(198,40,40,.94);
    color:#fff;
    cursor:pointer;
    font-size:19px;
}

.image-note{
    margin-top:10px;
    color:var(--muted);
    font-size:11px;
    line-height:1.8;
}

.actions{
    margin-top:25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.save-btn,
.cancel-btn{
    min-height:48px;
    border-radius:12px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
}

.save-btn{
    border:0;
    color:#fff;
    background:var(--green);
}

.save-btn:hover{
    background:var(--green2);
}

.save-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.cancel-btn{
    border:1px solid var(--border);
    background:var(--soft);
    color:var(--text);
}

.cancel-btn:hover{
    border-color:var(--green);
    color:var(--green);
}

.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:var(--overlay);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal{
    width:min(430px,100%);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    padding:22px;
    animation:modalIn .18s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(8px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.modal-icon{
    font-size:30px;
    text-align:center;
    margin-bottom:10px;
}

.modal h3{
    margin:0 0 9px;
    text-align:center;
    color:var(--text);
}

.modal p{
    margin:0;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    line-height:1.9;
    white-space:pre-line;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.modal-btn{
    border:0;
    border-radius:11px;
    min-height:44px;
    cursor:pointer;
    font-family:inherit;
    font-weight:bold;
}

.modal-cancel{
    background:var(--soft);
    color:var(--text);
    border:1px solid var(--border);
}

.modal-confirm{
    background:var(--green);
    color:#fff;
}

@media(max-width:700px){

    .images-grid,
    .new-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:520px){

    .header-inner{
        min-height:62px;
    }

    .brand{
        font-size:18px;
    }

    .header-btn{
        width:39px;
        height:39px;
    }

    .container{
        padding:20px 12px 40px;
    }

    .page-heading h1{
        font-size:22px;
    }

    .form-card{
        padding:17px;
        border-radius:17px;
    }

    .row{
        grid-template-columns:1fr;
        gap:0;
    }

    .images-grid,
    .new-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .image-box{
        height:145px;
    }

    .new-image{
        height:135px;
    }

    .actions{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <a href="index.html" class="brand">
            🛒 بازارک
        </a>

        <div class="header-actions">

            <button
                type="button"
                class="header-btn"
                id="themeBtn"
                title="تغییر حالت"
            >
                🌙
            </button>

            <a
                href="my-products.html"
                class="header-btn"
                title="محصولات من"
            >
                📦
            </a>

        </div>

    </div>

</header>

<main class="container">

    <div class="page-heading">

        <h1>✏️ ویرایش محصول</h1>

        <p>
            اطلاعات محصول، موجودی و تصاویر آن را مدیریت کنید.
        </p>

    </div>

    <div id="message" class="message"></div>

    <div id="loading" class="loading">

        <div class="spinner"></div>

        در حال دریافت اطلاعات محصول...

    </div>

    <div
        id="formContainer"
        class="form-card"
        style="display:none;"
    >

        <form id="editForm">

            <section class="section">

                <h2 class="section-title">
                    <span>📝</span>
                    اطلاعات محصول
                </h2>

                <div class="form-group">

                    <label class="label" for="title">
                        نام محصول
                    </label>

                    <input
                        class="input"
                        type="text"
                        id="title"
                        required
                        maxlength="150"
                        placeholder="مثلاً آیفون 13"
                    >

                </div>

                <div class="row">

                    <div class="form-group">

                        <label class="label" for="price">
                            قیمت
                        </label>

                        <input
                            class="input"
                            type="number"
                            id="price"
                            min="0"
                            step="0.01"
                            required
                            placeholder="مثلاً 25000"
                        >

                    </div>

                    <div class="form-group">

                        <label class="label" for="category">
                            دسته‌بندی
                        </label>

                        <select
                            id="category"
                            required
                        >

                            <option value="">
                                انتخاب دسته‌بندی
                            </option>

                            <option value="mobile">📱 موبایل</option>
                            <option value="computer">💻 کامپیوتر</option>
                            <option value="fashion">👕 فیشن</option>
                            <option value="shoes">👟 کفش</option>
                            <option value="gaming">🎮 گیمینگ</option>
                            <option value="home">🏠 خانه</option>
                            <option value="tools">🔧 ابزار</option>
                            <option value="vehicle">🚗 موتر</option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="form-group">

                        <label class="label" for="city">
                            شهر
                        </label>

                        <input
                            class="input"
                            type="text"
                            id="city"
                            maxlength="100"
                            placeholder="مثلاً مزار شریف"
                        >

                    </div>

                    <div class="form-group">

                        <label class="label" for="condition">
                            وضعیت محصول
                        </label>

                        <select id="condition">

                            <option value="">
                                انتخاب وضعیت
                            </option>

                            <option value="new">نو</option>
                            <option value="used">استفاده شده</option>
                            <option value="like_new">در حد نو</option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="form-group">

                        <label class="label" for="stock">
                            موجودی
                        </label>

                        <input
                            class="input"
                            type="number"
                            id="stock"
                            min="0"
                            step="1"
                            placeholder="مثلاً 1"
                        >

                    </div>

                    <div class="form-group">

                        <label class="label" for="whatsapp">
                            شماره واتساپ
                        </label>

                        <input
                            class="input"
                            type="text"
                            id="whatsapp"
                            maxlength="30"
                            placeholder="مثلاً 937XXXXXXXX"
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label class="label" for="description">
                        توضیحات محصول
                    </label>

                    <textarea
                        id="description"
                        maxlength="5000"
                        placeholder="توضیحات کامل محصول..."
                    ></textarea>

                </div>

            </section>

            <section class="section">

                <h2 class="section-title">
                    <span>🖼️</span>
                    تصاویر محصول
                </h2>

                <div
                    id="existingImages"
                    class="images-grid"
                ></div>

                <label class="upload-box">

                    <div class="upload-icon">📷</div>

                    <div class="upload-main">
                        اضافه کردن عکس جدید
                    </div>

                    <div class="upload-help">
                        از فایل‌های گوشی خود چند عکس انتخاب کنید
                    </div>

                    <input
                        type="file"
                        id="imageInput"
                        accept="image/jpeg,image/png,image/webp,image/gif"
                        multiple
                    >

                </label>

                <div
                    id="newPreviewTitle"
                    class="new-title"
                >
                    عکس‌های جدید
                </div>

                <div
                    id="newPreview"
                    class="new-grid"
                ></div>

                <div class="image-note">
                    عکس‌هایی که با × حذف می‌کنید بعد از ذخیره تغییرات از Storage حذف خواهند شد.
                </div>

            </section>

            <div class="actions">

                <button
                    type="submit"
                    id="saveBtn"
                    class="save-btn"
                >
                    💾 ذخیره تغییرات
                </button>

                <a
                    href="my-products.html"
                    class="cancel-btn"
                >
                    انصراف
                </a>

            </div>

        </form>

    </div>

</main>

<div id="confirmModal" class="modal-overlay">

    <div class="modal">

        <div id="modalIcon" class="modal-icon">
            ⚠️
        </div>

        <h3 id="modalTitle">
            تأیید
        </h3>

        <p id="modalText">
            آیا مطمئن هستید؟
        </p>

        <div class="modal-actions">

            <button
                type="button"
                class="modal-btn modal-cancel"
                id="modalCancel"
            >
                انصراف
            </button>

            <button
                type="button"
                class="modal-btn modal-confirm"
                id="modalConfirm"
            >
                تأیید
            </button>

        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://vhiewoopyqugdxwvsbno.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

const message =
    document.getElementById("message");

const loading =
    document.getElementById("loading");

const formContainer =
    document.getElementById("formContainer");

const existingImages =
    document.getElementById("existingImages");

const imageInput =
    document.getElementById("imageInput");

const newPreview =
    document.getElementById("newPreview");

const newPreviewTitle =
    document.getElementById("newPreviewTitle");

const saveBtn =
    document.getElementById("saveBtn");

const themeBtn =
    document.getElementById("themeBtn");

const confirmModal =
    document.getElementById("confirmModal");

const modalTitle =
    document.getElementById("modalTitle");

const modalText =
    document.getElementById("modalText");

const modalIcon =
    document.getElementById("modalIcon");

const modalCancel =
    document.getElementById("modalCancel");

const modalConfirm =
    document.getElementById("modalConfirm");

let currentUser = null;
let currentProduct = null;

let existingImageUrls = [];
let removedImageUrls = [];
let newFiles = [];

let modalAction = null;


/* =========================
   THEME
========================= */

function getTheme(){

    return localStorage.getItem("bazaarak-theme") || "light";

}

function applyTheme(theme){

    const dark =
        theme === "dark";

    document.documentElement.classList.toggle(
        "dark",
        dark
    );

    themeBtn.textContent =
        dark ? "☀️" : "🌙";

}

function setTheme(theme){

    localStorage.setItem(
        "bazaarak-theme",
        theme
    );

    applyTheme(theme);

    try{

        const channel =
            new BroadcastChannel(
                "bazaarak-theme"
            );

        channel.postMessage(theme);
        channel.close();

    }catch(e){}

}

applyTheme(getTheme());

themeBtn.addEventListener(
    "click",
    function(){

        setTheme(
            getTheme() === "dark"
                ? "light"
                : "dark"
        );

    }
);

try{

    const themeChannel =
        new BroadcastChannel(
            "bazaarak-theme"
        );

    themeChannel.onmessage =
        function(event){

            if(
                event.data === "dark" ||
                event.data === "light"
            ){

                applyTheme(
                    event.data
                );

            }

        };

}catch(e){}

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key === "bazaarak-theme" &&
            (
                event.newValue === "dark" ||
                event.newValue === "light"
            )
        ){

            applyTheme(
                event.newValue
            );

        }

    }
);


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}

function hideMessage(){

    message.style.display =
        "none";

}


/* =========================
   MODAL
========================= */

function showConfirm(
    title,
    text,
    icon,
    action
){

    modalTitle.textContent =
        title;

    modalText.textContent =
        text;

    modalIcon.textContent =
        icon || "⚠️";

    modalAction =
        action;

    confirmModal.style.display =
        "flex";

}

function closeConfirm(){

    confirmModal.style.display =
        "none";

    modalAction =
        null;

}

modalCancel.addEventListener(
    "click",
    closeConfirm
);

modalConfirm.addEventListener(
    "click",
    async function(){

        const action =
            modalAction;

        closeConfirm();

        if(typeof action === "function"){

            await action();

        }

    }
);

confirmModal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            confirmModal
        ){

            closeConfirm();

        }

    }
);


/* =========================
   PRODUCT ID
========================= */

function getProductId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");

}


/* =========================
   LOAD PRODUCT
========================= */

async function loadProduct(){

    try{

        const productId =
            getProductId();

        if(!productId){

            throw new Error(
                "شناسه محصول پیدا نشد."
            );

        }

        const {
            data:{
                session
            },
            error:sessionError
        } =
            await supabaseClient
                .auth
                .getSession();

        if(sessionError){

            throw sessionError;

        }

        if(!session){

            window.location.href =
                "login.html";

            return;

        }

        currentUser =
            session.user;

        const {
            data:product,
            error
        } =
            await supabaseClient
                .from("products")
                .select("*")
                .eq(
                    "id",
                    productId
                )
                .eq(
                    "seller_id",
                    currentUser.id
                )
                .maybeSingle();

        if(error){

            throw error;

        }

        if(!product){

            throw new Error(
                "محصول پیدا نشد یا شما صاحب این محصول نیستید."
            );

        }

        currentProduct =
            product;

        fillForm(product);

        loading.style.display =
            "none";

        formContainer.style.display =
            "block";

    }catch(error){

        console.error(error);

        loading.style.display =
            "none";

        showMessage(
            "❌ دریافت محصول انجام نشد:\n" +
            error.message,
            "error"
        );

    }

}


/* =========================
   FILL FORM
========================= */

function fillForm(product){

    document.getElementById(
        "title"
    ).value =
        product.title || "";

    document.getElementById(
        "price"
    ).value =
        product.price ?? "";

    document.getElementById(
        "category"
    ).value =
        product.category || "";

    document.getElementById(
        "city"
    ).value =
        product.city || "";

    document.getElementById(
        "condition"
    ).value =
        product.condition || "";

    document.getElementById(
        "stock"
    ).value =
        product.stock ?? 1;

    document.getElementById(
        "whatsapp"
    ).value =
        product.whatsapp || "";

    document.getElementById(
        "description"
    ).value =
        product.description || "";

    if(
        Array.isArray(product.image_urls) &&
        product.image_urls.length
    ){

        existingImageUrls =
            [...product.image_urls];

    }else if(product.image_url){

        existingImageUrls =
            [product.image_url];

    }else{

        existingImageUrls = [];

    }

    removedImageUrls = [];
    newFiles = [];

    renderExistingImages();
    renderNewPreview();

}


/* =========================
   EXISTING IMAGES
========================= */

function renderExistingImages(){

    if(
        existingImageUrls.length === 0
    ){

        existingImages.innerHTML = `
            <div class="empty-images">
                📦 این محصول فعلاً هیچ عکسی ندارد.
            </div>
        `;

        return;

    }

    existingImages.innerHTML =
        existingImageUrls
            .map(
                function(url,index){

                    return `
                        <div class="image-box">

                            <img
                                src="${escapeHtml(url)}"
                                alt="عکس محصول ${index + 1}"
                                loading="lazy"
                            >

                            <span class="image-number">
                                عکس ${index + 1}
                            </span>

                            <button
                                type="button"
                                class="remove-image"
                                onclick="removeExistingImage(${index})"
                                title="حذف عکس"
                            >
                                ×
                            </button>

                        </div>
                    `;

                }
            )
            .join("");

}

function removeExistingImage(index){

    const removed =
        existingImageUrls[index];

    if(!removed){

        return;

    }

    showConfirm(
        "حذف عکس",
        "این عکس پس از ذخیره تغییرات از تصاویر محصول حذف خواهد شد.",
        "🗑️",
        function(){

            removedImageUrls.push(
                removed
            );

            existingImageUrls.splice(
                index,
                1
            );

            renderExistingImages();

        }
    );

}


/* =========================
   NEW FILES
========================= */

imageInput.addEventListener(
    "change",
    function(){

        const selectedFiles =
            Array.from(
                imageInput.files || []
            );

        imageInput.value = "";

        if(
            selectedFiles.length === 0
        ){

            return;

        }

        const validFiles = [];

        for(
            const file of selectedFiles
        ){

            if(
                !file.type.startsWith(
                    "image/"
                )
            ){

                continue;

            }

            if(
                file.size > 8 * 1024 * 1024
            ){

                showMessage(
                    "❌ حجم عکس «" +
                    file.name +
                    "» بیشتر از 8MB است.",
                    "error"
                );

                continue;

            }

            validFiles.push(
                file
            );

        }

        newFiles = [
            ...newFiles,
            ...validFiles
        ];

        renderNewPreview();

    }
);

function renderNewPreview(){

    if(
        newFiles.length === 0
    ){

        newPreview.innerHTML =
            "";

        newPreviewTitle.style.display =
            "none";

        return;

    }

    newPreviewTitle.style.display =
        "block";

    newPreview.innerHTML =
        newFiles
            .map(
                function(file,index){

                    const url =
                        URL.createObjectURL(
                            file
                        );

                    return `
                        <div class="new-image">

                            <img
                                src="${url}"
                                alt="عکس جدید"
                            >

                            <button
                                type="button"
                                class="remove-new"
                                onclick="removeNewFile(${index})"
                                title="حذف عکس"
                            >
                                ×
                            </button>

                        </div>
                    `;

                }
            )
            .join("");

}

function removeNewFile(index){

    newFiles.splice(
        index,
        1
    );

    renderNewPreview();

}


/* =========================
   STORAGE
========================= */

async function uploadNewImages(){

    const uploadedUrls = [];
    const uploadedPaths = [];

    for(
        const file of newFiles
    ){

        const extension =
            (
                file.name
                    .split(".")
                    .pop() ||
                "jpg"
            )
            .toLowerCase()
            .replace(
                /[^a-z0-9]/g,
                ""
            ) || "jpg";

        const randomPart =
            Math.random()
                .toString(36)
                .substring(
                    2,
                    10
                );

        const fileName =
            Date.now() +
            "-" +
            randomPart +
            "." +
            extension;

        const filePath =
            currentUser.id +
            "/" +
            fileName;

        const {
            error
        } =
            await supabaseClient
                .storage
                .from("product-images")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType:file.type
                    }
                );

        if(error){

            throw error;

        }

        uploadedPaths.push(
            filePath
        );

        const {
            data
        } =
            supabaseClient
                .storage
                .from("product-images")
                .getPublicUrl(
                    filePath
                );

        uploadedUrls.push(
            data.publicUrl
        );

    }

    return {
        uploadedUrls,
        uploadedPaths
    };

}

function getStoragePathFromUrl(url){

    if(
        !url ||
        typeof url !== "string"
    ){

        return null;

    }

    const marker =
        "/storage/v1/object/public/product-images/";

    const index =
        url.indexOf(marker);

    if(index === -1){

        return null;

    }

    try{

        return decodeURIComponent(
            url.substring(
                index + marker.length
            )
        );

    }catch(e){

        return null;

    }

}

async function deleteStorageFiles(urls){

    const paths =
        urls
            .map(
                getStoragePathFromUrl
            )
            .filter(
                function(path){

                    return (
                        path &&
                        path.startsWith(
                            currentUser.id + "/"
                        )
                    );

                }
            );

    const uniquePaths =
        [...new Set(paths)];

    if(
        uniquePaths.length === 0
    ){

        return;

    }

    const {
        error
    } =
        await supabaseClient
            .storage
            .from("product-images")
            .remove(
                uniquePaths
            );

    if(error){

        throw error;

    }

}


/* =========================
   SAVE
========================= */

document
    .getElementById("editForm")
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();

            hideMessage();

            if(!currentProduct){

                showMessage(
                    "❌ اطلاعات محصول آماده نیست.",
                    "error"
                );

                return;

            }

            saveBtn.disabled =
                true;

            saveBtn.textContent =
                "⏳ در حال ذخیره...";

            let uploadedPaths = [];

            try{

                const title =
                    document
                        .getElementById("title")
                        .value
                        .trim();

                const price =
                    Number(
                        document
                            .getElementById("price")
                            .value
                    );

                const category =
                    document
                        .getElementById("category")
                        .value;

                const city =
                    document
                        .getElementById("city")
                        .value
                        .trim();

                const condition =
                    document
                        .getElementById("condition")
                        .value;

                const stockValue =
                    document
                        .getElementById("stock")
                        .value;

                const stock =
                    stockValue === ""
                        ? 0
                        : Number(
                            stockValue
                        );

                const whatsapp =
                    document
                        .getElementById("whatsapp")
                        .value
                        .trim();

                const description =
                    document
                        .getElementById("description")
                        .value
                        .trim();

                if(!title){

                    throw new Error(
                        "نام محصول را وارد کنید."
                    );

                }

                if(
                    Number.isNaN(price) ||
                    price < 0
                ){

                    throw new Error(
                        "قیمت محصول معتبر نیست."
                    );

                }

                if(!category){

                    throw new Error(
                        "دسته‌بندی را انتخاب کنید."
                    );

                }

                if(
                    Number.isNaN(stock) ||
                    stock < 0
                ){

                    throw new Error(
                        "موجودی محصول معتبر نیست."
                    );

                }

                if(
                    !Number.isInteger(stock)
                ){

                    throw new Error(
                        "موجودی باید یک عدد کامل باشد."
                    );

                }

                if(
                    newFiles.length > 0
                ){

                    const result =
                        await uploadNewImages();

                    uploadedPaths =
                        result.uploadedPaths;

                    existingImageUrls = [
                        ...existingImageUrls,
                        ...result.uploadedUrls
                    ];

                }

                const finalImageUrls =
                    [...existingImageUrls];

                const {
                    error
                } =
                    await supabaseClient
                        .from("products")
                        .update({

                            title:title,

                            description:
                                description,

                            price:price,

                            category:
                                category,

                            city:city,

                            condition:
                                condition,

                            stock:stock,

                            whatsapp:
                                whatsapp,

                            image_url:
                                finalImageUrls[0] ||
                                null,

                            image_urls:
                                finalImageUrls

                        })
                        .eq(
                            "id",
                            currentProduct.id
                        )
                        .eq(
                            "seller_id",
                            currentUser.id
                        );

                if(error){

                    throw error;

                }

                if(
                    removedImageUrls.length > 0
                ){

                    await deleteStorageFiles(
                        removedImageUrls
                    );

                }

                currentProduct = {
                    ...currentProduct,
                    title,
                    description,
                    price,
                    category,
                    city,
                    condition,
                    stock,
                    whatsapp,
                    image_url:
                        finalImageUrls[0] || null,
                    image_urls:
                        finalImageUrls
                };

                removedImageUrls = [];
                newFiles = [];

                showMessage(
                    "✅ محصول با موفقیت ویرایش شد.",
                    "success"
                );

                saveBtn.textContent =
                    "✅ ذخیره شد";

                setTimeout(
                    function(){

                        window.location.href =
                            "my-products.html";

                    },
                    900
                );

            }catch(error){

                console.error(error);

                if(
                    uploadedPaths.length > 0
                ){

                    try{

                        await supabaseClient
                            .storage
                            .from("product-images")
                            .remove(
                                uploadedPaths
                            );

                    }catch(cleanupError){

                        console.warn(
                            "Uploaded file cleanup failed:",
                            cleanupError
                        );

                    }

                }

                showMessage(
                    "❌ ذخیره تغییرات انجام نشد:\n" +
                    error.message,
                    "error"
                );

                saveBtn.disabled =
                    false;

                saveBtn.textContent =
                    "💾 ذخیره تغییرات";

            }

        }
    );


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   START
========================= */

loadProduct();

</script>
