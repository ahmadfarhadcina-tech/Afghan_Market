<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ویرایش پروفایل | بازارک</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f7f5;
            color: #17221b;
        }

        header {
            background: #0d7a3a;
            color: white;
            padding: 15px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;
            z-index: 100;

            box-shadow: 0 3px 15px rgba(0,0,0,.12);
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;

            background: rgba(255,255,255,.14);

            padding: 9px 14px;
            border-radius: 10px;

            font-size: 14px;
        }

        .container {
            max-width: 650px;
            margin: 35px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 25px;

            box-shadow:
                0 5px 25px rgba(0,0,0,.08);
        }

        h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* Avatar */

        .avatar-section {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar-wrapper {
            width: 130px;
            height: 130px;

            margin: auto;

            position: relative;
        }

        #avatarPreview {
            width: 130px;
            height: 130px;

            border-radius: 50%;

            object-fit: cover;

            background: #e7eee9;

            border: 5px solid white;

            box-shadow:
                0 3px 15px rgba(0,0,0,.15);
        }

        .avatar-placeholder {
            width: 130px;
            height: 130px;

            border-radius: 50%;

            background: #e7eee9;

            border: 5px solid white;

            box-shadow:
                0 3px 15px rgba(0,0,0,.15);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 55px;
        }

        .upload-button {
            display: inline-block;

            margin-top: 12px;

            background: #eaf4ee;
            color: #0d7a3a;

            padding: 10px 16px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;
        }

        #avatarInput {
            display: none;
        }

        /* Form */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            font-size: 14px;
        }

        input,
        textarea {

            width: 100%;

            border: 1px solid #dce4de;

            border-radius: 11px;

            padding: 13px;

            font-family: inherit;

            font-size: 15px;

            outline: none;

            background: #fafcfb;

            transition: .2s;
        }

        input:focus,
        textarea:focus {

            border-color: #0d7a3a;

            background: white;

            box-shadow:
                0 0 0 3px rgba(13,122,58,.08);
        }

        textarea {

            min-height: 120px;

            resize: vertical;

            line-height: 1.8;
        }

        .hint {

            display: block;

            color: #888;

            font-size: 12px;

            margin-top: 6px;
        }

        /* Save */

        .save-button {

            width: 100%;

            border: none;

            background: #0d7a3a;

            color: white;

            padding: 14px;

            border-radius: 12px;

            font-family: inherit;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .save-button:hover {
            background: #09632f;
        }

        .save-button:disabled {

            opacity: .6;

            cursor: not-allowed;
        }

        .message {

            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;
        }

        .success {

            background: #e8f7ed;

            color: #08732f;
        }

        .error {

            background: #fff0f0;

            color: #c62828;
        }

        @media(max-width:550px) {

            .container {
                margin: 20px auto;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        🛒 بازارک
    </div>

    <a href="profile.html"
       class="back">
        ← برگشت به پروفایل
    </a>

</header>


<main class="container">

    <div class="card">

        <h1>
            ✏️ ویرایش پروفایل
        </h1>

        <p class="subtitle">
            اطلاعات پروفایل خود را تغییر دهید.
        </p>


        <!-- Avatar -->

        <div class="avatar-section">

            <div class="avatar-wrapper">

                <div id="avatarPlaceholder"
                     class="avatar-placeholder">

                    👤

                </div>

                <img id="avatarPreview"
                     style="display:none;"
                     alt="عکس پروفایل">

            </div>


            <label class="upload-button"
                   for="avatarInput">

                🖼️ انتخاب عکس پروفایل

            </label>

            <input
                type="file"
                id="avatarInput"
                accept="image/*">

        </div>


        <!-- Name -->

        <div class="form-group">

            <label for="fullName">
                👤 نام و نام خانوادگی
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="مثلاً Ahmad Farhad">

        </div>


        <!-- Username -->

        <div class="form-group">

            <label for="username">
                @ نام کاربری
            </label>

            <input
                type="text"
                id="username"
                placeholder="مثلاً AhmadFarhad">

            <small class="hint">
                نام کاربری باید منحصر به فرد باشد.
            </small>

        </div>


        <!-- Bio -->

        <div class="form-group">

            <label for="bio">
                📝 درباره من
            </label>

            <textarea
                id="bio"
                placeholder="مثلاً طراح، برنامه‌نویس و فروشنده در بازارک..."></textarea>

        </div>


        <!-- WhatsApp -->

        <div class="form-group">

            <label for="whatsapp">
                📱 شماره واتساپ
            </label>

            <input
                type="tel"
                id="whatsapp"
                placeholder="مثلاً 937XXXXXXXX">

            <small class="hint">
                شماره را با کد کشور وارد کنید.
            </small>

        </div>


        <!-- City -->

        <div class="form-group">

            <label for="city">
                📍 شهر
            </label>

            <input
                type="text"
                id="city"
                placeholder="مثلاً مزار شریف">

        </div>


        <!-- Save -->

        <button
            id="saveButton"
            class="save-button">

            💾 ذخیره تغییرات

        </button>


        <div
            id="message"
            class="message">
        </div>


    </div>

</main>


<script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
        "https://vhiewoopyqugdxwvsbno.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let currentUser = null;

    let oldAvatarURL = null;


    /* =========================
       ELEMENTS
    ========================= */

    const fullName =
        document.getElementById("fullName");

    const username =
        document.getElementById("username");

    const bio =
        document.getElementById("bio");

    const whatsapp =
        document.getElementById("whatsapp");

    const city =
        document.getElementById("city");

    const avatarInput =
        document.getElementById("avatarInput");

    const avatarPreview =
        document.getElementById("avatarPreview");

    const avatarPlaceholder =
        document.getElementById("avatarPlaceholder");

    const saveButton =
        document.getElementById("saveButton");

    const message =
        document.getElementById("message");


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display =
            "block";

    }


    /* =========================
       LOAD USER
    ========================= */

    async function loadUser() {

        const {
            data: {
                user
            },
            error
        } = await supabaseClient.auth.getUser();


        if (error || !user) {

            alert(
                "برای ویرایش پروفایل باید وارد حساب شوید."
            );

            window.location.href =
                "login.html";

            return;

        }


        currentUser = user;


        await loadProfile();

    }


    /* =========================
       LOAD PROFILE
    ========================= */

    async function loadProfile() {

        const {
            data: profile,
            error
        } = await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", currentUser.id)
            .maybeSingle();


        if (error) {

            console.error(error);

            showMessage(
                "❌ خطا در دریافت پروفایل",
                "error"
            );

            return;

        }


        if (!profile) {

            return;

        }


        fullName.value =
            profile.full_name || "";


        username.value =
            profile.username || "";


        bio.value =
            profile.bio || "";


        whatsapp.value =
            profile.whatsapp || "";


        city.value =
            profile.city || "";


        oldAvatarURL =
            profile.avatar_url || null;


        if (profile.avatar_url) {

            avatarPreview.src =
                profile.avatar_url;

            avatarPreview.style.display =
                "block";

            avatarPlaceholder.style.display =
                "none";

        }

    }


    /* =========================
       IMAGE PREVIEW
    ========================= */

    avatarInput.addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file) {
                return;
            }


            if (!file.type.startsWith("image/")) {

                alert(
                    "لطفاً فقط فایل تصویری انتخاب کنید."
                );

                this.value = "";

                return;

            }


            if (file.size > 5 * 1024 * 1024) {

                alert(
                    "حجم عکس نباید بیشتر از 5MB باشد."
                );

                this.value = "";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    avatarPreview.src =
                        event.target.result;

                    avatarPreview.style.display =
                        "block";

                    avatarPlaceholder.style.display =
                        "none";

                };


            reader.readAsDataURL(file);

        }
    );


    /* =========================
       UPLOAD AVATAR
    ========================= */

    async function uploadAvatar() {

        const file =
            avatarInput.files[0];


        if (!file) {

            return oldAvatarURL;

        }


        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const filePath =
            currentUser.id +
            "/avatar." +
            extension;


        const {
            error: uploadError
        } = await supabaseClient
            .storage
            .from("avatars")
            .upload(
                filePath,
                file,
                {
                    upsert: true,
                    contentType: file.type
                }
            );


        if (uploadError) {

            console.error(uploadError);

            throw new Error(
                "آپلود عکس انجام نشد: " +
                uploadError.message
            );

        }


        const {
            data
        } = supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(filePath);


        return data.publicUrl;

    }


    /* =========================
       SAVE PROFILE
    ========================= */

    saveButton.addEventListener(
        "click",
        async function () {

            if (!currentUser) {
                return;
            }


            saveButton.disabled =
                true;

            saveButton.textContent =
                "⏳ در حال ذخیره...";


            message.style.display =
                "none";


            try {

                const avatarURL =
                    await uploadAvatar();


                const profileData = {

                    id: currentUser.id,

                    full_name:
                        fullName.value.trim() || null,

                    username:
                        username.value.trim() || null,

                    bio:
                        bio.value.trim() || null,

                    avatar_url:
                        avatarURL || null,

                    whatsapp:
                        whatsapp.value.trim() || null,

                    city:
                        city.value.trim() || null,

                    updated_at:
                        new Date().toISOString()

                };


                const {
                    error
                } = await supabaseClient
                    .from("profiles")
                    .upsert(
                        profileData,
                        {
                            onConflict: "id"
                        }
                    );


                if (error) {

                    console.error(error);

                    throw new Error(
                        error.message
                    );

                }


                showMessage(
                    "✅ پروفایل با موفقیت ذخیره شد!",
                    "success"
                );


                saveButton.textContent =
                    "✅ ذخیره شد";


                setTimeout(
                    function () {

                        window.location.href =
                            "profile.html";

                    },
                    1200
                );


            } catch (error) {

                console.error(error);

                showMessage(
                    "❌ " + error.message,
                    "error"
                );


                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "💾 ذخیره تغییرات";

            }

        }
    );


    /* =========================
       START
    ========================= */

    loadUser();

</script>


</body>

</html>
