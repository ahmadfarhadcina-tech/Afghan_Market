<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#087a55">
<title>پروفایل فروشنده | بازارک</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#f4f7f5;
    --card:#fff;
    --header:#123d28;
    --text:#17231c;
    --muted:#6b786f;
    --border:#e1e8e3;
    --soft:#f1f6f3;
    --green:#167342;
    --green2:#087a55;
    --danger:#dc2626;
    --warning:#f59e0b;
    --shadow:0 5px 22px rgba(0,0,0,.06);
}

html.dark{
    --bg:#0f1512;
    --card:#17201b;
    --header:#0b2116;
    --text:#f1f5f2;
    --muted:#aab7af;
    --border:#2a3830;
    --soft:#202c25;
    --green:#35b96f;
    --green2:#20b87a;
    --danger:#f87171;
    --warning:#fbbf24;
    --shadow:0 5px 25px rgba(0,0,0,.25);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    background:var(--bg);
    color-scheme:light;
}

html.dark{
    color-scheme:dark;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:
        background .25s ease,
        color .25s ease;
    min-height:100vh;
}

button,
input,
select{
    font-family:inherit;
}

button,
a{
    -webkit-tap-highlight-color:transparent;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    cursor:pointer;
}

button:active{
    transform:scale(.96);
}

.header{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--header);
    color:#fff;
    padding:13px 15px;
    box-shadow:0 2px 14px rgba(0,0,0,.13);
}

.header-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:11px;
}

.back-btn,
.theme-btn{
    width:42px;
    height:42px;
    flex:none;
    border:0;
    border-radius:12px;
    background:rgba(255,255,255,.12);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    transition:.2s;
}

.header-title{
    flex:1;
    font-size:18px;
    font-weight:bold;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:20px 14px 70px;
}

.profile-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:28px 20px;
    box-shadow:var(--shadow);
    text-align:center;
}

.avatar-wrap{
    width:112px;
    height:112px;
    margin:0 auto 13px;
    position:relative;
}

.avatar{
    width:112px;
    height:112px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:4px solid var(--soft);
    background:var(--soft);
}

.name{
    font-size:23px;
    font-weight:bold;
    line-height:1.5;
}

.username{
    direction:ltr;
    color:var(--muted);
    margin-top:4px;
    font-size:14px;
}

.bio{
    max-width:650px;
    margin:14px auto 0;
    color:var(--muted);
    line-height:1.9;
    white-space:pre-wrap;
}

.info{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-top:15px;
}

.info-item{
    background:var(--soft);
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:11px;
    padding:8px 12px;
    font-size:13px;
}

.actions{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:9px;
    margin-top:19px;
}

.action-btn{
    min-height:43px;
    border:0;
    border-radius:12px;
    padding:10px 17px;
    font-size:14px;
    font-weight:bold;
    transition:.2s;
}

.follow-btn{
    min-width:125px;
    background:var(--green);
    color:#fff;
}

.follow-btn.following{
    background:var(--soft);
    color:var(--text);
    border:1px solid var(--border);
}

.whatsapp-btn{
    background:#20b968;
    color:#fff;
}

.share-btn{
    background:var(--soft);
    color:var(--text);
    border:1px solid var(--border);
}

.action-btn:disabled{
    opacity:.55;
    cursor:wait;
}

.login-message{
    margin-top:13px;
    color:var(--muted);
    font-size:12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:21px;
}

.stat{
    background:var(--soft);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 8px;
}

.stat-number{
    color:var(--green);
    font-size:20px;
    font-weight:bold;
}

.stat-title{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.rating-box{
    margin-top:12px;
    padding:14px;
    background:var(--soft);
    border:1px solid var(--border);
    border-radius:16px;
}

.rating-stars{
    color:var(--warning);
    font-size:20px;
    letter-spacing:2px;
    line-height:1.3;
}

.rating-text{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:28px 3px 13px;
}

.section-title{
    font-size:20px;
    font-weight:bold;
}

.product-tools{
    display:flex;
    align-items:center;
    gap:8px;
    width:min(440px,55%);
}

.product-search,
.product-sort{
    height:42px;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--card);
    color:var(--text);
    outline:none;
}

.product-search{
    min-width:0;
    flex:1;
    padding:0 12px;
}

.product-sort{
    width:145px;
    padding:0 9px;
}

.product-search:focus,
.product-sort:focus{
    border-color:var(--green);
}

.products{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
}

.product-card{
    min-width:0;
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:
        transform .16s ease,
        box-shadow .2s ease;
}

.product-card:hover{
    transform:translateY(-2px);
}

.product-image-wrap{
    width:100%;
    min-height:170px;
    background:var(--soft);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-image{
    width:100%;
    height:auto;
    max-height:330px;
    object-fit:contain;
    display:block;
}

.no-image{
    width:100%;
    min-height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

.product-info{
    padding:13px;
}

.product-title{
    font-size:15px;
    font-weight:bold;
    line-height:1.65;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.price{
    color:var(--green);
    font-weight:bold;
    margin-top:7px;
}

.city{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.empty{
    grid-column:1/-1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
}

.empty-icon{
    font-size:42px;
    margin-bottom:10px;
}

.loading{
    padding:70px 20px;
    text-align:center;
    color:var(--muted);
}

.loading-spinner{
    width:34px;
    height:34px;
    margin:0 auto 13px;
    border:3px solid var(--border);
    border-top-color:var(--green);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

.error{
    background:#fff0f0;
    color:#b42318;
    border:1px solid #ffd1d1;
    border-radius:16px;
    padding:20px;
    text-align:center;
}

html.dark .error{
    background:#351c1c;
    color:#ff9b9b;
    border-color:#573030;
}

.refresh-btn{
    margin-top:12px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:10px;
    padding:9px 14px;
}

/* MODAL */

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.58);
    backdrop-filter:blur(6px);
}

.modal-overlay.show{
    display:flex;
    animation:fadeIn .2s ease;
}

.modal{
    width:min(430px,100%);
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:22px;
    padding:23px;
    box-shadow:0 20px 65px rgba(0,0,0,.3);
    animation:modalIn .22s ease;
}

.modal-icon{
    font-size:38px;
    text-align:center;
    margin-bottom:8px;
}

.modal-title{
    text-align:center;
    font-size:19px;
    font-weight:bold;
}

.modal-text{
    color:var(--muted);
    text-align:center;
    line-height:1.9;
    margin-top:9px;
    font-size:14px;
    white-space:pre-wrap;
    word-break:break-word;
}

.modal-actions{
    display:flex;
    gap:9px;
    margin-top:20px;
}

.modal-btn{
    flex:1;
    min-height:43px;
    border:0;
    border-radius:11px;
    padding:10px;
    font-weight:bold;
}

.modal-primary{
    background:var(--green);
    color:#fff;
}

.modal-secondary{
    background:var(--soft);
    color:var(--text);
    border:1px solid var(--border);
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(14px) scale(.97);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:700px){

    .container{
        padding-top:14px;
    }

    .product-tools{
        width:100%;
    }

    .section-head{
        align-items:stretch;
        flex-direction:column;
    }

}

@media(max-width:520px){

    .profile-card{
        padding:23px 14px;
    }

    .name{
        font-size:21px;
    }

    .products{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .product-image-wrap,
    .no-image{
        min-height:140px;
    }

    .product-info{
        padding:10px;
    }

    .product-title{
        font-size:14px;
    }

    .product-tools{
        flex-direction:row;
    }

    .product-sort{
        width:125px;
    }

}

@media(max-width:380px){

    .products{
        grid-template-columns:1fr;
    }

    .stats{
        gap:6px;
    }

    .stat{
        padding:12px 5px;
    }

    .stat-number{
        font-size:18px;
    }

    .action-btn{
        padding:10px 13px;
    }

    .product-tools{
        flex-direction:column;
    }

    .product-search,
    .product-sort{
        width:100%;
    }

}
</style>
</head>

<body>

<script>

const SUPABASE_URL =
    "https://vhiewoopyqugdxwvsbno.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const params =
    new URLSearchParams(
        window.location.search
    );

const sellerId =
    params.get("id");

let currentUser = null;
let sellerProfile = null;
let sellerProducts = [];
let isFollowing = false;
let modalCallback = null;


/* =========================
   THEME
========================= */

function getTheme(){

    return (
        localStorage.getItem(
            "bazaarak-theme"
        ) || "light"
    );

}

function applyTheme(theme){

    document.documentElement.classList.toggle(
        "dark",
        theme === "dark"
    );

    const button =
        document.getElementById(
            "themeBtn"
        );

    if(button){

        button.textContent =
            theme === "dark"
                ? "☀️"
                : "🌙";

    }

}

function setTheme(theme){

    localStorage.setItem(
        "bazaarak-theme",
        theme
    );

    applyTheme(theme);

    try{

        const channel =
            new BroadcastChannel(
                "bazaarak-theme"
            );

        channel.postMessage({
            theme:theme
        });

        channel.close();

    }catch(error){}

}

applyTheme(getTheme());

document.getElementById(
    "themeBtn"
).addEventListener(
    "click",
    function(){

        setTheme(
            getTheme() === "dark"
                ? "light"
                : "dark"
        );

    }
);

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key === "bazaarak-theme" &&
            event.newValue
        ){

            applyTheme(
                event.newValue
            );

        }

    }
);

try{

    const themeChannel =
        new BroadcastChannel(
            "bazaarak-theme"
        );

    themeChannel.onmessage =
        function(event){

            const theme =
                event.data?.theme ||
                event.data;

            if(
                theme === "dark" ||
                theme === "light"
            ){

                applyTheme(theme);

            }

        };

}catch(error){}


/* =========================
   MODAL
========================= */

function showModal(
    title,
    text,
    icon = "ℹ️",
    confirmText = null,
    callback = null
){

    document.getElementById(
        "modalTitle"
    ).textContent =
        title;

    document.getElementById(
        "modalText"
    ).textContent =
        text;

    document.getElementById(
        "modalIcon"
    ).textContent =
        icon;

    const confirm =
        document.getElementById(
            "modalConfirm"
        );

    if(confirmText){

        confirm.style.display =
            "block";

        confirm.textContent =
            confirmText;

        modalCallback =
            callback;

    }else{

        confirm.style.display =
            "none";

        modalCallback =
            null;

    }

    document.getElementById(
        "modalOverlay"
    ).classList.add("show");

}

function closeModal(){

    document.getElementById(
        "modalOverlay"
    ).classList.remove("show");

    modalCallback = null;

}

document.getElementById(
    "modalCancel"
).addEventListener(
    "click",
    closeModal
);

document.getElementById(
    "modalConfirm"
).addEventListener(
    "click",
    async function(){

        const callback =
            modalCallback;

        closeModal();

        if(callback){

            await callback();

        }

    }
);

document.getElementById(
    "modalOverlay"
).addEventListener(
    "click",
    function(event){

        if(
            event.target === this
        ){

            closeModal();

        }

    }
);


/* =========================
   HELPERS
========================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function formatPrice(price){

    if(
        price === null ||
        price === undefined ||
        price === ""
    ){

        return "قیمت نامشخص";

    }

    const number =
        Number(price);

    if(!Number.isFinite(number)){

        return "قیمت نامشخص";

    }

    return (
        number.toLocaleString("fa-AF") +
        " افغانی"
    );

}

function getProductImage(product){

    if(
        Array.isArray(
            product.image_urls
        ) &&
        product.image_urls.length
    ){

        return product.image_urls[0];

    }

    return product.image_url || "";

}

function normalizeWhatsApp(number){

    if(!number){

        return "";

    }

    let value =
        String(number)
            .trim()
            .replace(/[^\d+]/g,"");

    if(
        value.startsWith("+")
    ){

        value =
            value.substring(1);

    }

    if(
        value.startsWith("00")
    ){

        value =
            value.substring(2);

    }

    if(
        value.startsWith("0")
    ){

        value =
            "93" +
            value.substring(1);

    }

    if(
        value.startsWith("7")
    ){

        value =
            "93" +
            value;

    }

    if(
        /^937\d{8}$/.test(value)
    ){

        return value;

    }

    return "";

}

function getWhatsAppUrl(number){

    const normalized =
        normalizeWhatsApp(number);

    if(!normalized){

        return "";

    }

    return (
        "https://wa.me/" +
        normalized
    );

}

            data,
            error
        } =

    }

            .from("followers")

                count:"exact",
                head:true

            })

/* =========================
   FOLLOW STATUS
========================= */

async function checkFollowStatus(){

    const button =
        document.getElementById(
            "followBtn"
        );

    if(!currentUser){

        button.style.display =
            "inline-block";

        isFollowing = false;

        updateFollowButton();

        return;

    }


    if(
        currentUser.id === sellerId
    ){

        button.style.display =
            "none";

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("followers")
        .select("id")
        .eq(
            "follower_id",
            currentUser.id
        )
        .eq(
            "following_id",
            sellerId
        )
        .maybeSingle();


    if(error){

        console.error(
            "FOLLOW CHECK:",
            error
        );

        isFollowing = false;

    }else{

        isFollowing =
            !!data;

    }

    updateFollowButton();

}

function updateFollowButton(){

    const button =
        document.getElementById(
            "followBtn"
        );

    if(isFollowing){

        button.textContent =
            "دنبال شده ✓";

        button.classList.add(
            "following"
        );

    }else{

        button.textContent =
            "دنبال کردن";

        button.classList.remove(
            "following"
        );

    }

}


/* =========================
   FOLLOW / UNFOLLOW
========================= */

async function toggleFollow(){

    if(!currentUser){

        showModal(
            "ورود به حساب",
            "برای دنبال کردن فروشنده ابتدا وارد حساب بازارک شوید.",
            "🔐",
            "ورود",
            function(){

                window.location.href =
                    "login.html";

            }
        );

        return;

    }


    if(
        currentUser.id === sellerId
    ){

        return;

    }


    const button =
        document.getElementById(
            "followBtn"
        );

    if(button.disabled){

        return;

    }

    button.disabled = true;


    if(isFollowing){

        const {
            error
        } =
        await supabaseClient
            .from("followers")
            .delete()
            .eq(
                "follower_id",
                currentUser.id
            )
            .eq(
                "following_id",
                sellerId
            );

        if(error){

            console.error(
                "UNFOLLOW:",
                error
            );

            showModal(
                "خطا",
                "لغو دنبال کردن انجام نشد.",
                "⚠️"
            );

        }else{

            isFollowing = false;

            updateFollowButton();

            await loadFollowStats();

        }

    }else{

        const {
            error
        } =
        await supabaseClient
            .from("followers")
            .insert({

                follower_id:
                    currentUser.id,

                following_id:
                    sellerId

            });

        if(error){

            console.error(
                "FOLLOW:",
                error
            );

            if(
                error.code === "23505"
            ){

                isFollowing = true;

                updateFollowButton();

            }else{

                showModal(
                    "خطا",
                    "دنبال کردن فروشنده انجام نشد.",
                    "⚠️"
                );

            }

        }else{

            isFollowing = true;

            updateFollowButton();

            await loadFollowStats();

        }

    }

    button.disabled = false;

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts(){

    const {
        data:products,
        error
    } =
    await supabaseClient
        .from("products")
        .select(`
            id,
            title,
            price,
            city,
            image_url,
            image_urls,
            status,
            created_at
        `)
        .eq(
            "seller_id",
            sellerId
        )
        .eq(
            "status",
            "active"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "PRODUCTS ERROR:",
            error
        );

        document.getElementById(
            "products"
        ).innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                خطا در دریافت محصولات.
            </div>
        `;

        return;

    }


    sellerProducts =
        products || [];


    document.getElementById(
        "productsCount"
    ).textContent =
        sellerProducts.length;


    renderFilteredProducts();


    await loadSellerRating(
        sellerProducts
    );

}


function renderFilteredProducts(){

    const query =
        document.getElementById(
            "productSearch"
        ).value
            .trim()
            .toLowerCase();

    const sort =
        document.getElementById(
            "productSort"
        ).value;


    let filtered =
        sellerProducts.filter(
            product => {

                const title =
                    String(
                        product.title || ""
                    ).toLowerCase();

                const city =
                    String(
                        product.city || ""
                    ).toLowerCase();

                return (
                    !query ||
                    title.includes(query) ||
                    city.includes(query)
                );

            }
        );


    if(sort === "price-low"){

        filtered.sort(
            (a,b) =>
                Number(a.price || 0) -
                Number(b.price || 0)
        );

    }

    if(sort === "price-high"){

        filtered.sort(
            (a,b) =>
                Number(b.price || 0) -
                Number(a.price || 0)
        );

    }

    if(sort === "newest"){

        filtered.sort(
            (a,b) =>
                new Date(
                    b.created_at || 0
                ) -
                new Date(
                    a.created_at || 0
                )
        );

    }


    renderProducts(
        filtered
    );

}


function renderProducts(products){

    const container =
        document.getElementById(
            "products"
        );


    if(!products.length){

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🛍️</div>
                ${
                    sellerProducts.length
                    ? "محصولی مطابق جستجو پیدا نشد."
                    : "این فروشنده هنوز محصولی برای فروش ندارد."
                }
            </div>
        `;

        return;

    }


    container.innerHTML =
        products.map(
            product => {

                const image =
                    getProductImage(
                        product
                    );

                const safeId =
                    encodeURIComponent(
                        product.id
                    );


                return `
                    <article
                        class="product-card"
                        onclick="openProduct('${safeId}')"
                    >

                        <div class="product-image-wrap">

                            ${
                                image
                                ?
                                `
                                <img
                                    src="${escapeHTML(image)}"
                                    class="product-image"
                                    alt="${escapeHTML(product.title || "محصول")}"
                                    loading="lazy"
                                    onerror="this.onerror=null;this.parentElement.innerHTML='<div class=&quot;no-image&quot;>🛍️</div>'"
                                >
                                `
                                :
                                `
                                <div class="no-image">
                                    🛍️
                                </div>
                                `
                            }

                        </div>

                        <div class="product-info">

                            <div class="product-title">
                                ${escapeHTML(
                                    product.title ||
                                    "محصول بدون نام"
                                )}
                            </div>

                            <div class="price">
                                ${formatPrice(
                                    product.price
                                )}
                            </div>

                            ${
                                product.city
                                ?
                                `
                                <div class="city">
                                    📍 ${escapeHTML(
                                        product.city
                                    )}
                                </div>
                                `
                                :
                                ""
                            }

                        </div>

                    </article>
                `;

            }
        ).join("");

}


/* =========================

document.getElementById(

document.getElementById(

/* =========================
   SELLER RATING
========================= */

async function loadSellerRating(products){

    const productIds =
        products.map(
            product => product.id
        );


    if(!productIds.length){

        setRating(
            0,
            0
        );

        return;

    }


    const {
        data:comments,
        error
    } =
    await supabaseClient
        .from("product_comments")
        .select("rating")
        .in(
            "product_id",
            productIds
        );


    if(error){

        console.error(
            "RATING ERROR:",
            error
        );

        setRating(
            0,
            0
        );

        return;

    }


    const ratings =
        (comments || [])
            .map(
                item =>
                    Number(
                        item.rating
                    )
            )
            .filter(
                rating =>
                    rating >= 1 &&
                    rating <= 5
            );


    if(!ratings.length){

        setRating(
            0,
            0
        );

        return;

    }


    const average =
        ratings.reduce(
            (sum,rating) =>
                sum + rating,
            0
        ) /
        ratings.length;


    setRating(
        average,
        ratings.length
    );

}


function setRating(
    average,
    count
){

    const stars =
        document.getElementById(
            "ratingStars"
        );

    const text =
        document.getElementById(
            "ratingText"
        );


    if(!count){

        stars.textContent =
            "☆☆☆☆☆";

        text.textContent =
            "هنوز امتیازی ثبت نشده";

        return;

    }


    const rounded =
        Math.max(
            0,
            Math.min(
                5,
                Math.round(average)
            )
        );


    stars.textContent =
        "★".repeat(rounded) +
        "☆".repeat(
            5 - rounded
        );


    text.textContent =
        average.toFixed(1) +
        " از 5 • " +
        count +
        " امتیاز";

}

/* =========================
   SHARE
========================= */

document.getElementById(
    "shareBtn"
).addEventListener(
    "click",
    async function(){

        const shareUrl =
            window.location.href;

        const shareTitle =
            (
                sellerProfile?.full_name ||
                sellerProfile?.username ||
                "پروفایل فروشنده"
            ) +
            " | بازارک";


        if(
            navigator.share
        ){

            try{

                await navigator.share({

                    title:
                        shareTitle,

                    text:
                        "پروفایل این فروشنده را در بازارک ببینید.",

                    url:
                        shareUrl

                });

                return;

            }catch(error){

                if(
                    error?.name ===
                    "AbortError"
                ){

                    return;

                }

            }

        }


        try{

            await navigator.clipboard.writeText(
                shareUrl
            );

            showModal(
                "لینک کپی شد",
                "لینک پروفایل فروشنده با موفقیت کپی شد.",
                "🔗"
            );

        }catch(error){

            showModal(
                "اشتراک‌گذاری",
                shareUrl,
                "🔗"
            );

        }

    }
);

   INIT
========================= */

async function init(){

    if(!sellerId){

        showError(
            "شناسه فروشنده پیدا نشد."
        );

        return;

    }


    await getCurrentUser();


    const profileLoaded =
        await loadProfile();


    if(!profileLoaded){

        return;

    }


    await Promise.all([

        loadFollowStats(),

        checkFollowStatus(),

        loadProducts()

    ]);

}


init();

========================= */

            "visible" &&
            sellerId
        ){

            await getCurrentUser();

            await Promise.all([

            ]);

        }

    }
