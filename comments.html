<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظرات | بازارک</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ================================
   BASE
================================ */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f7f5;
    color:#17251d;

    /*
       فقط برای اینکه آخرین پیام
       زیر نوار پایین نرود.
    */
    padding-bottom:82px;

    opacity:1;
    transform:translateY(0);

    transition:
        opacity .24s ease,
        transform .24s ease;
}

body.page-leaving{
    opacity:0;
    transform:translateY(8px);
}

button,
input{
    -webkit-tap-highlight-color:transparent;
}


/* ================================
   HEADER
================================ */

.header{
    position:sticky;
    top:0;
    z-index:20;

    background:rgba(255,255,255,.96);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    border-bottom:1px solid #e7eee9;

    padding:12px 16px;
}

.header-inner{
    max-width:700px;
    margin:auto;

    display:flex;
    align-items:center;

    gap:10px;
}

.back-btn{
    width:39px;
    height:39px;

    border:0;
    border-radius:50%;

    background:#eef5f1;
    color:#087443;

    font-size:21px;

    cursor:pointer;

    transition:
        transform .18s ease,
        background .18s ease;
}

.back-btn:hover{
    background:#e2efe7;
}

.back-btn:active{
    transform:scale(.84);
}

.header-title{
    flex:1;
}

.header-title strong{
    display:block;
    color:#087443;
    font-size:16px;
}

.header-title span{
    display:block;
    color:#888;
    font-size:11px;
    margin-top:3px;
}


/* ================================
   PRODUCT PREVIEW
================================ */

.product-preview{
    max-width:700px;
    margin:12px auto;
    padding:0 14px;
}

.product-box{
    background:#fff;
    border-radius:13px;

    padding:10px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.045);

    display:flex;
    align-items:center;

    gap:10px;

    animation:
        productIn .3s ease both;
}

@keyframes productIn{

    from{
        opacity:0;
        transform:translateY(-7px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.product-box img{
    width:56px;
    height:56px;

    border-radius:9px;

    object-fit:cover;

    background:#eef2ef;

    flex-shrink:0;
}

.product-box-info{
    min-width:0;
}

.product-box-title{
    font-weight:bold;
    font-size:13px;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.product-box-price{
    color:#087443;
    font-size:12px;

    margin-top:5px;

    font-weight:bold;
}


/* ================================
   COMMENTS
================================ */

.comments-container{
    width:100%;
    max-width:700px;

    margin:auto;

    /*
       پایین اضافه تا کامنت آخر
       پشت composer نرود.
    */
    padding:
        4px
        12px
        25px;
}

.comments-list{
    display:flex;
    flex-direction:column;

    gap:18px;

    width:100%;
}


/* ================================
   COMMENT
   کاملاً بدون کارت
================================ */

.comment-item,
.reply-item{
    width:100%;

    margin:0;
    padding:0;

    background:transparent;
    border:0;
    box-shadow:none;

    display:flex;
    flex-direction:column;

    animation:
        commentIn .24s ease both;
}

@keyframes commentIn{

    from{
        opacity:0;
        transform:translateY(7px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* ================================
   ALIGNMENT
================================ */

/*
   کامنت خود کاربر → راست
   کامنت دیگران → چپ
*/

.comment-item.mine{
    align-items:flex-end;
}

.comment-item.other{
    align-items:flex-start;
}


/* ================================
   MESSAGE WRAP
================================ */

.message-wrap{
    width:fit-content;
    max-width:88%;

    display:flex;
    flex-direction:column;
}


/* ================================
   USER HEADER
================================ */

.comment-header{
    width:fit-content;

    display:flex;
    align-items:center;

    gap:7px;

    margin-bottom:4px;

    cursor:pointer;

    transition:
        transform .18s ease,
        opacity .18s ease;
}

.comment-item.mine .comment-header{
    align-self:flex-end;
}

.comment-item.other .comment-header{
    align-self:flex-start;
}

.comment-header:active{
    transform:scale(.97);
    opacity:.75;
}

.comment-avatar{
    width:33px;
    height:33px;

    border-radius:50%;

    object-fit:cover;

    background:#dfeee5;

    flex-shrink:0;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.comment-avatar:hover{
    transform:scale(1.06);

    box-shadow:
        0 0 0 3px #dcece3;
}

.comment-avatar:active{
    transform:scale(.86);
}

.comment-user{
    min-width:0;
}

.comment-user-name{
    color:#087443;

    font-weight:bold;

    font-size:11px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.comment-user-username{
    color:#8d9690;

    font-size:9px;

    margin-top:1px;
}


/* ================================
   MESSAGE BUBBLE
   فقط اندازه خود پیام
================================ */

.message-bubble{

    /*
       مهم‌ترین قسمت:
       عرض فقط به اندازه متن
    */

    display:inline-block;

    width:fit-content;

    max-width:100%;

    padding:
        6px 10px;

    background:#e7f3eb;

    border-radius:10px;

    color:#27332c;

    font-size:13px;

    line-height:1.65;

    white-space:pre-wrap;

    overflow-wrap:anywhere;

    /*
       متن خود پیام:
       راست‌چین و طبیعی
    */
    text-align:right;

    direction:rtl;

    transition:
        background .18s ease,
        transform .16s ease;
}

.message-bubble:hover{
    background:#e1f0e6;
}

.message-bubble:active{
    transform:scale(.99);
}


/*
   پیام دیگران
*/

.comment-item.other .message-bubble{
    background:#fff;

    text-align:left;
    direction:ltr;
}

.comment-item.other .message-bubble:hover{
    background:#fafcfb;
}


/* ================================
   ACTIONS
   کاملاً خارج از پیام
================================ */

.comment-actions{

    width:fit-content;

    display:flex;
    align-items:center;

    gap:3px;

    margin-top:3px;

    min-height:25px;
}

.comment-item.mine .comment-actions{
    align-self:flex-end;
}

.comment-item.other .comment-actions{
    align-self:flex-start;
}

.comment-action{

    border:0;

    background:transparent;

    color:#7b857e;

    font-family:inherit;

    font-size:10px;

    padding:3px 6px;

    border-radius:6px;

    cursor:pointer;

    transition:
        background .18s ease,
        color .18s ease,
        transform .16s ease,
        opacity .18s ease;
}

.comment-action:hover{
    background:#e8f1eb;
    color:#087443;
}

.comment-action:active{
    transform:scale(.82);
}

.comment-action.liked{
    color:#c62828;
    background:#fff0f0;
}

.comment-action.loading{
    opacity:.5;
    pointer-events:none;
}


/* ================================
   THREE DOT
================================ */

.more-wrapper{
    position:relative;
}

.more-button{

    width:25px;
    height:25px;

    border:0;

    background:transparent;

    color:#8a938d;

    border-radius:50%;

    font-size:17px;

    line-height:25px;

    cursor:pointer;

    transition:
        background .18s ease,
        color .18s ease,
        transform .16s ease;
}

.more-button:hover{
    background:#e8f1eb;
    color:#087443;
}

.more-button:active{
    transform:scale(.8);
}


/* ================================
   MORE MENU
================================ */

.more-menu{

    position:absolute;

    top:28px;
    right:0;

    min-width:110px;

    background:#fff;

    border-radius:9px;

    padding:4px;

    border:1px solid #e3ebe6;

    box-shadow:
        0 9px 25px rgba(0,0,0,.11);

    opacity:0;
    visibility:hidden;

    transform:
        translateY(-5px)
        scale(.94);

    transform-origin:top right;

    transition:
        opacity .18s ease,
        transform .18s ease,
        visibility .18s ease;

    z-index:60;
}

.more-menu.show{

    opacity:1;
    visibility:visible;

    transform:
        translateY(0)
        scale(1);
}

.more-menu button{

    width:100%;

    border:0;

    background:transparent;

    color:#c62828;

    font-family:inherit;

    font-size:10px;

    text-align:right;

    padding:8px;

    border-radius:7px;

    cursor:pointer;

    transition:
        background .16s ease,
        transform .16s ease;
}

.more-menu button:hover{
    background:#fff1f1;
}

.more-menu button:active{
    transform:scale(.94);
}


/* ================================
   REPLIES
================================ */

.replies{

    width:100%;

    margin-top:8px;

    padding-right:12px;

    border-right:2px solid #dce9e1;

    display:flex;

    flex-direction:column;

    gap:10px;
}

.reply-item{
    width:100%;
}

.reply-item .message-wrap{
    max-width:88%;
}

.reply-item .message-bubble{
    background:#f0f6f2;

    font-size:12px;

    padding:
        6px 9px;
}

.reply-item .comment-avatar{
    width:29px;
    height:29px;
}

.reply-item .comment-user-name{
    font-size:10px;
}

.reply-item .comment-user-username{
    font-size:8px;
}


/* ================================
   REPLY BOX
================================ */

.reply-box{

    width:100%;

    margin-top:6px;

    display:none;

    animation:
        replyBoxIn .2s ease both;
}

.reply-box.show{
    display:block;
}

@keyframes replyBoxIn{

    from{
        opacity:0;
        transform:translateY(-5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.reply-form{

    display:flex;

    gap:6px;

    width:min(100%,420px);
}

.reply-input{

    flex:1;
    min-width:0;

    border:1px solid #d6e2da;

    background:#fff;

    border-radius:9px;

    padding:
        8px 10px;

    outline:none;

    font-family:inherit;

    font-size:11px;

    transition:
        border-color .18s ease,
        box-shadow .18s ease;
}

.reply-input:focus{

    border-color:#087443;

    box-shadow:
        0 0 0 2px rgba(8,116,67,.07);
}

.reply-send{

    border:0;

    background:#087443;

    color:#fff;

    border-radius:9px;

    padding:0 12px;

    font-family:inherit;

    font-size:11px;

    cursor:pointer;

    transition:
        transform .16s ease,
        background .18s ease;
}

.reply-send:hover{
    background:#07643a;
}

.reply-send:active{
    transform:scale(.88);
}


/* ================================
   FIXED COMMENT COMPOSER
================================ */

.comment-composer{

    /*
       کاملاً فیکس به پایین صفحه
    */

    position:fixed !important;

    left:0 !important;
    right:0 !important;
    bottom:0 !important;

    width:100%;

    z-index:1000;

    background:rgba(255,255,255,.98);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    border-top:1px solid #dfe8e2;

    /*
       به لبه پایین می‌چسبد
    */
    padding:
        9px
        12px
        calc(9px + env(safe-area-inset-bottom));

    box-shadow:
        0 -5px 20px rgba(0,0,0,.07);

    animation:
        composerIn .3s ease both;
}

@keyframes composerIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.composer-inner{

    width:100%;

    max-width:700px;

    margin:auto;

    display:flex;

    align-items:center;

    gap:8px;
}

.main-input{

    flex:1;

    min-width:0;

    height:48px;

    border:1px solid #d3e0d8;

    border-radius:13px;

    background:#f7faf8;

    padding:
        0 14px;

    outline:none;

    font-family:inherit;

    font-size:13px;

    color:#27332c;

    transition:
        border-color .18s ease,
        background .18s ease,
        box-shadow .18s ease;
}

.main-input:focus{

    background:#fff;

    border-color:#087443;

    box-shadow:
        0 0 0 3px rgba(8,116,67,.07);
}

.send-btn{

    height:48px;

    min-width:75px;

    border:0;

    border-radius:13px;

    background:#087443;

    color:#fff;

    padding:0 15px;

    font-family:inherit;

    font-weight:bold;

    font-size:12px;

    cursor:pointer;

    transition:
        transform .16s ease,
        background .18s ease,
        opacity .18s ease;
}

.send-btn:hover{
    background:#07643a;
}

.send-btn:active{
    transform:scale(.91);
}

.send-btn:disabled{
    opacity:.6;
    pointer-events:none;
}


/* ================================
   LOGIN
================================ */

.login-state{

    background:#fff;

    border-radius:13px;

    padding:18px;

    margin-bottom:15px;

    text-align:center;

    color:#777;

    font-size:12px;
}

.login-state a{

    display:inline-block;

    margin-top:9px;

    background:#087443;

    color:#fff;

    padding:9px 14px;

    border-radius:9px;

    text-decoration:none;

    font-size:11px;

    transition:
        transform .16s ease;
}

.login-state a:active{
    transform:scale(.93);
}


/* ================================
   STATE
================================ */

.state{

    text-align:center;

    color:#8a938d;

    padding:45px 20px;

    font-size:13px;
}


/* ================================
   DELETE MODAL
================================ */

.delete-overlay{

    position:fixed;

    inset:0;

    z-index:2000;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(10,25,17,.28);

    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .22s ease,
        visibility .22s ease;
}

.delete-overlay.show{

    opacity:1;
    visibility:visible;
}

.delete-dialog{

    width:min(330px,100%);

    background:#fff;

    border-radius:18px;

    padding:20px;

    text-align:center;

    box-shadow:
        0 18px 50px rgba(0,0,0,.16);

    transform:
        translateY(12px)
        scale(.94);

    transition:
        transform .25s cubic-bezier(.2,.8,.2,1);
}

.delete-overlay.show .delete-dialog{

    transform:
        translateY(0)
        scale(1);
}

.delete-icon{

    width:48px;
    height:48px;

    margin:
        0 auto 10px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#fff0f0;

    color:#c62828;

    font-size:22px;
}

.delete-title{

    font-weight:bold;

    color:#26332c;

    font-size:14px;
}

.delete-text{

    color:#7c8580;

    font-size:11px;

    line-height:1.7;

    margin-top:6px;
}

.delete-buttons{

    display:flex;

    gap:7px;

    margin-top:16px;
}

.delete-buttons button{

    flex:1;

    border:0;

    border-radius:9px;

    padding:9px;

    font-family:inherit;

    font-size:11px;

    cursor:pointer;

    transition:
        transform .16s ease,
        background .18s ease,
        opacity .18s ease;
}

.delete-buttons button:active{
    transform:scale(.91);
}

.cancel-delete{

    background:#eef3ef;

    color:#536058;
}

.cancel-delete:hover{
    background:#e4ebe6;
}

.confirm-delete{

    background:#c62828;

    color:#fff;
}

.confirm-delete:hover{
    background:#b51f1f;
}

.confirm-delete.loading{

    opacity:.6;

    pointer-events:none;
}


/* ================================
   TOAST
================================ */

.toast{

    position:fixed;

    left:50%;

    /*
       بالاتر از composer
    */
    bottom:76px;

    transform:
        translate(-50%,18px)
        scale(.96);

    background:#17251d;

    color:#fff;

    padding:10px 15px;

    border-radius:10px;

    font-size:11px;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .22s ease,
        transform .22s ease;

    z-index:3000;
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0)
        scale(1);
}


/* ================================
   MOBILE
================================ */

@media(max-width:550px){

    .comments-container{

        padding-left:8px;
        padding-right:8px;

        /*
           فضای کافی برای نوار پایین
        */
        padding-bottom:30px;
    }

    .message-wrap{
        max-width:90%;
    }

    .message-bubble{

        font-size:13px;

        padding:
            6px 10px;
    }

    .comment-composer{

        padding-left:8px;
        padding-right:8px;
    }

    .main-input{

        height:49px;

        font-size:13px;
    }

    .send-btn{

        height:49px;

        min-width:70px;
    }
}


/* ================================
   REDUCED MOTION
================================ */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;

        scroll-behavior:auto !important;
    }
}

</style>

</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header class="header">

    <div class="header-inner">

        <button
            class="back-btn"
            type="button"
            onclick="closeComments()"
        >
            ×
        </button>

        <div class="header-title">

            <strong>
                💬 نظرات
            </strong>

            <span id="commentSubtitle">
                نظرات محصول
            </span>

        </div>

    </div>

</header>


<!-- ================================
     PRODUCT
================================ -->

<section class="product-preview">

    <div
        id="productBox"
        class="product-box"
        style="display:none;"
    >

        <img
            id="productImage"
            src=""
            alt=""
        >

        <div class="product-box-info">

            <div
                id="productTitle"
                class="product-box-title"
            ></div>

            <div
                id="productPrice"
                class="product-box-price"
            ></div>

        </div>

    </div>

</section>


<!-- ================================
     COMMENTS
================================ -->

<main class="comments-container">

    <div
        id="loginState"
        class="login-state"
        style="display:none;"
    >

        برای نوشتن نظر ابتدا وارد حساب شوید.

        <br>

        <a href="login.html">
            ورود به حساب
        </a>

    </div>


    <div
        id="commentsList"
        class="comments-list"
    >

        <div class="state">
            ⏳ در حال دریافت نظرها...
        </div>

    </div>

</main>


<!-- ================================
     FIXED COMPOSER
================================ -->

<div class="comment-composer">

    <div class="composer-inner">

        <input
            id="mainInput"
            class="main-input"
            type="text"
            maxlength="1000"
            placeholder="نظر خود را بنویسید..."
        >

        <button
            id="sendButton"
            class="send-btn"
            type="button"
        >
            ارسال
        </button>

    </div>

</div>


<!-- ================================
     DELETE MODAL
================================ -->

<div
    id="deleteOverlay"
    class="delete-overlay"
>

    <div class="delete-dialog">

        <div class="delete-icon">
            🗑️
        </div>

        <div class="delete-title">
            حذف این نظر؟
        </div>

        <div class="delete-text">
            این نظر برای همیشه حذف می‌شود و قابل بازگردانی نیست.
        </div>

        <div class="delete-buttons">

            <button
                type="button"
                class="cancel-delete"
                onclick="closeDeleteModal()"
            >
                انصراف
            </button>

            <button
                id="confirmDeleteButton"
                type="button"
                class="confirm-delete"
                onclick="confirmDeleteComment()"
            >
                حذف نظر
            </button>

        </div>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
    "https://vhiewoopyqugdxwvsbno.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ================================
   ELEMENTS
================================ */

const commentsList =
    document.getElementById("commentsList");

const mainInput =
    document.getElementById("mainInput");

const sendButton =
    document.getElementById("sendButton");

const loginState =
    document.getElementById("loginState");

const toast =
    document.getElementById("toast");

const deleteOverlay =
    document.getElementById("deleteOverlay");

const confirmDeleteButton =
    document.getElementById("confirmDeleteButton");


/* ================================
   STATE
================================ */

let currentUser = null;

let productId = null;

let comments = [];

let profiles = {};

let commentLikes = {};

let commentToDelete = null;


/* ================================
   PRODUCT ID
================================ */

const params =
    new URLSearchParams(
        window.location.search
    );

productId =
    params.get("id") ||
    params.get("productId");


/* ================================
   START
================================ */

async function start(){

    if(!productId){

        commentsList.innerHTML = `
            <div class="state">
                ❌ شناسه محصول پیدا نشد.
            </div>
        `;

        return;
    }


    const {
        data:{
            session
        }
    } =
    await supabaseClient.auth.getSession();


    currentUser =
        session?.user || null;


    if(!currentUser){

        loginState.style.display =
            "block";
    }


    await loadProduct();

    await loadComments();
}

start();


/* ================================
   PRODUCT
================================ */

async function loadProduct(){

    const {
        data:product,
        error
    } =
    await supabaseClient

        .from("products")

        .select(
            "id,title,price,image_url,image_urls"
        )

        .eq(
            "id",
            productId
        )

        .maybeSingle();


    if(error){

        console.error(
            "Product error:",
            error
        );

        return;
    }


    if(!product){
        return;
    }


    const image =
        product.image_url ||
        (
            Array.isArray(product.image_urls) &&
            product.image_urls.length
                ? product.image_urls[0]
                : ""
        );


    document.getElementById(
        "productImage"
    ).src =
        image ||
        "https://via.placeholder.com/100x100?text=B";


    document.getElementById(
        "productTitle"
    ).textContent =
        product.title ||
        "محصول";


    document.getElementById(
        "productPrice"
    ).textContent =
        Number(
            product.price || 0
        ).toLocaleString() +
        " افغانی";


    document.getElementById(
        "productBox"
    ).style.display =
        "flex";


    document.getElementById(
        "commentSubtitle"
    ).textContent =
        product.title ||
        "نظرات محصول";
}


/* ================================
   LOAD COMMENTS
================================ */

async function loadComments(){

    commentsList.innerHTML = `
        <div class="state">
            ⏳ در حال دریافت نظرها...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient

        .from("product_comments")

        .select(`
            id,
            product_id,
            user_id,
            comment,
            parent_id,
            created_at
        `)

        .eq(
            "product_id",
            productId
        )

        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "Comments error:",
            error
        );

        commentsList.innerHTML = `
            <div class="state">
                ❌ دریافت نظرها انجام نشد.
            </div>
        `;

        return;
    }


    comments =
        data || [];


    await loadProfiles();

    await loadCommentLikes();

    renderComments();
}


/* ================================
   PROFILES
================================ */

async function loadProfiles(){

    const userIds =
        [
            ...new Set(
                comments.map(
                    item =>
                        item.user_id
                )
            )
        ];


    if(!userIds.length){
        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient

        .from("profiles")

        .select(
            "id,full_name,username,avatar_url"
        )

        .in(
            "id",
            userIds
        );


    if(error){

        console.error(
            "Profiles error:",
            error
        );

        return;
    }


    profiles = {};


    (data || []).forEach(
        function(profile){

            profiles[
                profile.id
            ] = profile;

        }
    );
}


/* ================================
   COMMENT LIKES
================================ */

async function loadCommentLikes(){

    commentLikes = {};


    if(!comments.length){
        return;
    }


    const commentIds =
        comments.map(
            item =>
                item.id
        );


    const {
        data,
        error
    } =
    await supabaseClient

        .from("comment_likes")

        .select(
            "comment_id,user_id"
        )

        .in(
            "comment_id",
            commentIds
        );


    if(error){

        console.error(
            "Comment likes error:",
            error
        );

        return;
    }


    (data || []).forEach(
        function(like){

            if(
                !commentLikes[
                    like.comment_id
                ]
            ){

                commentLikes[
                    like.comment_id
                ] = {
                    count:0,
                    liked:false
                };

            }


            commentLikes[
                like.comment_id
            ].count++;


            if(
                currentUser &&
                like.user_id ===
                    currentUser.id
            ){

                commentLikes[
                    like.comment_id
                ].liked = true;

            }

        }
    );
}


/* ================================
   RENDER COMMENTS
================================ */

function renderComments(){

    if(!comments.length){

        commentsList.innerHTML = `
            <div class="state">
                💬 هنوز نظری ثبت نشده است.
            </div>
        `;

        return;
    }


    const roots =
        comments.filter(
            item =>
                !item.parent_id
        );


    commentsList.innerHTML =
        roots
            .map(
                function(comment){

                    return renderComment(
                        comment,
                        false
                    );

                }
            )
            .join("");
}


/* ================================
   RENDER COMMENT
================================ */

function renderComment(
    comment,
    isReply
){

    const profile =
        profiles[
            comment.user_id
        ] || {};


    const name =
        profile.full_name ||
        profile.username ||
        "کاربر بازارک";


    const username =
        profile.username
            ? "@" + profile.username
            : "";


    const avatar =
        profile.avatar_url ||
        "https://ui-avatars.com/api/?name=User&background=087443&color=fff&size=100";


    const likeData =
        commentLikes[
            comment.id
        ] || {
            count:0,
            liked:false
        };


    const replies =
        comments.filter(
            item =>
                item.parent_id ===
                comment.id
        );


    const isOwner =
        currentUser &&
        currentUser.id ===
            comment.user_id;


    const alignmentClass =
        isOwner
            ? "mine"
            : "other";


    const safeCommentId =
        escapeAttribute(
            comment.id
        );


    const safeUserId =
        escapeAttribute(
            comment.user_id
        );


    return `

        <div
            class="${
                isReply
                    ? "reply-item"
                    : "comment-item " +
                      alignmentClass
            }"
            data-comment="${safeCommentId}"
        >

            <div class="message-wrap">

                <!-- USER -->

                <div
                    class="comment-header"
                    onclick="openUserProfile('${safeUserId}')"
                >

                    <img
                        class="comment-avatar"
                        src="${escapeAttribute(avatar)}"
                        alt=""
                    >

                    <div class="comment-user">

                        <div class="comment-user-name">
                            ${escapeHTML(name)}
                        </div>

                        <div class="comment-user-username">
                            ${escapeHTML(username)}
                        </div>

                    </div>

                </div>


                <!-- ONLY MESSAGE BACKGROUND -->

                <div class="message-bubble">
                    ${escapeHTML(comment.comment)}
                </div>


                <!-- ACTIONS OUTSIDE MESSAGE -->

                <div class="comment-actions">

                    <button
                        type="button"
                        class="comment-action ${
                            likeData.liked
                                ? "liked"
                                : ""
                        }"
                        onclick="toggleCommentLike('${safeCommentId}',this)"
                    >
                        ❤️
                        <span>
                            ${likeData.count || 0}
                        </span>
                    </button>


                    ${
                        !isReply
                        ? `
                            <button
                                type="button"
                                class="comment-action"
                                onclick="showReplyBox('${safeCommentId}')"
                            >
                                ↩️ پاسخ
                            </button>
                        `
                        : ""
                    }


                    ${
                        isOwner
                        ? `
                            <div class="more-wrapper">

                                <button
                                    type="button"
                                    class="more-button"
                                    onclick="toggleMoreMenu('${safeCommentId}',event)"
                                >
                                    ⋮
                                </button>

                                <div
                                    id="more-menu-${safeCommentId}"
                                    class="more-menu"
                                >

                                    <button
                                        type="button"
                                        onclick="openDeleteModal('${safeCommentId}',event)"
                                    >
                                        🗑️ حذف نظر
                                    </button>

                                </div>

                            </div>
                        `
                        : ""
                    }

                </div>


                <!-- REPLY BOX -->

                ${
                    !isReply
                    ? `
                        <div
                            class="reply-box"
                            id="reply-box-${safeCommentId}"
                        >

                            <div class="reply-form">

                                <input
                                    id="reply-input-${safeCommentId}"
                                    class="reply-input"
                                    type="text"
                                    maxlength="1000"
                                    placeholder="پاسخ خود را بنویسید..."
                                >

                                <button
                                    type="button"
                                    class="reply-send"
                                    onclick="sendReply('${safeCommentId}',this)"
                                >
                                    ارسال
                                </button>

                            </div>

                        </div>
                    `
                    : ""
                }


                <!-- REPLIES -->

                ${
                    replies.length
                    ? `
                        <div class="replies">

                            ${
                                replies
                                    .map(
                                        function(reply){

                                            return renderComment(
                                                reply,
                                                true
                                            );

                                        }
                                    )
                                    .join("")
                            }

                        </div>
                    `
                    : ""
                }

            </div>

        </div>

    `;
}


/* ================================
   PROFILE
================================ */

function openUserProfile(userId){

    if(!userId){
        return;
    }


    const url =
        "seller-profile.html?id=" +
        encodeURIComponent(
            userId
        );


    document.body.classList.add(
        "page-leaving"
    );


    setTimeout(
        function(){

            if(
                window.parent &&
                window.parent !== window
            ){

                window.parent.location.href =
                    url;

            }else{

                window.location.href =
                    url;
            }

        },
        220
    );
}


/* ================================
   THREE DOT MENU
================================ */

function toggleMoreMenu(
    commentId,
    event
){

    event.stopPropagation();


    document
        .querySelectorAll(
            ".more-menu.show"
        )
        .forEach(
            function(menu){

                if(
                    menu.id !==
                    "more-menu-" +
                    commentId
                ){

                    menu.classList.remove(
                        "show"
                    );

                }

            }
        );


    const menu =
        document.getElementById(
            "more-menu-" +
            commentId
        );


    if(!menu){
        return;
    }


    menu.classList.toggle(
        "show"
    );
}


document.addEventListener(
    "click",
    function(){

        document
            .querySelectorAll(
                ".more-menu.show"
            )
            .forEach(
                function(menu){

                    menu.classList.remove(
                        "show"
                    );

                }
            );

    }
);


/* ================================
   DELETE MODAL
================================ */

function openDeleteModal(
    commentId,
    event
){

    if(event){
        event.stopPropagation();
    }


    const comment =
        comments.find(
            item =>
                item.id ===
                commentId
        );


    if(!comment){
        return;
    }


    /*
       امنیت سمت کلاینت
    */

    if(
        !currentUser ||
        currentUser.id !==
            comment.user_id
    ){

        showToast(
            "شما اجازه حذف این نظر را ندارید."
        );

        return;
    }


    commentToDelete =
        commentId;


    document
        .querySelectorAll(
            ".more-menu.show"
        )
        .forEach(
            function(menu){

                menu.classList.remove(
                    "show"
                );

            }
        );


    deleteOverlay.classList.add(
        "show"
    );
}


function closeDeleteModal(){

    deleteOverlay.classList.remove(
        "show"
    );

    commentToDelete =
        null;
}


/* ================================
   CONFIRM DELETE
================================ */

async function confirmDeleteComment(){

    if(
        !commentToDelete ||
        !currentUser
    ){
        return;
    }


    const comment =
        comments.find(
            item =>
                item.id ===
                commentToDelete
        );


    if(
        !comment ||
        comment.user_id !==
            currentUser.id
    ){

        closeDeleteModal();

        showToast(
            "شما اجازه حذف این نظر را ندارید."
        );

        return;
    }


    confirmDeleteButton.classList.add(
        "loading"
    );

    confirmDeleteButton.textContent =
        "در حال حذف...";


    const deletingId =
        commentToDelete;


    const {
        error
    } =
    await supabaseClient

        .from("product_comments")

        .delete()

        .eq(
            "id",
            deletingId
        )

        .eq(
            "user_id",
            currentUser.id
        );


    if(error){

        console.error(
            "Delete comment error:",
            error
        );

        showToast(
            "❌ حذف کامنت انجام نشد."
        );

        confirmDeleteButton.classList.remove(
            "loading"
        );

        confirmDeleteButton.textContent =
            "حذف نظر";

        return;
    }


    closeDeleteModal();


    showToast(
        "کامنت حذف شد ✓"
    );


    await loadComments();


    sendParentMessage(
        "comment-deleted"
    );


    confirmDeleteButton.classList.remove(
        "loading"
    );

    confirmDeleteButton.textContent =
        "حذف نظر";
}


/* ================================
   REPLY BOX
================================ */

function showReplyBox(
    commentId
){

    if(!currentUser){

        showToast(
            "برای پاسخ دادن ابتدا وارد حساب شوید."
        );

        setTimeout(
            function(){

                navigateSmooth(
                    "login.html"
                );

            },
            600
        );

        return;
    }


    const box =
        document.getElementById(
            "reply-box-" +
            commentId
        );


    if(!box){
        return;
    }


    document
        .querySelectorAll(
            ".reply-box.show"
        )
        .forEach(
            function(item){

                if(item !== box){

                    item.classList.remove(
                        "show"
                    );

                }

            }
        );


    box.classList.toggle(
        "show"
    );


    if(
        box.classList.contains(
            "show"
        )
    ){

        const input =
            document.getElementById(
                "reply-input-" +
                commentId
            );


        if(input){

            setTimeout(
                function(){

                    input.focus();

                },
                100
            );
        }
    }
}


/* ================================
   SEND REPLY
================================ */

async function sendReply(
    parentId,
    button
){

    if(!currentUser){

        showToast(
            "برای پاسخ دادن ابتدا وارد حساب شوید."
        );

        return;
    }


    const input =
        document.getElementById(
            "reply-input-" +
            parentId
        );


    if(!input){
        return;
    }


    const text =
        input.value.trim();


    if(!text){

        showToast(
            "لطفاً متن پاسخ را بنویسید."
        );

        input.focus();

        return;
    }


    button.disabled =
        true;


    const originalText =
        button.textContent;


    button.textContent =
        "⌛";


    const {
        error
    } =
    await supabaseClient

        .from("product_comments")

        .insert({

            product_id:
                productId,

            user_id:
                currentUser.id,

            comment:
                text,

            parent_id:
                parentId

        });


    if(error){

        console.error(
            "Reply error:",
            error
        );

        showToast(
            "❌ ثبت پاسخ انجام نشد."
        );

        button.textContent =
            originalText;

        button.disabled =
            false;

        return;
    }


    input.value = "";


    showToast(
        "پاسخ شما ثبت شد ✓"
    );


    await loadComments();


    sendParentMessage(
        "comment-added"
    );
}


/* ================================
   SEND MAIN COMMENT
================================ */

async function sendComment(){

    if(!currentUser){

        showToast(
            "برای ثبت نظر ابتدا وارد حساب شوید."
        );

        setTimeout(
            function(){

                navigateSmooth(
                    "login.html"
                );

            },
            600
        );

        return;
    }


    const text =
        mainInput.value.trim();


    if(!text){

        showToast(
            "لطفاً متن نظر را بنویسید."
        );

        mainInput.focus();

        return;
    }


    sendButton.disabled =
        true;


    const originalText =
        sendButton.textContent;


    sendButton.textContent =
        "⌛";


    const {
        error
    } =
    await supabaseClient

        .from("product_comments")

        .insert({

            product_id:
                productId,

            user_id:
                currentUser.id,

            comment:
                text,

            parent_id:
                null
        });


    if(error){

        console.error(
            "Comment error:",
            error
        );

        showToast(
            "❌ ثبت نظر انجام نشد."
        );

        sendButton.textContent =
            originalText;

        sendButton.disabled =
            false;

        return;
    }


    mainInput.value = "";


    showToast(
        "نظر شما ثبت شد ✓"
    );


    await loadComments();


    sendParentMessage(
        "comment-added"
    );


    sendButton.textContent =
        originalText;

    sendButton.disabled =
        false;
}


/* ================================
   LIKE
================================ */

async function toggleCommentLike(
    commentId,
    button
){

    if(!currentUser){

        showToast(
            "برای لایک کردن ابتدا وارد حساب شوید."
        );

        return;
    }


    const existing =
        commentLikes[
            commentId
        ] || {

            count:0,

            liked:false
        };


    button.classList.add(
        "loading"
    );


    try{

        if(existing.liked){

            const {
                error
            } =
            await supabaseClient

                .from("comment_likes")

                .delete()

                .eq(
                    "comment_id",
                    commentId
                )

                .eq(
                    "user_id",
                    currentUser.id
                );


            if(error){
                throw error;
            }

        }else{

            const {
                error
            } =
            await supabaseClient

                .from("comment_likes")

                .insert({

                    comment_id:
                        commentId,

                    user_id:
                        currentUser.id
                });


            if(error){
                throw error;
            }

        }


        await loadComments();

    }catch(error){

        console.error(
            "Comment like error:",
            error
        );


        if(
            error.code ===
            "23505"
        ){

            await loadComments();

            return;
        }


        showToast(
            "❌ لایک کامنت انجام نشد."
        );

    }finally{

        button.classList.remove(
            "loading"
        );
    }
}


/* ================================
   CLOSE
================================ */

function closeComments(){

    document.body.classList.add(
        "page-leaving"
    );


    setTimeout(
        function(){

            if(
                window.parent &&
                window.parent !== window
            ){

                window.parent.postMessage(
                    {
                        type:
                            "close-comments"
                    },
                    "*"
                );

                return;
            }


            if(
                window.history.length > 1
            ){

                window.history.back();

            }else{

                window.location.href =
                    "products.html";
            }

        },
        220
    );
}


/* ================================
   PARENT MESSAGE
================================ */

function sendParentMessage(
    type
){

    if(
        window.parent &&
        window.parent !== window
    ){

        window.parent.postMessage(

            {
                type:
                    type,

                productId:
                    productId
            },

            "*"
        );
    }
}


/* ================================
   NAVIGATION
================================ */

function navigateSmooth(
    url
){

    document.body.classList.add(
        "page-leaving"
    );


    setTimeout(
        function(){

            window.location.href =
                url;

        },
        220
    );
}


/* ================================
   TOAST
================================ */

let toastTimer = null;

function showToast(
    message
){

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
}


/* ================================
   HELPERS
================================ */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}


function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );
}


/* ================================
   EVENTS
================================ */

sendButton.addEventListener(
    "click",
    sendComment
);


mainInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendComment();
        }

    }
);


deleteOverlay.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            deleteOverlay
        ){

            closeDeleteModal();
        }

    }
);


document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Escape"
        ){

            closeDeleteModal();
        }

    }
);

</script>
