<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#087a55">

<title>نظرات | بازارک</title>

<script>
(function () {
    try {
        document.documentElement.dataset.theme =
            localStorage.getItem("bazaarak-theme") === "dark"
                ? "dark"
                : "light";
    } catch (_) {
        document.documentElement.dataset.theme = "light";
    }
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --primary: #087a55;
    --primary-dark: #055c40;
    --primary-soft: #eaf7f1;
    --gold: #f2b84b;

    --bg: #f4f7f5;
    --surface: #ffffff;
    --surface-2: #f8faf9;

    --text: #17211d;
    --text-soft: #42514a;
    --muted: #718078;

    --border: #e1e8e4;

    --danger: #d94b4b;
    --success: #16865d;
    --warning: #b7791f;

    --shadow: 0 6px 24px rgba(0,0,0,.055);
    --shadow-strong: 0 18px 50px rgba(0,0,0,.16);
}

html[data-theme="dark"] {
    --primary: #21c982;
    --primary-dark: #0e9b61;
    --primary-soft: #12382a;
    --gold: #f5c761;

    --bg: #0b1210;
    --surface: #111b17;
    --surface-2: #16221d;

    --text: #f1f6f3;
    --text-soft: #c3d0ca;
    --muted: #91a39b;

    --border: #26362f;

    --danger: #ff7272;
    --success: #45d49a;
    --warning: #f2c36d;

    --shadow: 0 6px 24px rgba(0,0,0,.22);
    --shadow-strong: 0 18px 50px rgba(0,0,0,.42);
}

html[data-theme="light"] {
    color-scheme: light;
}

html[data-theme="dark"] {
    color-scheme: dark;
}

* {
    box-sizing: border-box;
}

html {
    background: var(--bg);
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--text);

    opacity: 1;
    transform: translateY(0);

    transition:
        background .2s ease,
        color .2s ease,
        opacity .24s ease,
        transform .24s ease;

    overscroll-behavior-y: contain;

    padding-bottom: 90px;
}

body.page-leaving {
    opacity: 0;
    transform: translateY(8px);
}

button,
input {
    -webkit-tap-highlight-color: transparent;
}

button {
    font-family: inherit;
}


/* =========================================
   HEADER
========================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 20;

    background:
        color-mix(
            in srgb,
            var(--surface) 94%,
            transparent
        );

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border-bottom: 1px solid var(--border);

    padding: 12px 16px;
}

.header-inner {
    max-width: 700px;
    margin: auto;

    display: flex;
    align-items: center;
    gap: 10px;
}

.back-btn {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border: none;
    border-radius: 50%;

    background: var(--primary-soft);
    color: var(--primary);

    font-size: 20px;
    line-height: 1;

    cursor: pointer;

    transition:
        transform .18s ease,
        background .18s ease,
        color .18s ease;
}

.back-btn:hover {
    background: var(--primary);
    color: #fff;
    transform: scale(1.05);
}

.back-btn:active {
    transform: scale(.86);
}

.header-title {
    flex: 1;
    min-width: 0;
}

.header-title strong {
    display: block;

    color: var(--primary);

    font-size: 16px;
    line-height: 1.4;
}

.header-title span {
    display: block;

    color: var(--muted);

    font-size: 11px;

    margin-top: 3px;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}


/* =========================================
   THEME BUTTON
========================================= */

.theme-btn {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border: 1px solid var(--border);
    border-radius: 50%;

    background: var(--surface-2);
    color: var(--text);

    font-size: 17px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
}

.theme-btn:hover {
    background: var(--primary-soft);
    border-color: var(--primary);
    transform: scale(1.05);
}

.theme-btn:active {
    transform: scale(.87);
}


/* =========================================
   PRODUCT PREVIEW
========================================= */

.product-preview {
    max-width: 700px;

    margin: 12px auto;

    padding: 0 14px;
}

.product-box {
    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: 13px;

    padding: 10px;

    box-shadow: var(--shadow);

    display: flex;
    align-items: center;

    gap: 10px;

    animation: productIn .3s ease both;
}

@keyframes productIn {

    from {
        opacity: 0;
        transform: translateY(-6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.product-box img {
    width: 56px;
    height: 56px;

    border-radius: 9px;

    object-fit: cover;

    background: var(--surface-2);

    border: 1px solid var(--border);

    flex-shrink: 0;
}

.product-box-info {
    min-width: 0;
}

.product-box-title {
    font-weight: bold;

    font-size: 13px;

    color: var(--text);

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.product-box-price {
    color: var(--primary);

    font-size: 12px;

    margin-top: 5px;

    font-weight: bold;
}


/* =========================================
   COMMENTS AREA
========================================= */

.comments-container {
    max-width: 700px;

    margin: auto;

    padding:
        3px
        14px
        150px;
}

.comments-list {
    display: flex;
    flex-direction: column;

    gap: 12px;
}


/* =========================================
   COMMENT
========================================= */

.comment-item {
    align-self: flex-start;

    width: fit-content;

    max-width: min(92%, 560px);

    min-width: 0;

    padding: 0;

    background: transparent;

    border: none;

    box-shadow: none;

    animation:
        commentIn .24s ease both;
}

@keyframes commentIn {

    from {
        opacity: 0;
        transform:
            translateY(7px)
            scale(.985);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================
   COMMENT CONTENT
========================================= */

.comment-content {
    width: fit-content;

    max-width: 100%;

    background: var(--primary-soft);

    border: 1px solid transparent;

    border-radius: 10px;

    padding: 7px 9px;

    transition:
        background .18s ease,
        transform .18s ease;
}

.comment-content:hover {
    background:
        color-mix(
            in srgb,
            var(--primary-soft) 88%,
            var(--primary)
        );
}

.comment-content:active {
    transform: scale(.995);
}


/* =========================================
   THREE DOT TOP BAR
========================================= */

.comment-topbar {
    width: 100%;

    min-height: 27px;

    display: flex;

    align-items: center;

    justify-content: flex-start;

    margin-bottom: 2px;
}

.more-wrapper {
    position: relative;

    flex-shrink: 0;
}

.more-button {
    width: 27px;
    height: 27px;

    border: none;

    background: transparent;

    color: var(--muted);

    border-radius: 50%;

    font-size: 17px;

    line-height: 1;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    transition:
        background .18s ease,
        color .18s ease,
        transform .16s ease;
}

.more-button:hover {
    background: var(--primary-soft);

    color: var(--primary);
}

.more-button:active {
    transform: scale(.8);
}

.more-menu {
    position: absolute;

    top: 30px;

    right: 0;

    min-width: 105px;

    background: var(--surface);

    border-radius: 9px;

    padding: 4px;

    box-shadow: var(--shadow-strong);

    border: 1px solid var(--border);

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(-5px)
        scale(.95);

    transform-origin: top right;

    transition:
        opacity .18s ease,
        transform .18s ease,
        visibility .18s ease;

    z-index: 50;
}

.more-menu.show {
    opacity: 1;

    visibility: visible;

    transform:
        translateY(0)
        scale(1);
}

.more-menu button {
    width: 100%;

    border: none;

    background: transparent;

    padding: 8px 9px;

    border-radius: 6px;

    text-align: right;

    font-family: inherit;

    font-size: 10px;

    color: var(--danger);

    cursor: pointer;

    transition:
        background .16s ease,
        transform .16s ease;
}

.more-menu button:hover {
    background:
        color-mix(
            in srgb,
            var(--danger) 10%,
            transparent
        );
}

.more-menu button:active {
    transform: scale(.94);
}


/* =========================================
   COMMENT HEADER
========================================= */

.comment-header {
    display: flex;

    align-items: center;

    gap: 7px;

    margin-bottom: 4px;
}

.comment-avatar {
    width: 29px;
    height: 29px;

    border-radius: 50%;

    object-fit: cover;

    background: var(--primary-soft);

    border: 1px solid var(--border);

    cursor: pointer;

    flex-shrink: 0;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.comment-avatar:hover {
    transform: scale(1.07);

    box-shadow:
        0 0 0 3px
        color-mix(
            in srgb,
            var(--primary) 18%,
            transparent
        );
}

.comment-avatar:active {
    transform: scale(.86);
}

.comment-user {
    cursor: pointer;

    min-width: 0;

    transition:
        opacity .18s ease,
        transform .18s ease;
}

.comment-user:hover {
    opacity: .72;
}

.comment-user:active {
    transform: translateX(-2px);
}

.comment-user-name {
    color: var(--primary);

    font-weight: bold;

    font-size: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.comment-user-username {
    color: var(--muted);

    font-size: 9px;

    margin-top: 1px;
}


/* =========================================
   COMMENT TEXT
========================================= */

.comment-text {
    color: var(--text-soft);

    font-size: 12.5px;

    line-height: 1.65;

    white-space: pre-wrap;

    overflow-wrap: anywhere;

    text-align: right;
}


/* =========================================
   ACTIONS
========================================= */

.comment-actions {
    display: flex;

    align-items: center;

    gap: 3px;

    margin-top: 4px;

    padding: 0;
}

.comment-action {
    border: none;

    background: transparent;

    color: var(--muted);

    font-family: inherit;

    font-size: 10px;

    padding: 3px 6px;

    border-radius: 6px;

    cursor: pointer;

    transition:
        background .18s ease,
        color .18s ease,
        transform .16s ease,
        opacity .18s ease;
}

.comment-action:hover {
    background: var(--primary-soft);

    color: var(--primary);
}

.comment-action:active {
    transform: scale(.82);
}

.comment-action.liked {
    color: var(--danger);

    background:
        color-mix(
            in srgb,
            var(--danger) 10%,
            transparent
        );
}

.comment-action.loading {
    opacity: .5;

    pointer-events: none;
}


/* =========================================
   REPLIES
========================================= */

.replies {
    margin-top: 7px;

    margin-right: 13px;

    padding-right: 7px;

    border-right: 2px solid var(--border);

    display: flex;

    flex-direction: column;

    gap: 7px;
}

.reply-item {
    width: fit-content;

    max-width: 94%;

    padding: 0;

    background: transparent;

    border: none;

    box-shadow: none;

    animation:
        replyIn .2s ease both;
}

.reply-content {
    width: fit-content;

    max-width: 100%;

    background: var(--surface-2);

    border: 1px solid var(--border);

    border-radius: 9px;

    padding: 6px 8px;
}

@keyframes replyIn {

    from {
        opacity: 0;
        transform:
            translateX(-6px)
            scale(.98);
    }

    to {
        opacity: 1;
        transform:
            translateX(0)
            scale(1);
    }
}

.reply-item .comment-header {
    margin-bottom: 3px;
}

.reply-item .comment-avatar {
    width: 26px;
    height: 26px;
}

.reply-item .comment-user-name {
    font-size: 10px;
}

.reply-item .comment-user-username {
    font-size: 8px;
}

.reply-item .comment-text {
    font-size: 12px;

    line-height: 1.6;
}

.reply-item .comment-actions {
    margin-top: 4px;
}


/* =========================================
   REPLY BOX
========================================= */

.reply-box {
    margin-top: 6px;

    display: none;

    animation:
        replyBoxIn .2s ease both;
}

.reply-box.show {
    display: block;
}

@keyframes replyBoxIn {

    from {
        opacity: 0;
        transform: translateY(-5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.reply-form {
    display: flex;

    align-items: center;

    gap: 5px;
}

.reply-input {
    flex: 1;

    min-width: 0;

    border: 1px solid var(--border);

    background: var(--surface);

    color: var(--text);

    border-radius: 8px;

    padding: 7px 9px;

    outline: none;

    font-family: inherit;

    font-size: 11px;

    transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

.reply-input::placeholder,
.main-input::placeholder {
    color: var(--muted);
}

.reply-input:focus {
    border-color: var(--primary);

    box-shadow:
        0 0 0 2px
        color-mix(
            in srgb,
            var(--primary) 10%,
            transparent
        );
}

.reply-send {
    border: none;

    background: var(--primary);

    color: white;

    border-radius: 8px;

    padding: 7px 10px;

    cursor: pointer;

    font-family: inherit;

    font-size: 11px;

    transition:
        transform .16s ease,
        background .18s ease,
        opacity .18s ease;
}

.reply-send:hover {
    background: var(--primary-dark);
}

.reply-send:active {
    transform: scale(.88);
}

.reply-send:disabled {
    opacity: .6;
    pointer-events: none;
}


/* =========================================
   FIXED BOTTOM INPUT
========================================= */

.comment-composer {
    position: fixed !important;

    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;

    top: auto !important;

    width: 100% !important;

    z-index: 99999 !important;

    background:
        color-mix(
            in srgb,
            var(--surface) 97%,
            transparent
        );

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border-top: 1px solid var(--border);

    padding: 10px 14px;

    padding-bottom:
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    margin: 0 !important;

    display: block !important;

    transform:
        translate3d(
            0,
            calc(
                var(--keyboard-offset, 0px) * -1
            ),
            0
        );

    transition:
        transform .16s ease,
        box-shadow .16s ease,
        background .2s ease;

    box-shadow:
        0 -5px 20px rgba(0,0,0,.035);

    will-change: transform;
}

@keyframes composerIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

.composer-inner {
    width: 100%;

    max-width: 700px;

    margin: 0 auto;

    display: flex;

    align-items: center;

    gap: 7px;
}

.main-input {
    flex: 1;

    min-width: 0;

    height: 44px;

    border: 1px solid var(--border);

    border-radius: 11px;

    padding: 0 12px;

    outline: none;

    font-family: inherit;

    font-size: 13px;

    background: var(--surface);

    color: var(--text);

    direction: rtl;

    text-align: right;

    transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

.main-input:focus {
    border-color: var(--primary);

    box-shadow:
        0 0 0 2px
        color-mix(
            in srgb,
            var(--primary) 10%,
            transparent
        );
}

.send-btn {
    border: none;

    background: var(--primary);

    color: white;

    border-radius: 11px;

    height: 44px;

    padding: 0 17px;

    flex-shrink: 0;

    cursor: pointer;

    font-family: inherit;

    font-weight: bold;

    font-size: 12px;

    transition:
        transform .16s ease,
        background .18s ease,
        opacity .18s ease;
}

.send-btn:hover {
    background: var(--primary-dark);
}

.send-btn:active {
    transform: scale(.91);
}

.send-btn:disabled {
    opacity: .65;

    pointer-events: none;
}


/* =========================================
   LOGIN / STATES
========================================= */

.state {
    text-align: center;

    color: var(--muted);

    padding: 45px 20px;

    font-size: 13px;

    animation:
        commentIn .25s ease both;
}

.login-state {
    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: 13px;

    padding: 18px;

    margin-bottom: 12px;

    text-align: center;

    color: var(--muted);

    font-size: 12px;

    animation:
        commentIn .25s ease both;
}

.login-state a {
    display: inline-block;

    margin-top: 9px;

    background: var(--primary);

    color: white;

    padding: 8px 13px;

    border-radius: 8px;

    text-decoration: none;

    font-size: 11px;

    transition:
        transform .16s ease,
        opacity .18s ease,
        background .18s ease;
}

.login-state a:hover {
    background: var(--primary-dark);
}

.login-state a:active {
    transform: scale(.94);
}


/* =========================================
   DELETE MODAL
========================================= */

.delete-overlay {
    position: fixed;

    inset: 0;

    z-index: 200;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(10,25,17,.35);

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .22s ease,
        visibility .22s ease;
}

.delete-overlay.show {
    opacity: 1;

    visibility: visible;
}

.delete-dialog {
    width: min(330px, 100%);

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 20px;

    text-align: center;

    box-shadow: var(--shadow-strong);

    transform:
        translateY(12px)
        scale(.94);

    transition:
        transform .25s cubic-bezier(.2,.8,.2,1);
}

.delete-overlay.show
.delete-dialog {
    transform:
        translateY(0)
        scale(1);
}

.delete-icon {
    width: 48px;
    height: 48px;

    margin: 0 auto 10px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        color-mix(
            in srgb,
            var(--danger) 10%,
            transparent
        );

    color: var(--danger);

    font-size: 22px;
}

.delete-title {
    font-weight: bold;

    color: var(--text);

    font-size: 14px;
}

.delete-text {
    color: var(--muted);

    font-size: 11px;

    line-height: 1.7;

    margin-top: 6px;
}

.delete-buttons {
    display: flex;

    gap: 7px;

    margin-top: 16px;
}

.delete-buttons button {
    flex: 1;

    border: none;

    border-radius: 9px;

    padding: 9px;

    font-family: inherit;

    font-size: 11px;

    cursor: pointer;

    transition:
        transform .16s ease,
        background .18s ease,
        opacity .18s ease;
}

.delete-buttons button:active {
    transform: scale(.91);
}

.cancel-delete {
    background: var(--surface-2);

    color: var(--text-soft);

    border: 1px solid var(--border) !important;
}

.cancel-delete:hover {
    background: var(--primary-soft);
}

.confirm-delete {
    background: var(--danger);

    color: white;
}

.confirm-delete:hover {
    opacity: .9;
}

.confirm-delete.loading {
    opacity: .6;

    pointer-events: none;
}


/* =========================================
   TOAST
========================================= */

.toast {
    position: fixed;

    left: 50%;

    bottom: 78px;

    transform:
        translate(-50%, 18px)
        scale(.96);

    background: var(--text);

    color: var(--surface);

    padding: 9px 14px;

    border-radius: 9px;

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .22s ease,
        transform .22s ease;

    z-index: 300;

    max-width: calc(100% - 30px);

    text-align: center;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0)
        scale(1);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 550px) {

    .header {
        padding-left: 9px;
        padding-right: 9px;
    }

    .header-inner {
        gap: 7px;
    }

    .header-title strong {
        font-size: 15px;
    }

    .comment-item {
        max-width: 96%;
    }

    .comments-container {
        padding-left: 9px;
        padding-right: 9px;
        padding-bottom: 150px;
    }

    .comment-text {
        font-size: 12px;
    }

    .comment-composer {
        padding-left: 9px;
        padding-right: 9px;

        padding-bottom:
            calc(
                9px +
                env(safe-area-inset-bottom)
            );
    }

    .main-input {
        height: 46px;
        font-size: 13px;
    }

    .send-btn {
        height: 46px;

        padding-left: 15px;
        padding-right: 15px;
    }

    .theme-btn,

}

</main>

            </button>

    id="toast"
    class="toast"
></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://vhiewoopyqugdxwvsbno.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================
   THEME
========================================= */

const THEME_KEY =
    "bazaarak-theme";

const themeButton =
    document.getElementById(
        "themeButton"
    );

const themeColor =
    document.querySelector(
        'meta[name="theme-color"]'
    );


function getTheme() {

    try {

        return localStorage.getItem(
            THEME_KEY
        ) === "dark"
            ? "dark"
            : "light";

    } catch (_) {

        return document.documentElement.dataset.theme === "dark"
            ? "dark"
            : "light";
    }
}


function applyTheme(
    theme,
    persist = true
) {

    const nextTheme =
        theme === "dark"
            ? "dark"
            : "light";


    document.documentElement.dataset.theme =
        nextTheme;


    if (persist) {

        try {

            localStorage.setItem(
                THEME_KEY,
                nextTheme
            );

        } catch (_) {}
    }


    if (themeButton) {

        themeButton.textContent =
            nextTheme === "dark"
                ? "☀️"
                : "🌙";

        themeButton.title =
            nextTheme === "dark"
                ? "حالت روشن"
                : "حالت تاریک";

        themeButton.setAttribute(
            "aria-label",
            themeButton.title
        );
    }


    if (themeColor) {

        themeColor.setAttribute(
            "content",
            nextTheme === "dark"
                ? "#0b1210"
                : "#087a55"
        );
    }
}


applyTheme(
    getTheme(),
    false
);


themeButton.addEventListener(
    "click",
    function () {

        applyTheme(
            getTheme() === "dark"
                ? "light"
                : "dark"
        );

    }
);


/* =========================================
   ELEMENTS
========================================= */

const commentsList =
    document.getElementById(
        "commentsList"
    );

const mainInput =
    document.getElementById(
        "mainInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const loginState =
    document.getElementById(
        "loginState"
    );

const toast =
    document.getElementById(
        "toast"
    );

const deleteOverlay =
    document.getElementById(
        "deleteOverlay"
    );

const confirmDeleteButton =
    document.getElementById(
        "confirmDeleteButton"
    );

const commentComposer =
    document.querySelector(
        ".comment-composer"
    );


/* =========================================
   STATE
========================================= */

let currentUser = null;

let productId = null;

let comments = [];

let profiles = {};

let commentLikes = {};

let commentToDelete = null;


/* =========================================
   PRODUCT ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

productId =
    params.get("id") ||
    params.get("productId");


/* =========================================
   KEYBOARD / MOBILE VIEWPORT
========================================= */

function updateKeyboardPosition() {

    if (!commentComposer) {
        return;
    }

    if (!window.visualViewport) {

        commentComposer.style.setProperty(
            "--keyboard-offset",
            "0px"
        );

        return;
    }

    const viewport =
        window.visualViewport;

    const keyboardHeight =
        Math.max(
            0,
            window.innerHeight -
            viewport.height -
            viewport.offsetTop
        );

    commentComposer.style.setProperty(
        "--keyboard-offset",
        `${keyboardHeight}px`
    );
}


if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        updateKeyboardPosition
    );

    window.visualViewport.addEventListener(
        "scroll",
        updateKeyboardPosition
    );
}


window.addEventListener(
    "resize",
    updateKeyboardPosition
);


mainInput.addEventListener(
    "focus",
    function () {

        setTimeout(
            updateKeyboardPosition,
            100
        );

    }
);


mainInput.addEventListener(
    "blur",
    function () {

        setTimeout(
            function () {

                commentComposer.style.setProperty(
                    "--keyboard-offset",
                    "0px"
                );

                updateKeyboardPosition();

            },
            150
        );

    }
);


updateKeyboardPosition();


/* =========================================
   START
========================================= */

async function start() {

    if (!productId) {

        commentsList.innerHTML = `
            <div class="state">
                ❌ شناسه محصول پیدا نشد.
            </div>
        `;

        commentComposer.style.display =
            "none";

        return;
    }


    try {

        const {
            data: {
                session
            }
        } =
        await supabaseClient.auth.getSession();


        currentUser =
            session?.user || null;

    } catch (error) {

        console.error(
            "Session error:",
            error
        );

        currentUser = null;
    }


    if (!currentUser) {

        loginState.style.display =
            "block";
    }


    await Promise.all([
        loadProduct(),
        loadComments()
    ]);
}


start();


/* =========================================
   PRODUCT
========================================= */

async function loadProduct() {

    const {
        data: product,
        error
    } = await supabaseClient

        .from("products")

        .select(
            "id,title,price,image_url,image_urls"
        )

        .eq(
            "id",
            productId
        )

        .maybeSingle();


    if (error) {

        console.error(
            "Product error:",
            error
        );

        return;
    }


    if (!product) {
        return;
    }


    let image = "";


    if (
        product.image_url &&
        typeof product.image_url === "string"
    ) {

        image =
            product.image_url;
    }


    if (
        !image &&
        Array.isArray(
            product.image_urls
        ) &&
        product.image_urls.length
    ) {

        image =
            product.image_urls[0] || "";
    }


    const productImage =
        document.getElementById(
            "productImage"
        );


    productImage.src =
        image ||
        "https://via.placeholder.com/100x100?text=B";


    productImage.onerror =
        function () {

            this.onerror = null;

            this.src =
                "https://via.placeholder.com/100x100?text=B";
        };


    document.getElementById(
        "productTitle"
    ).textContent =
        product.title ||
        "محصول";


    document.getElementById(
        "productPrice"
    ).textContent =
        Number(
            product.price || 0
        ).toLocaleString("fa-AF") +
        " افغانی";


    document.getElementById(
        "productBox"
    ).style.display =
        "flex";


    document.getElementById(
        "commentSubtitle"
    ).textContent =
        product.title ||
        "نظرات محصول";
}


/* =========================================
   LOAD COMMENTS
========================================= */

async function loadComments() {

    commentsList.innerHTML = `
        <div class="state">
            ⏳ در حال دریافت نظرها...
        </div>
    `;


    const {
        data,
        error
    } = await supabaseClient

        .from("product_comments")

        .select(`
            id,
            product_id,
            user_id,
            comment,
            parent_id,
            created_at
        `)

        .eq(
            "product_id",
            productId
        )

        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Comments error:",
            error
        );

        commentsList.innerHTML = `
            <div class="state">
                ❌ دریافت نظرها انجام نشد.
                <br>
                <small style="opacity:.7">
                    ${escapeHTML(error.message || "")}
                </small>
            </div>
        `;

        return;
    }


    comments =
        Array.isArray(data)
            ? data
            : [];


    profiles = {};

    commentLikes = {};


    await loadProfiles();

    await loadCommentLikes();

    renderComments();
}


/* =========================================
   LOAD PROFILES
========================================= */

async function loadProfiles() {

    const userIds =
        [
            ...new Set(
                comments
                    .map(
                        item =>
                            item.user_id
                    )
                    .filter(Boolean)
            )
        ];


    if (!userIds.length) {
        return;
    }


    const {
        data,
        error
    } = await supabaseClient

        .from("profiles")

        .select(
            "id,full_name,username,avatar_url"
        )

        .in(
            "id",
            userIds
        );


    if (error) {

        console.error(
            "Profiles error:",
            error
        );

        return;
    }


    (data || []).forEach(
        function (profile) {

            profiles[
                profile.id
            ] = profile;
        }
    );
}


/* =========================================
   LOAD COMMENT LIKES
========================================= */

async function loadCommentLikes() {

    commentLikes = {};


    if (!comments.length) {
        return;
    }


    const commentIds =
        comments
            .map(
                item =>
                    item.id
            )
            .filter(Boolean);


    if (!commentIds.length) {
        return;
    }


    const {
        data,
        error
    } = await supabaseClient

        .from("comment_likes")

        .select(
            "comment_id,user_id"
        )

        .in(
            "comment_id",
            commentIds
        );


    if (error) {

        console.error(
            "Comment likes error:",
            error
        );

        return;
    }


    (data || []).forEach(
        function (like) {

            if (
                !commentLikes[
                    like.comment_id
                ]
            ) {

                commentLikes[
                    like.comment_id
                ] = {

                    count: 0,

                    liked: false
                };
            }


            commentLikes[
                like.comment_id
            ].count++;


            if (
                currentUser &&
                like.user_id ===
                    currentUser.id
            ) {

                commentLikes[
                    like.comment_id
                ].liked = true;
            }
        }
    );
}


/* =========================================
   RENDER COMMENTS
========================================= */

function renderComments() {

    if (!comments.length) {

        commentsList.innerHTML = `
            <div class="state">
                💬 هنوز نظری ثبت نشده است.
            </div>
        `;

        return;
    }


    const roots =
        comments.filter(
            item =>
                !item.parent_id
        );


    commentsList.innerHTML =
        roots
            .map(
                function (comment) {

                    return renderComment(
                        comment,
                        false
                    );
                }
            )
            .join("");
}


/* =========================================
   RENDER COMMENT
========================================= */

function renderComment(
    comment,
    isReply
) {

    const profile =
        profiles[
            comment.user_id
        ] || {};


    const name =
        profile.full_name ||
        profile.username ||
        "کاربر بازارک";


    const username =
        profile.username
            ? "@" +
              profile.username
            : "";


    const avatar =
        profile.avatar_url ||
        "https://ui-avatars.com/api/?name=User&background=087443&color=fff&size=100";


    const likeData =
        commentLikes[
            comment.id
        ] || {

            count: 0,

            liked: false
        };


    const replies =
        comments.filter(
            item =>
                item.parent_id ===
                comment.id
        );


    const isOwner =
        currentUser &&
        currentUser.id ===
        comment.user_id;


    const safeCommentId =
        escapeAttribute(
            comment.id
        );


    const safeUserId =
        escapeAttribute(
            comment.user_id
        );


    return `

        <div
            class="${
                isReply
                    ? "reply-item"
                    : "comment-item"
            }"
            data-comment="${safeCommentId}"
        >

            <div class="comment-content">

                ${
                    isOwner
                    ? `

                        <div class="comment-topbar">

                            <div class="more-wrapper">

                                <button
                                    type="button"
                                    class="more-button"
                                    onclick="toggleMoreMenu('${safeCommentId}', event)"
                                    aria-label="بیشتر"
                                >
                                    ⋮
                                </button>

                                <div
                                    id="more-menu-${safeCommentId}"
                                    class="more-menu"
                                >

                                    <button
                                        type="button"
                                        onclick="openDeleteModal('${safeCommentId}', event)"
                                    >
                                        🗑️ حذف نظر
                                    </button>

                                </div>

                            </div>

                        </div>

                    `
                    : ""
                }


                <div class="comment-header">

                    <img
                        class="comment-avatar"
                        src="${escapeAttribute(avatar)}"
                        alt=""
                        loading="lazy"
                        onclick="openUserProfile('${safeUserId}')"
                    >

                    <div
                        class="comment-user"
                        onclick="openUserProfile('${safeUserId}')"
                    >

                        <div class="comment-user-name">
                            ${escapeHTML(name)}
                        </div>

                        <div class="comment-user-username">
                            ${escapeHTML(username)}
                        </div>

                    </div>

                </div>


                <div class="comment-text">
                    ${escapeHTML(comment.comment)}
                </div>


                <div class="comment-actions">

                    <button
                        type="button"
                        class="comment-action ${
                            likeData.liked
                                ? "liked"
                                : ""
                        }"
                        onclick="toggleCommentLike('${safeCommentId}', this)"
                    >
                        ❤️
                        <span>
                            ${likeData.count || 0}
                        </span>
                    </button>


                    ${
                        !isReply
                        ? `
                            <button
                                type="button"
                                class="comment-action"
                                onclick="showReplyBox('${safeCommentId}')"
                            >
                                ↩️ پاسخ
                            </button>
                        `
                        : ""
                    }

                </div>

            </div>


            ${
                !isReply
                ? `

                    <div
                        class="reply-box"
                        id="reply-box-${safeCommentId}"
                    >

                        <div class="reply-form">

                            <input
                                id="reply-input-${safeCommentId}"
                                class="reply-input"
                                type="text"
                                maxlength="1000"
                                placeholder="پاسخ خود را بنویسید..."
                                autocomplete="off"
                            >

                            <button
                                type="button"
                                class="reply-send"
                                onclick="sendReply('${safeCommentId}', this)"
                            >
                                ارسال
                            </button>

                        </div>

                    </div>

                `
                : ""
            }


            ${
                replies.length
                ? `

                    <div class="replies">

                        ${replies
                            .map(
                                function (reply) {

                                    return renderComment(
                                        reply,
                                        true
                                    );

                                }
                            )
                            .join("")}

                    </div>

                `
                : ""
            }

        </div>

    `;
}


/* =========================================
   USER PROFILE
========================================= */

function openUserProfile(
    userId
) {

    if (!userId) {
        return;
    }


    const url =
        "seller-profile.html?id=" +
        encodeURIComponent(
            userId
        );


    document.body.classList.add(
        "page-leaving"
    );


    setTimeout(
        function () {

            if (
                window.parent &&
                window.parent !== window
            ) {

                window.parent.location.href =
                    url;

            } else {

                window.location.href =
                    url;
            }

        },
        220
    );
}


/* =========================================
   THREE DOT MENU
========================================= */

function toggleMoreMenu(
    commentId,
    event
) {

    if (event) {
        event.stopPropagation();
    }


    document
        .querySelectorAll(
            ".more-menu.show"
        )
        .forEach(
            function (menu) {

                if (
                    menu.id !==
                    "more-menu-" +
                    commentId
                ) {

                    menu.classList.remove(
                        "show"
                    );
                }
            }
        );


    const menu =
        document.getElementById(
            "more-menu-" +
            commentId
        );


    if (!menu) {
        return;
    }


    menu.classList.toggle(
        "show"
    );
}


document.addEventListener(
    "click",
    function () {

        document
            .querySelectorAll(
                ".more-menu.show"
            )
            .forEach(
                function (menu) {

                    menu.classList.remove(
                        "show"
                    );

                }
            );
    }
);


/* =========================================
   OPEN DELETE MODAL
========================================= */

function openDeleteModal(
    commentId,
    event
) {

    if (event) {
        event.stopPropagation();
    }


    const comment =
        comments.find(
            item =>
                String(item.id) ===
                String(commentId)
        );


    if (!comment) {
        return;
    }


    if (
        !currentUser ||
        currentUser.id !==
            comment.user_id
    ) {

        showToast(
            "شما اجازه حذف این نظر را ندارید."
        );

        return;
    }


    commentToDelete =
        commentId;


    document
        .querySelectorAll(
            ".more-menu.show"
        )
        .forEach(
            function (menu) {

                menu.classList.remove(
                    "show"
                );

            }
        );


    deleteOverlay.classList.add(
        "show"
    );
}


/* =========================================
   CLOSE DELETE MODAL
========================================= */

function closeDeleteModal() {

    deleteOverlay.classList.remove(
        "show"
    );

    commentToDelete =
        null;
}


/* =========================================
   DELETE COMMENT
========================================= */

async function confirmDeleteComment() {

    if (
        !commentToDelete ||
        !currentUser
    ) {
        return;
    }


    const comment =
        comments.find(
            item =>
                String(item.id) ===
                String(commentToDelete)
        );


    if (!comment) {

        closeDeleteModal();

        return;
    }


    if (
        comment.user_id !==
        currentUser.id
    ) {

        showToast(
            "شما اجازه حذف این نظر را ندارید."
        );

        closeDeleteModal();

        return;
    }


    confirmDeleteButton.classList.add(
        "loading"
    );

    confirmDeleteButton.textContent =
        "در حال حذف...";


    try {

        const childIds =
            comments
                .filter(
                    item =>
                        String(
                            item.parent_id
                        ) ===
                        String(comment.id)
                )
                .map(
                    item =>
                        item.id
                );


        if (childIds.length) {

            await supabaseClient
                .from("comment_likes")
                .delete()
                .in(
                    "comment_id",
                    childIds
                );


            const {
                error: childDeleteError
            } =
            await supabaseClient
                .from("product_comments")
                .delete()
                .in(
                    "id",
                    childIds
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


            if (childDeleteError) {

                console.warn(
                    "Child comments delete:",
                    childDeleteError
                );
            }
        }


        await supabaseClient
            .from("comment_likes")
            .delete()
            .eq(
                "comment_id",
                comment.id
            );


        const {
            error
        } =
        await supabaseClient

            .from("product_comments")

            .delete()

            .eq(
                "id",
                comment.id
            )

            .eq(
                "user_id",
                currentUser.id
            );


        if (error) {
            throw error;
        }


        closeDeleteModal();


        showToast(
            "کامنت حذف شد ✓"
        );


        await loadComments();


        sendParentMessage(
            "comment-deleted"
        );

    } catch (error) {

        console.error(
            "Delete comment error:",
            error
        );


        showToast(
            "❌ حذف کامنت انجام نشد."
        );

    } finally {

        confirmDeleteButton.classList.remove(
            "loading"
        );

        confirmDeleteButton.textContent =
            "حذف نظر";
    }
}


/* =========================================
   SHOW REPLY BOX
========================================= */

function showReplyBox(
    commentId
) {

    if (!currentUser) {

        showToast(
            "برای پاسخ دادن ابتدا وارد حساب شوید."
        );

        setTimeout(
            function () {

                navigateSmooth(
                    "login.html"
                );

            },
            600
        );

        return;
    }


    const box =
        document.getElementById(
            "reply-box-" +
            commentId
        );


    if (!box) {
        return;
    }


    document
        .querySelectorAll(
            ".reply-box.show"
        )
        .forEach(
            function (item) {

                if (item !== box) {

                    item.classList.remove(
                        "show"
                    );

                }

            }
        );


    box.classList.toggle(
        "show"
    );


    if (
        box.classList.contains(
            "show"
        )
    ) {

        const input =
            document.getElementById(
                "reply-input-" +
                commentId
            );


        if (input) {

            setTimeout(
                function () {

                    input.focus();

                },
                100
            );
        }
    }
}


/* =========================================
   SEND REPLY
========================================= */

async function sendReply(
    parentId,
    button
) {

    if (!currentUser) {

        showToast(
            "برای پاسخ دادن ابتدا وارد حساب شوید."
        );

        return;
    }


    const input =
        document.getElementById(
            "reply-input-" +
            parentId
        );


    if (!input) {
        return;
    }


    const text =
        input.value.trim();


    if (!text) {

        showToast(
            "لطفاً متن پاسخ را بنویسید."
        );

        input.focus();

        return;
    }


    button.disabled =
        true;


    const originalText =
        button.textContent;

    button.textContent =
        "⌛";


    try {

        const {
            error
        } =
        await supabaseClient

            .from("product_comments")

            .insert({

                product_id:
                    productId,

                user_id:
                    currentUser.id,

                comment:
                    text,

                parent_id:
                    parentId
            });


        if (error) {
            throw error;
        }


        input.value = "";


        showToast(
            "پاسخ شما ثبت شد ✓"
        );


        await loadComments();


        sendParentMessage(
            "comment-added"
        );

    } catch (error) {

        console.error(
            "Reply error:",
            error
        );


        showToast(
            "❌ ثبت پاسخ انجام نشد."
        );

    } finally {

        button.textContent =
            originalText;

        button.disabled =
            false;
    }
}


/* =========================================
   MAIN COMMENT
========================================= */

async function sendComment() {

    if (!currentUser) {

        showToast(
            "برای ثبت نظر ابتدا وارد حساب شوید."
        );

        setTimeout(
            function () {

                navigateSmooth(
                    "login.html"
                );

            },
            600
        );

        return;
    }


    const text =
        mainInput.value.trim();


    if (!text) {

        showToast(
            "لطفاً متن نظر را بنویسید."
        );

        mainInput.focus();

        return;
    }


    sendButton.disabled =
        true;


    const originalText =
        sendButton.textContent;


    sendButton.textContent =
        "⌛";


    try {

        const {
            error
        } =
        await supabaseClient

            .from("product_comments")

            .insert({

                product_id:
                    productId,

                user_id:
                    currentUser.id,

                comment:
                    text,

                parent_id:
                    null
            });


        if (error) {
            throw error;
        }


        mainInput.value = "";

        mainInput.blur();


        commentComposer.style.setProperty(
            "--keyboard-offset",
            "0px"
        );


        showToast(
            "نظر شما ثبت شد ✓"
        );


        await loadComments();


        sendParentMessage(
            "comment-added"
        );

    } catch (error) {

        console.error(
            "Comment error:",
            error
        );


        showToast(
            "❌ ثبت نظر انجام نشد."
        );

    } finally {

        sendButton.textContent =
            originalText;

        sendButton.disabled =
            false;


        setTimeout(
            function () {

                updateKeyboardPosition();

                commentComposer.style.setProperty(
                    "--keyboard-offset",
                    "0px"
                );

            },
            250
        );
    }
}


/* =========================================
   LIKE
========================================= */

async function toggleCommentLike(
    commentId,
    button
) {

    if (!currentUser) {

        showToast(
            "برای لایک کردن ابتدا وارد حساب شوید."
        );

        return;
    }


    const existing =
        commentLikes[
            commentId
        ] || {

            count: 0,

            liked: false
        };


    button.classList.add(
        "loading"
    );


    try {

        if (
            existing.liked
        ) {

            const {
                error
            } =
            await supabaseClient

                .from("comment_likes")

                .delete()

                .eq(
                    "comment_id",
                    commentId
                )

                .eq(
                    "user_id",
                    currentUser.id
                );


            if (error) {
                throw error;
            }

        } else {

            const {
                error
            } =
            await supabaseClient

                .from("comment_likes")

                .insert({

                    comment_id:
                        commentId,

                    user_id:
                        currentUser.id
                });


            if (error) {

                if (
                    error.code ===
                    "23505"
                ) {

                    await loadComments();

                    return;
                }

                throw error;
            }
        }


        await loadComments();

    } catch (error) {

        console.error(
            "Comment like error:",
            error
        );


        showToast(
            "❌ لایک کامنت انجام نشد."
        );

    } finally {

        button.classList.remove(
            "loading"
        );
    }
}


/* =========================================
   CLOSE COMMENTS
========================================= */

function closeComments() {

    document.body.classList.add(
        "page-leaving"
    );


    setTimeout(
        function () {

            if (
                window.parent &&
                window.parent !== window
            ) {

                window.parent.postMessage(
                    {
                        type:
                            "close-comments"
                    },
                    "*"
                );

                return;
            }


            if (
                window.history.length > 1
            ) {

                window.history.back();

            } else {

                window.location.href =
                    "products.html";
            }

        },
        220
    );
}


/* =========================================
   PARENT MESSAGE
========================================= */

function sendParentMessage(
    type
) {

    if (
        window.parent &&
        window.parent !== window
    ) {

        window.parent.postMessage(

            {
                type:
                    type,

                productId:
                    productId
            },

            "*"
        );
    }
}


/* =========================================
   SMOOTH NAVIGATION
========================================= */

function navigateSmooth(
    url
) {

    document.body.classList.add(
        "page-leaving"
    );


    setTimeout(
        function () {

            window.location.href =
                url;

        },
        220
    );
}


/* =========================================
   TOAST
========================================= */

let toastTimer = null;

function showToast(
    message
) {

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function () {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
}


/* =========================================
   HELPERS
========================================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );
}


/* =========================================
   SEND
========================================= */

sendButton.addEventListener(
    "click",
    sendComment
);


mainInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendComment();
        }

    }
);


/* =========================================
   REPLY ENTER
========================================= */

document.addEventListener(
    "keydown",
    function (event) {

        const target =
            event.target;


        if (
            target &&
            target.classList &&
            target.classList.contains(
                "reply-input"
            ) &&
            event.key === "Enter"
        ) {

            event.preventDefault();


            const id =
                target.id.replace(
                    "reply-input-",
                    ""
                );


            const button =
                document.querySelector(
                    `[onclick="sendReply('${escapeAttribute(id)}', this)"]`
                );


            if (button) {
                sendReply(id, button);
            }
        }

    }
);


/* =========================================
   DELETE MODAL BACKDROP
========================================= */

deleteOverlay.addEventListener(
    "click",
    function (event) {

        if (
            event.target ===
            deleteOverlay
        ) {

            closeDeleteModal();
        }

    }
);


/* =========================================
   ESC
========================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeDeleteModal();

        }

    }
);


/* =========================================
   STORAGE THEME SYNC
========================================= */

window.addEventListener(
    "storage",
    function (event) {

        if (
            event.key ===
            THEME_KEY
        ) {

            applyTheme(
                event.newValue === "dark"
                    ? "dark"
                    : "light",
                false
            );
        }

    }
);

</script>
