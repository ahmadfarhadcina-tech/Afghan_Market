<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>نظرات محصول | بازارک</title>

    <meta
        name="description"
        content="نظرات کاربران درباره محصول در بازارک"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background: #f7f9f8;

            color: #18211d;

            min-height: 100vh;

            overflow-x: hidden;

        }


        button,
        textarea {

            font-family: inherit;

        }


        button {

            -webkit-tap-highlight-color:
                transparent;

        }


        /* =================================
           MAIN APP
        ================================= */

        .comments-app {

            width: 100%;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            background: #ffffff;

        }


        /* =================================
           HEADER
        ================================= */

        .top-header {

            position: sticky;

            top: 0;

            z-index: 20;

            background:
                rgba(255,255,255,.96);

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);

            border-bottom:
                1px solid #e7ece9;

        }


        .header-main {

            min-height: 68px;

            padding:
                12px 18px;

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .close-button {

            width: 40px;

            height: 40px;

            border: none;

            border-radius: 50%;

            background: #f1f4f2;

            color: #39443f;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            cursor: pointer;

            transition:
                transform .18s ease,
                background .18s ease;

            flex-shrink: 0;

        }


        .close-button:hover {

            background: #e7ece9;

        }


        .close-button:active {

            transform:
                scale(.88);

        }


        .header-title {

            flex: 1;

            min-width: 0;

        }


        .header-title h1 {

            font-size: 17px;

            font-weight: 900;

            margin-bottom: 4px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .header-title p {

            color: #78827e;

            font-size: 11px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .comment-count-top {

            background: #eef8f4;

            color: #087a55;

            border:
                1px solid #d7eee4;

            padding:
                7px 10px;

            border-radius: 10px;

            font-size: 11px;

            font-weight: 900;

            white-space: nowrap;

        }


        /* =================================
           PRODUCT MINI INFO
        ================================= */

        .product-mini {

            display: none;

            padding:
                10px 18px;

            background: #fbfcfb;

            border-bottom:
                1px solid #edf1ef;

        }


        .product-mini-inner {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .product-mini-image {

            width: 45px;

            height: 45px;

            border-radius: 10px;

            object-fit: cover;

            background: #edf1ef;

            flex-shrink: 0;

        }


        .product-mini-placeholder {

            width: 45px;

            height: 45px;

            border-radius: 10px;

            background: #edf1ef;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            flex-shrink: 0;

        }


        .product-mini-text {

            min-width: 0;

        }


        .product-mini-text strong {

            display: block;

            font-size: 13px;

            margin-bottom: 4px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .product-mini-text span {

            color: #087a55;

            font-size: 11px;

            font-weight: bold;

        }


        /* =================================
           COMMENTS AREA
        ================================= */

        .comments-scroll {

            flex: 1;

            padding:
                15px 18px 110px;

            overflow-y: auto;

            overscroll-behavior:
                contain;

            scroll-behavior:
                smooth;

        }


        .comments-scroll::-webkit-scrollbar {

            width: 5px;

        }


        .comments-scroll::-webkit-scrollbar-thumb {

            background: #d4ddd8;

            border-radius: 20px;

        }


        /* =================================
           LOADING
        ================================= */

        .loading {

            min-height: 260px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 12px;

            color: #087a55;

            font-size: 14px;

        }


        .loading-spinner {

            width: 32px;

            height: 32px;

            border:
                3px solid #e1ebe6;

            border-top-color:
                #087a55;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;

        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* =================================
           EMPTY
        ================================= */

        .empty-comments {

            min-height: 320px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            text-align: center;

            padding: 30px;

        }


        .empty-icon {

            width: 75px;

            height: 75px;

            border-radius: 50%;

            background: #eef8f4;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 34px;

            margin-bottom: 16px;

        }


        .empty-comments h2 {

            font-size: 18px;

            margin-bottom: 8px;

        }


        .empty-comments p {

            color: #77817d;

            font-size: 13px;

            line-height: 1.9;

            max-width: 350px;

        }


        /* =================================
           COMMENT ITEM
        ================================= */

        .comment-item {

            display: flex;

            align-items: flex-start;

            gap: 10px;

            margin-bottom: 18px;

            animation:
                commentIn .3s ease both;

        }


        @keyframes commentIn {

            from {

                opacity: 0;

                transform:
                    translateY(8px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .avatar {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            object-fit: cover;

            background: #e8efeb;

            border:
                1px solid #dce5e0;

            flex-shrink: 0;

        }


        .avatar-placeholder {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            background: #087a55;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;

            flex-shrink: 0;

        }


        .comment-content {

            min-width: 0;

            flex: 1;

        }


        .comment-bubble {

            background: #f4f7f5;

            border-radius:
                5px 17px 17px 17px;

            padding:
                11px 13px;

            position: relative;

        }


        .comment-top {

            display: flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 7px;

        }


        .comment-name {

            font-size: 12px;

            font-weight: 900;

            color: #26332d;

            max-width: 170px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .comment-username {

            font-size: 10px;

            color: #8a9490;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .comment-text {

            font-size: 13px;

            line-height: 1.9;

            color: #3d4944;

            white-space: pre-wrap;

            word-break: break-word;

        }


        .comment-footer {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding:
                6px 3px 0;

        }


        .comment-time {

            color: #8a9490;

            font-size: 9px;

        }


        .delete-comment {

            border: none;

            background: transparent;

            color: #b42318;

            font-size: 10px;

            font-weight: bold;

            cursor: pointer;

            padding: 4px 6px;

            border-radius: 6px;

        }


        .delete-comment:hover {

            background: #fff0ef;

        }


        /* =================================
           LOGIN MESSAGE
        ================================= */

        .login-message {

            background: #eef8f4;

            border:
                1px solid #d4ede2;

            border-radius: 14px;

            padding:
                13px 14px;

            margin-bottom: 18px;

            color: #087a55;

            font-size: 12px;

            line-height: 1.8;

            text-align: center;

        }


        .login-message a {

            color: #055c40;

            font-weight: 900;

            text-decoration: underline;

        }


        /* =================================
           ERROR
        ================================= */

        .error-box {

            margin: 20px 0;

            background: #fff4f4;

            border:
                1px solid #ffd2d2;

            color: #b42318;

            border-radius: 14px;

            padding: 18px;

            text-align: center;

            font-size: 12px;

            line-height: 1.8;

        }


        /* =================================
           INPUT AREA
        ================================= */

        .input-area {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 30;

            background:
                rgba(255,255,255,.97);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);

            border-top:
                1px solid #e4eae7;

            padding:
                10px 14px;

            padding-bottom:
                max(
                    10px,
                    env(safe-area-inset-bottom)
                );

        }


        .input-wrapper {

            max-width: 850px;

            margin: auto;

            display: flex;

            align-items: flex-end;

            gap: 8px;

        }


        .comment-input {

            flex: 1;

            min-height: 43px;

            max-height: 120px;

            resize: none;

            border:
                1px solid #dce4e0;

            border-radius: 14px;

            background: #f7f9f8;

            outline: none;

            padding:
                11px 13px;

            font-size: 12px;

            color: #25322c;

            line-height: 1.7;

            transition:
                border-color .2s ease,
                background .2s ease;

        }


        .comment-input:focus {

            border-color:
                #087a55;

            background:
                #ffffff;

        }


        .comment-input::placeholder {

            color: #9aa39f;

        }


        .send-button {

            width: 44px;

            height: 43px;

            border: none;

            border-radius: 13px;

            background: #087a55;

            color: white;

            font-size: 18px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                transform .18s ease,
                background .18s ease;

            flex-shrink: 0;

        }


        .send-button:hover {

            background: #055c40;

        }


        .send-button:active {

            transform:
                scale(.9);

        }


        .send-button:disabled {

            opacity: .55;

            cursor: wait;

        }


        /* =================================
           NOTIFICATION
        ================================= */

        .toast {

            position: fixed;

            top: 78px;

            left: 50%;

            transform:
                translate(-50%, -15px);

            z-index: 100;

            background: #18211d;

            color: white;

            padding:
                10px 16px;

            border-radius: 10px;

            font-size: 11px;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .25s ease,
                transform .25s ease,
                visibility .25s ease;

            max-width:
                calc(100% - 30px);

            text-align: center;

        }


        .toast.show {

            opacity: 1;

            visibility: visible;

            transform:
                translate(-50%, 0);

        }


        /* =================================
           DESKTOP
        ================================= */

        @media (min-width: 700px) {

            body {

                background: #eef2f0;

                padding: 20px;

            }


            .comments-app {

                max-width: 900px;

                min-height:
                    calc(100vh - 40px);

                margin: auto;

                border-radius: 22px;

                overflow: hidden;

                box-shadow:
                    0 15px 50px
                    rgba(0,0,0,.10);

            }


            .input-area {

                position: absolute;

                left: auto;

                right: auto;

                bottom: auto;

                width: 100%;

            }

        }


        @media (max-width: 450px) {

            .header-main {

                padding:
                    10px 12px;

            }


            .comments-scroll {

                padding-left: 12px;

                padding-right: 12px;

            }


            .comment-name {

                max-width: 130px;

            }


            .comment-count-top {

                padding:
                    6px 8px;

            }

        }

    </style>

</head>


<body>


<div class="comments-app">


    <header class="top-header">

        <div class="header-main">

            <button
                class="close-button"
                type="button"
                onclick="closeComments()"
                aria-label="بستن"
            >
                ✕
            </button>


            <div class="header-title">

                <h1>
                    نظرات
                </h1>

                <p id="headerProductTitle">
                    در حال دریافت محصول...
                </p>

            </div>


            <div
                class="comment-count-top"
                id="topCommentCount"
            >
                0 نظر
            </div>

        </div>


        <div
            class="product-mini"
            id="productMini"
        >

            <div class="product-mini-inner">

                <div id="productMiniImage"></div>

                <div class="product-mini-text">

                    <strong
                        id="miniProductTitle"
                    >
                        محصول
                    </strong>

                    <span
                        id="miniProductPrice"
                    >
                        —
                    </span>

                </div>

            </div>

        </div>

    </header>


    <main
        class="comments-scroll"
        id="commentsScroll"
    >

        <div
            class="loading"
            id="loading"
        >

            <div class="loading-spinner"></div>

            <span>
                در حال دریافت نظرات...
            </span>

        </div>

    </main>


    <div class="input-area">

        <div class="input-wrapper">

            <textarea
                id="commentInput"
                class="comment-input"
                rows="1"
                maxlength="1000"
                placeholder="نظر خود را بنویسید..."
            ></textarea>


            <button
                id="sendButton"
                class="send-button"
                type="button"
                onclick="sendComment()"
                aria-label="ارسال نظر"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

    const SUPABASE_URL =
        "https://vhiewoopyqugdxwvsbno.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =================================
       URL
    ================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const productId =
        params.get("id") ||
        params.get("productId");


    /* صفحه‌ای که کاربر از آن وارد کامنت شده */
    const fromPage =
        params.get("from");


    const commentsScroll =
        document.getElementById(
            "commentsScroll"
        );


    const commentInput =
        document.getElementById(
            "commentInput"
        );


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const topCommentCount =
        document.getElementById(
            "topCommentCount"
        );


    const headerProductTitle =
        document.getElementById(
            "headerProductTitle"
        );


    const productMini =
        document.getElementById(
            "productMini"
        );


    const productMiniImage =
        document.getElementById(
            "productMiniImage"
        );


    const miniProductTitle =
        document.getElementById(
            "miniProductTitle"
        );


    const miniProductPrice =
        document.getElementById(
            "miniProductPrice"
        );


    const toast =
        document.getElementById(
            "toast"
        );


    let currentUser = null;

    let currentProduct = null;

    let comments = [];

    let profiles = {};

    let toastTimer = null;


    /* =================================
       CLOSE
    ================================= */

    function closeComments() {

        /*
         * اگر Comments داخل iframe باز شده باشد،
         * به صفحه اصلی پیام بسته‌شدن می‌فرستیم.
         */

        if (
            window.parent &&
            window.parent !== window
        ) {

            window.parent.postMessage(
                "close-comments",
                "*"
            );

            return;

        }


        /*
         * اگر از صفحه مشخصی آمده باشیم،
         * دقیقاً به همان صفحه برمی‌گردیم.
         */

        if (fromPage) {

            window.location.href =
                fromPage;

            return;

        }


        /*
         * اگر from وجود نداشت،
         * از history استفاده می‌کنیم.
         */

        if (
            document.referrer &&
            document.referrer !==
                window.location.href
        ) {

            history.back();

            return;

        }


        /*
         * مسیر پیش‌فرض
         */

        window.location.href =
            "products.html";

    }


    /* =================================
       START
    ================================= */

    async function start() {

        if (!productId) {

            showError(
                "شناسه محصول پیدا نشد."
            );

            return;

        }


        try {

            await getCurrentUser();

            await loadProduct();

            await loadComments();

            setupInput();

        }

        catch (error) {

            console.error(
                error
            );

            showError(
                "خطایی در دریافت اطلاعات رخ داد."
            );

        }

    }


    /* =================================
       CURRENT USER
    ================================= */

    async function getCurrentUser() {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getUser();


        if (!error && data?.user) {

            currentUser =
                data.user;

        } else {

            currentUser = null;

        }

    }


    /* =================================
       PRODUCT
    ================================= */

    async function loadProduct() {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("products")
            .select(`
                id,
                title,
                price,
                image_url,
                image_urls,
                status
            `)
            .eq(
                "id",
                productId
            )
            .maybeSingle();


        if (error) {

            throw error;

        }


        if (!data) {

            showError(
                "این محصول پیدا نشد."
            );

            return;

        }


        currentProduct =
            data;


        headerProductTitle.textContent =
            data.title ||
            "محصول";


        miniProductTitle.textContent =
            data.title ||
            "محصول";


        miniProductPrice.textContent =
            data.price !== null &&
            data.price !== undefined
                ? `${formatPrice(data.price)} افغانی`
                : "قیمت نامشخص";


        const image =
            getFirstImage(
                data
            );


        if (image) {

            productMiniImage.innerHTML = `

                <img
                    class="product-mini-image"
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(
                        data.title || "محصول"
                    )}"
                >

            `;

        } else {

            productMiniImage.innerHTML = `

                <div class="product-mini-placeholder">
                    🛍️
                </div>

            `;

        }


        productMini.style.display =
            "block";

    }


    /* =================================
       COMMENTS
    ================================= */

    async function loadComments() {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("product_comments")
            .select(`
                id,
                product_id,
                user_id,
                comment,
                created_at
            `)
            .eq(
                "product_id",
                productId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


        if (error) {

            throw error;

        }


        comments =
            data || [];


        const userIds =
            [
                ...new Set(
                    comments
                        .map(
                            item =>
                                item.user_id
                        )
                        .filter(Boolean)
                )
            ];


        profiles = {};


        if (userIds.length) {

            const {
                data: profileData,
                error: profileError
            } =
            await supabaseClient
                .from("profiles")
                .select(`
                    id,
                    full_name,
                    username,
                    avatar_url
                `)
                .in(
                    "id",
                    userIds
                );


            if (profileError) {

                console.error(
                    "Profiles Error:",
                    profileError
                );

            } else {

                (profileData || []).forEach(
                    profile => {

                        profiles[
                            profile.id
                        ] =
                            profile;

                    }
                );

            }

        }


        renderComments();

    }


    /* =================================
       RENDER
    ================================= */

    function renderComments() {

        updateCount();


        if (!comments.length) {

            commentsScroll.innerHTML = `

                <div class="empty-comments">

                    <div class="empty-icon">
                        💬
                    </div>

                    <h2>
                        هنوز نظری ثبت نشده
                    </h2>

                    <p>
                        اولین نفری باش که درباره
                        این محصول نظر می‌دهد.
                    </p>

                </div>

            `;


            if (!currentUser) {

                addLoginMessage();

            }


            return;

        }


        let html = "";


        if (!currentUser) {

            html += `

                <div class="login-message">

                    برای نوشتن نظر ابتدا
                    <a href="login.html">
                        وارد حساب شوید
                    </a>.

                </div>

            `;

        }


        html += comments
            .map(
                comment =>
                    createCommentHTML(
                        comment
                    )
            )
            .join("");


        commentsScroll.innerHTML =
            html;


        scrollToBottom();

    }


    /* =================================
       COMMENT HTML
    ================================= */

    function createCommentHTML(
        comment
    ) {

        const profile =
            profiles[
                comment.user_id
            ] || {};


        const name =
            profile.full_name ||
            profile.username ||
            "کاربر بازارک";


        const username =
            profile.username
                ? "@" + profile.username
                : "";


        const avatar =
            profile.avatar_url;


        let avatarHTML;


        if (avatar) {

            avatarHTML = `

                <img
                    class="avatar"
                    src="${escapeHTML(avatar)}"
                    alt="${escapeHTML(name)}"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                    "
                >

                <div
                    class="avatar-placeholder"
                    style="display:none;"
                >
                    👤
                </div>

            `;

        } else {

            avatarHTML = `

                <div class="avatar-placeholder">
                    👤
                </div>

            `;

        }


        const ownComment =
            currentUser &&
            currentUser.id ===
            comment.user_id;


        const deleteHTML =
            ownComment

                ? `

                    <button
                        type="button"
                        class="delete-comment"
                        onclick="
                            deleteComment(
                                '${escapeHTML(comment.id)}'
                            )
                        "
                    >
                        حذف
                    </button>

                  `

                : "";


        return `

            <article
                class="comment-item"
                data-comment-id="${escapeHTML(
                    comment.id
                )}"
            >

                ${avatarHTML}


                <div class="comment-content">

                    <div class="comment-bubble">

                        <div class="comment-top">

                            <span class="comment-name">
                                ${escapeHTML(name)}
                            </span>

                            ${
                                username
                                    ? `
                                        <span class="comment-username">
                                            ${escapeHTML(username)}
                                        </span>
                                      `
                                    : ""
                            }

                        </div>


                        <div class="comment-text">
                            ${escapeHTML(
                                comment.comment
                            )}
                        </div>

                    </div>


                    <div class="comment-footer">

                        <span class="comment-time">

                            ${formatDate(
                                comment.created_at
                            )}

                        </span>

                        ${deleteHTML}

                    </div>

                </div>

            </article>

        `;

    }


    /* =================================
       ADD LOGIN MESSAGE
    ================================= */

    function addLoginMessage() {

        const message =
            document.createElement(
                "div"
            );


        message.className =
            "login-message";


        message.innerHTML = `

            برای نوشتن نظر ابتدا
            <a href="login.html">
                وارد حساب شوید
            </a>.

        `;


        commentsScroll.appendChild(
            message
        );

    }


    /* =================================
       SEND COMMENT
    ================================= */

    async function sendComment() {

        if (!currentUser) {

            showToast(
                "برای ثبت نظر ابتدا وارد حساب شوید."
            );


            setTimeout(
                () => {

                    window.location.href =
                        "login.html";

                },
                900
            );


            return;

        }


        const text =
            commentInput.value.trim();


        if (!text) {

            showToast(
                "لطفاً متن نظر را بنویسید."
            );

            commentInput.focus();

            return;

        }


        if (text.length > 1000) {

            showToast(
                "نظر نمی‌تواند بیشتر از ۱۰۰۰ کاراکتر باشد."
            );

            return;

        }


        sendButton.disabled =
            true;


        const originalButton =
            sendButton.innerHTML;


        sendButton.innerHTML =
            "⌛";


        const {
            data,
            error
        } =
        await supabaseClient
            .from("product_comments")
            .insert({

                product_id:
                    productId,

                user_id:
                    currentUser.id,

                comment:
                    text

            })
            .select(`
                id,
                product_id,
                user_id,
                comment,
                created_at
            `)
            .single();


        if (error) {

            console.error(
                "Comment Insert Error:",
                error
            );


            showToast(
                "ثبت نظر انجام نشد. دوباره تلاش کنید."
            );


            sendButton.innerHTML =
                originalButton;

            sendButton.disabled =
                false;

            return;

        }


        comments.push(
            data
        );


        const profile =
            await loadSingleProfile(
                currentUser.id
            );


        if (profile) {

            profiles[
                currentUser.id
            ] =
                profile;

        }


        commentInput.value =
            "";


        autoResize();


        renderComments();


        showToast(
            "نظر شما با موفقیت ثبت شد ✓"
        );


        if (
            window.parent &&
            window.parent !== window
        ) {

            window.parent.postMessage(
                {
                    type:
                        "comment-added",

                    productId:
                        productId
                },
                "*"
            );

        }


        sendButton.innerHTML =
            originalButton;

        sendButton.disabled =
            false;

    }


    /* =================================
       LOAD SINGLE PROFILE
    ================================= */

    async function loadSingleProfile(
        userId
    ) {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("profiles")
            .select(`
                id,
                full_name,
                username,
                avatar_url
            `)
            .eq(
                "id",
                userId
            )
            .maybeSingle();


        if (error) {

            console.error(
                error
            );

            return null;

        }


        return data;

    }


    /* =================================
       DELETE COMMENT
    ================================= */

    async function deleteComment(
        commentId
    ) {

        if (!currentUser) {

            return;

        }


        const confirmed =
            confirm(
                "آیا مطمئن هستید که می‌خواهید این نظر را حذف کنید؟"
            );


        if (!confirmed) {

            return;

        }


        const {
            error
        } =
        await supabaseClient
            .from("product_comments")
            .delete()
            .eq(
                "id",
                commentId
            )
            .eq(
                "user_id",
                currentUser.id
            );


        if (error) {

            console.error(
                "Delete Comment Error:",
                error
            );


            showToast(
                "حذف نظر انجام نشد."
            );

            return;

        }


        comments =
            comments.filter(
                item =>
                    item.id !==
                    commentId
            );


        renderComments();


        showToast(
            "نظر حذف شد."
        );


        if (
            window.parent &&
            window.parent !== window
        ) {

            window.parent.postMessage(
                {
                    type:
                        "comment-deleted",

                    productId:
                        productId
                },
                "*"
            );

        }

    }


    /* =================================
       INPUT
    ================================= */

    function setupInput() {

        commentInput.addEventListener(
            "input",
            autoResize
        );


        commentInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendComment();

                }

            }
        );

    }


    function autoResize() {

        commentInput.style.height =
            "auto";


        commentInput.style.height =
            Math.min(
                commentInput.scrollHeight,
                120
            ) + "px";

    }


    /* =================================
       SCROLL
    ================================= */

    function scrollToBottom() {

        setTimeout(
            () => {

                commentsScroll.scrollTo({

                    top:
                        commentsScroll.scrollHeight,

                    behavior:
                        "smooth"

                });

            },
            50
        );

    }


    /* =================================
       COUNT
    ================================= */

    function updateCount() {

        const count =
            comments.length;


        topCommentCount.textContent =
            `${count} نظر`;

    }


    /* =================================
       FIRST IMAGE
    ================================= */

    function getFirstImage(
        product
    ) {

        if (
            Array.isArray(
                product.image_urls
            ) &&
            product.image_urls.length
        ) {

            return product.image_urls[0];

        }


        if (
            product.image_url
        ) {

            return product.image_url;

        }


        return null;

    }


    /* =================================
       PRICE
    ================================= */

    function formatPrice(
        price
    ) {

        if (
            price === null ||
            price === undefined
        ) {

            return "—";

        }


        return Number(price)
            .toLocaleString("fa-AF");

    }


    /* =================================
       DATE
    ================================= */

    function formatDate(
        dateString
    ) {

        if (!dateString) {

            return "";

        }


        const date =
            new Date(
                dateString
            );


        try {

            const datePart =
                date.toLocaleDateString(
                    "fa-AF",
                    {
                        year:
                            "numeric",

                        month:
                            "short",

                        day:
                            "numeric"
                    }
                );


            const timePart =
                date.toLocaleTimeString(
                    "fa-AF",
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit"
                    }
                );


            return `${datePart} • ${timePart}`;

        }

        catch {

            return date.toLocaleString();

        }

    }


    /* =================================
       ESCAPE
    ================================= */

    function escapeHTML(
        value
    ) {

        return String(
            value ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* =================================
       ERROR
    ================================= */

    function showError(
        message
    ) {

        commentsScroll.innerHTML = `

            <div class="error-box">

                ❌

                <br><br>

                ${escapeHTML(message)}

            </div>

        `;

    }


    /* =================================
       TOAST
    ================================= */

    function showToast(
        message
    ) {

        clearTimeout(
            toastTimer
        );


        toast.textContent =
            message;


        toast.classList.add(
            "show"
        );


        toastTimer =
            setTimeout(
                () => {

                    toast.classList.remove(
                        "show"
                    );

                },
                2500
            );

    }


    /* =================================
       ESC KEY
    ================================= */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                closeComments();

            }

        }
    );


    /* =================================
       START APP
    ================================= */

    start();

</script>

</body>
