<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>نظرات | بازارک</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f4f7f5;
    color: #17251d;
}


/* ================================
   HEADER
================================ */

.header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: white;
    border-bottom: 1px solid #e7eee9;
    padding: 14px 16px;
}

.header-inner {
    max-width: 700px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

.back-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: #f1f6f3;
    color: #087443;
    font-size: 20px;
    cursor: pointer;
}

.header-title {
    flex: 1;
}

.header-title strong {
    display: block;
    color: #087443;
    font-size: 16px;
}

.header-title span {
    display: block;
    color: #888;
    font-size: 11px;
    margin-top: 3px;
}


/* ================================
   PRODUCT
================================ */

.product-preview {
    max-width: 700px;
    margin: 14px auto;
    padding: 0 14px;
}

.product-box {
    background: white;
    border-radius: 15px;
    padding: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.05);
    display: flex;
    align-items: center;
    gap: 12px;
}

.product-box img {
    width: 62px;
    height: 62px;
    border-radius: 10px;
    object-fit: cover;
    background: #eef2ef;
}

.product-box-info {
    min-width: 0;
}

.product-box-title {
    font-weight: bold;
    font-size: 14px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.product-box-price {
    color: #087443;
    font-size: 13px;
    margin-top: 6px;
    font-weight: bold;
}


/* ================================
   COMMENTS
================================ */

.comments-container {
    max-width: 700px;
    margin: auto;
    padding: 5px 14px 130px;
}

.comments-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}


/*
   مهم:
   کارت به اندازه محتوای خودش است.
*/

.comment-item {
    align-self: flex-start;
    width: fit-content;
    max-width: min(92%, 560px);
    min-width: 0;

    background: white;
    border-radius: 15px;
    padding: 11px 13px;

    box-shadow: 0 4px 15px rgba(0,0,0,.055);

    animation: commentIn .28s ease both;
}


@keyframes commentIn {

    from {
        opacity: 0;
        transform: translateY(10px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* ================================
   COMMENT HEADER
================================ */

.comment-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}

.comment-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    background: #e7f4ed;
    cursor: pointer;
    flex-shrink: 0;
}

.comment-user {
    cursor: pointer;
    min-width: 0;
}

.comment-user-name {
    color: #087443;
    font-weight: bold;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.comment-user-username {
    color: #999;
    font-size: 10px;
    margin-top: 2px;
}


/* ================================
   COMMENT TEXT
================================ */

.comment-text {
    color: #333;
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}


/* ================================
   COMMENT ACTIONS
================================ */

.comment-actions {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 9px;
    padding-top: 8px;
    border-top: 1px solid #edf1ee;
}

.comment-action {
    border: none;
    background: transparent;
    color: #777;
    font-family: inherit;
    font-size: 11px;
    padding: 5px 7px;
    border-radius: 7px;
    cursor: pointer;
    transition: .2s ease;
}

.comment-action:hover {
    background: #f1f6f3;
    color: #087443;
}

.comment-action.liked {
    color: #c62828;
    background: #fff3f3;
}

.delete-comment {
    color: #c62828;
}


/* ================================
   REPLIES
================================ */

.replies {
    margin-top: 10px;
    margin-right: 17px;
    padding-right: 10px;
    border-right: 2px solid #e1eee6;

    display: flex;
    flex-direction: column;
    gap: 9px;
}

.reply-item {
    width: fit-content;
    max-width: 95%;
    background: #f7faf8;
    border: 1px solid #e8eee9;
    border-radius: 12px;
    padding: 9px 11px;

    animation: replyIn .25s ease both;
}

@keyframes replyIn {

    from {
        opacity: 0;
        transform: translateX(-8px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}

.reply-item .comment-header {
    margin-bottom: 6px;
}


/* ================================
   REPLY BOX
================================ */

.reply-box {
    margin-top: 9px;
    display: none;
    animation: replyBoxIn .22s ease both;
}

.reply-box.show {
    display: block;
}

@keyframes replyBoxIn {

    from {
        opacity: 0;
        transform: translateY(-5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.reply-form {
    display: flex;
    align-items: center;
    gap: 7px;
}

.reply-input {
    flex: 1;
    min-width: 0;
    border: 1px solid #dce6df;
    background: #fafcfb;
    border-radius: 10px;
    padding: 9px 10px;
    outline: none;
    font-family: inherit;
    font-size: 12px;
}

.reply-input:focus {
    border-color: #087443;
    background: white;
}

.reply-send {
    border: none;
    background: #087443;
    color: white;
    border-radius: 9px;
    padding: 9px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
}


/* ================================
   BOTTOM INPUT
================================ */

.comment-composer {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    z-index: 30;

    background: rgba(255,255,255,.96);
    backdrop-filter: blur(10px);

    border-top: 1px solid #e4ebe6;

    padding: 10px 14px;
}

.composer-inner {
    max-width: 700px;
    margin: auto;
    display: flex;
    gap: 8px;
}

.main-input {
    flex: 1;
    min-width: 0;
    border: 1px solid #dce6df;
    border-radius: 11px;
    padding: 11px 12px;
    outline: none;
    font-family: inherit;
    font-size: 13px;
}

.main-input:focus {
    border-color: #087443;
}

.send-btn {
    border: none;
    background: #087443;
    color: white;
    border-radius: 11px;
    padding: 0 17px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
}


/* ================================
   EMPTY / LOADING
================================ */

.state {
    text-align: center;
    color: #888;
    padding: 50px 20px;
    font-size: 13px;
}

.login-state {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
    text-align: center;
    color: #777;
}

.login-state a {
    display: inline-block;
    margin-top: 10px;
    background: #087443;
    color: white;
    padding: 9px 15px;
    border-radius: 9px;
    text-decoration: none;
    font-size: 12px;
}


/* ================================
   TOAST
================================ */

.toast {
    position: fixed;
    left: 50%;
    bottom: 80px;
    transform: translate(-50%, 20px);

    background: #17251d;
    color: white;

    padding: 10px 15px;
    border-radius: 10px;

    font-size: 12px;

    opacity: 0;
    pointer-events: none;

    transition: .25s ease;

    z-index: 100;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}


@media (max-width: 550px) {

    .comment-item {
        max-width: 94%;
    }

    .comments-container {
        padding-left: 10px;
        padding-right: 10px;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="header-inner">

        <button
            class="back-btn"
            type="button"
            onclick="closeComments()"
        >
            ×
        </button>

        <div class="header-title">

            <strong>
                💬 نظرات
            </strong>

            <span id="commentSubtitle">
                نظرات محصول
            </span>

        </div>

    </div>

</header>


<section class="product-preview">

    <div
        id="productBox"
        class="product-box"
        style="display:none;"
    >

        <img
            id="productImage"
            src=""
            alt=""
        >

        <div class="product-box-info">

            <div
                id="productTitle"
                class="product-box-title"
            ></div>

            <div
                id="productPrice"
                class="product-box-price"
            ></div>

        </div>

    </div>

</section>


<main class="comments-container">

    <div
        id="loginState"
        class="login-state"
        style="display:none;"
    >
        برای نوشتن نظر ابتدا وارد حساب شوید.

        <br>

        <a href="login.html">
            ورود به حساب
        </a>
    </div>


    <div
        id="commentsList"
        class="comments-list"
    >

        <div class="state">
            ⏳ در حال دریافت نظرها...
        </div>

    </div>

</main>


<div class="comment-composer">

    <div class="composer-inner">

        <input
            id="mainInput"
            class="main-input"
            type="text"
            maxlength="1000"
            placeholder="نظر خود را بنویسید..."
        >

        <button
            id="sendButton"
            class="send-btn"
            type="button"
        >
            ارسال
        </button>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://vhiewoopyqugdxwvsbno.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_j2_7E0cyJ6tMpKnlDVODYA_z_I1Mwdv";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================
   ELEMENTS
========================================= */

const commentsList =
    document.getElementById(
        "commentsList"
    );

const mainInput =
    document.getElementById(
        "mainInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const loginState =
    document.getElementById(
        "loginState"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================
   STATE
========================================= */

let currentUser = null;
let productId = null;
let comments = [];
let profiles = {};
let commentLikes = {};


/* =========================================
   PRODUCT ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

productId =
    params.get("id") ||
    params.get("productId");


/* =========================================
   START
========================================= */

async function start() {

    if (!productId) {

        commentsList.innerHTML = `
            <div class="state">
                ❌ شناسه محصول پیدا نشد.
            </div>
        `;

        return;
    }


    const {
        data: {
            session
        }
    } =
    await supabaseClient.auth.getSession();


    currentUser =
        session?.user || null;


    if (!currentUser) {

        loginState.style.display =
            "block";

    }


    await loadProduct();

    await loadComments();

}


start();


/* =========================================
   PRODUCT
========================================= */

async function loadProduct() {

    const {
        data: product,
        error
    } = await supabaseClient
        .from("products")
        .select(
            "id,title,price,image_url,image_urls"
        )
        .eq(
            "id",
            productId
        )
        .maybeSingle();


    if (error) {

        console.error(error);

        return;
    }


    if (!product) {
        return;
    }


    const image =
        product.image_url ||
        (
            Array.isArray(product.image_urls) &&
            product.image_urls.length
                ? product.image_urls[0]
                : ""
        );


    document.getElementById(
        "productImage"
    ).src =
        image ||
        "https://via.placeholder.com/100x100?text=B";


    document.getElementById(
        "productTitle"
    ).textContent =
        product.title ||
        "محصول";


    document.getElementById(
        "productPrice"
    ).textContent =
        Number(
            product.price || 0
        ).toLocaleString() +
        " افغانی";


    document.getElementById(
        "productBox"
    ).style.display =
        "flex";


    document.getElementById(
        "commentSubtitle"
    ).textContent =
        product.title ||
        "نظرات محصول";

}


/* =========================================
   LOAD COMMENTS
========================================= */

async function loadComments() {

    commentsList.innerHTML = `
        <div class="state">
            ⏳ در حال دریافت نظرها...
        </div>
    `;


    const {
        data,
        error
    } = await supabaseClient
        .from("product_comments")
        .select(`
            id,
            product_id,
            user_id,
            comment,
            parent_id,
            created_at
        `)
        .eq(
            "product_id",
            productId
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Comments error:",
            error
        );

        commentsList.innerHTML = `
            <div class="state">
                ❌ دریافت نظرها انجام نشد.
            </div>
        `;

        return;
    }


    comments =
        data || [];


    await loadProfiles();

    await loadCommentLikes();

    renderComments();

}


/* =========================================
   LOAD PROFILES
========================================= */

async function loadProfiles() {

    const userIds =
        [
            ...new Set(
                comments.map(
                    item => item.user_id
                )
            )
        ];


    if (!userIds.length) {
        return;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select(
            "id,full_name,username,avatar_url"
        )
        .in(
            "id",
            userIds
        );


    if (error) {

        console.error(
            "Profiles error:",
            error
        );

        return;
    }


    profiles = {};


    (data || []).forEach(
        function(profile) {

            profiles[
                profile.id
            ] = profile;

        }
    );

}


/* =========================================
   LOAD COMMENT LIKES
========================================= */

async function loadCommentLikes() {

    commentLikes = {};


    if (!comments.length) {
        return;
    }


    const commentIds =
        comments.map(
            item => item.id
        );


    const {
        data,
        error
    } = await supabaseClient
        .from("comment_likes")
        .select(
            "comment_id,user_id"
        )
        .in(
            "comment_id",
            commentIds
        );


    if (error) {

        console.error(
            "Comment likes error:",
            error
        );

        return;
    }


    (data || []).forEach(
        function(like) {

            if (
                !commentLikes[
                    like.comment_id
                ]
            ) {

                commentLikes[
                    like.comment_id
                ] = {
                    count: 0,
                    liked: false
                };

            }


            commentLikes[
                like.comment_id
            ].count++;


            if (
                currentUser &&
                like.user_id ===
                    currentUser.id
            ) {

                commentLikes[
                    like.comment_id
                ].liked = true;

            }

        }
    );

}


/* =========================================
   RENDER
========================================= */

function renderComments() {

    if (!comments.length) {

        commentsList.innerHTML = `
            <div class="state">
                💬 هنوز نظری ثبت نشده است.
            </div>
        `;

        return;
    }


    const roots =
        comments.filter(
            item =>
                !item.parent_id
        );


    commentsList.innerHTML =
        roots.map(
            function(comment) {

                return renderComment(
                    comment,
                    false
                );

            }
        ).join("");

}


/* =========================================
   RENDER COMMENT
========================================= */

function renderComment(
    comment,
    isReply
) {

    const profile =
        profiles[
            comment.user_id
        ] || {};


    const name =
        profile.full_name ||
        profile.username ||
        "کاربر بازارک";


    const username =
        profile.username
            ? "@" + profile.username
            : "";


    const avatar =
        profile.avatar_url ||
        "https://ui-avatars.com/api/?name=User&background=087443&color=fff&size=100";


    const likeData =
        commentLikes[
            comment.id
        ] || {
            count: 0,
            liked: false
        };


    const replies =
        comments.filter(
            item =>
                item.parent_id ===
                comment.id
        );


    return `

        <div
            class="${isReply ? "reply-item" : "comment-item"}"
            data-comment="${escapeAttribute(comment.id)}"
        >

            <div class="comment-header">

                <img
                    class="comment-avatar"
                    src="${escapeAttribute(avatar)}"
                    alt=""
                    onclick="openUserProfile('${escapeAttribute(comment.user_id)}')"
                >

                <div
                    class="comment-user"
                    onclick="openUserProfile('${escapeAttribute(comment.user_id)}')"
                >

                    <div class="comment-user-name">
                        ${escapeHTML(name)}
                    </div>

                    <div class="comment-user-username">
                        ${escapeHTML(username)}
                    </div>

                </div>

            </div>


            <div class="comment-text">
                ${escapeHTML(comment.comment)}
            </div>


            <div class="comment-actions">

                <button
                    type="button"
                    class="comment-action ${likeData.liked ? "liked" : ""}"
                    onclick="toggleCommentLike('${escapeAttribute(comment.id)}')"
                >
                    ❤️
                    <span>
                        ${likeData.count || 0}
                    </span>
                </button>


                ${
                    !isReply
                    ? `
                        <button
                            type="button"
                            class="comment-action"
                            onclick="showReplyBox('${escapeAttribute(comment.id)}')"
                        >
                            ↩️ پاسخ
                        </button>
                    `
                    : ""
                }


                ${
                    currentUser &&
                    currentUser.id ===
                        comment.user_id
                    ? `
                        <button
                            type="button"
                            class="comment-action delete-comment"
                            onclick="deleteComment('${escapeAttribute(comment.id)}')"
                        >
                            🗑️ حذف
                        </button>
                    `
                    : ""
                }

            </div>


            ${
                !isReply
                ? `

                    <div
                        class="reply-box"
                        id="reply-box-${escapeAttribute(comment.id)}"
                    >

                        <div class="reply-form">

                            <input
                                id="reply-input-${escapeAttribute(comment.id)}"
                                class="reply-input"
                                type="text"
                                maxlength="1000"
                                placeholder="پاسخ خود را بنویسید..."
                            >

                            <button
                                type="button"
                                class="reply-send"
                                onclick="sendReply('${escapeAttribute(comment.id)}')"
                            >
                                ارسال
                            </button>

                        </div>

                    </div>

                `
                : ""
            }


            ${
                replies.length
                ? `

                    <div class="replies">

                        ${replies.map(
                            function(reply) {

                                return renderComment(
                                    reply,
                                    true
                                );

                            }
                        ).join("")}

                    </div>

                `
                : ""
            }

        </div>

    `;

}


/* =========================================
   OPEN USER PROFILE
========================================= */

function openUserProfile(userId) {

    if (!userId) {
        return;
    }


    window.location.href =
        "seller-profile.html?id=" +
        encodeURIComponent(userId);

}


/* =========================================
   SHOW REPLY BOX
========================================= */

function showReplyBox(commentId) {

    if (!currentUser) {

        showToast(
            "برای پاسخ دادن ابتدا وارد حساب شوید."
        );

        setTimeout(
            function() {

                window.location.href =
                    "login.html";

            },
            700
        );

        return;
    }


    const box =
        document.getElementById(
            "reply-box-" +
            commentId
        );


    if (!box) {
        return;
    }


    document
        .querySelectorAll(".reply-box.show")
        .forEach(
            function(item) {

                if (item !== box) {

                    item.classList.remove(
                        "show"
                    );

                }

            }
        );


    box.classList.toggle(
        "show"
    );


    if (box.classList.contains("show")) {

        const input =
            document.getElementById(
                "reply-input-" +
                commentId
            );


        if (input) {

            input.focus();

        }

    }

}


/* =========================================
   SEND REPLY
========================================= */

async function sendReply(parentId) {

    if (!currentUser) {

        showToast(
            "برای پاسخ دادن ابتدا وارد حساب شوید."
        );

        return;
    }


    const input =
        document.getElementById(
            "reply-input-" +
            parentId
        );


    if (!input) {
        return;
    }


    const text =
        input.value.trim();


    if (!text) {

        showToast(
            "لطفاً متن پاسخ را بنویسید."
        );

        return;
    }


    const {
        error
    } = await supabaseClient
        .from("product_comments")
        .insert({
            product_id:
                productId,
            user_id:
                currentUser.id,
            comment:
                text,
            parent_id:
                parentId
        });


    if (error) {

        console.error(
            "Reply error:",
            error
        );

        showToast(
            "❌ ثبت پاسخ انجام نشد."
        );

        return;
    }


    showToast(
        "پاسخ شما ثبت شد ✓"
    );


    await loadComments();


    sendParentMessage(
        "comment-added"
    );

}


/* =========================================
   MAIN COMMENT
========================================= */

async function sendComment() {

    if (!currentUser) {

        showToast(
            "برای ثبت نظر ابتدا وارد حساب شوید."
        );

        setTimeout(
            function() {

                window.location.href =
                    "login.html";

            },
            700
        );

        return;
    }


    const text =
        mainInput.value.trim();


    if (!text) {

        showToast(
            "لطفاً متن نظر را بنویسید."
        );

        mainInput.focus();

        return;
    }


    sendButton.disabled =
        true;


    const originalText =
        sendButton.textContent;


    sendButton.textContent =
        "⌛";


    const {
        error
    } = await supabaseClient
        .from("product_comments")
        .insert({
            product_id:
                productId,
            user_id:
                currentUser.id,
            comment:
                text,
            parent_id:
                null
        });


    if (error) {

        console.error(
            "Comment error:",
            error
        );

        showToast(
            "❌ ثبت نظر انجام نشد."
        );

        sendButton.textContent =
            originalText;

        sendButton.disabled =
            false;

        return;
    }


    mainInput.value = "";


    showToast(
        "نظر شما ثبت شد ✓"
    );


    await loadComments();


    sendParentMessage(
        "comment-added"
    );


    sendButton.textContent =
        originalText;

    sendButton.disabled =
        false;

}


/* =========================================
   LIKE / UNLIKE COMMENT
========================================= */

async function toggleCommentLike(commentId) {

    if (!currentUser) {

        showToast(
            "برای لایک کردن ابتدا وارد حساب شوید."
        );

        return;
    }


    const existing =
        commentLikes[
            commentId
        ] || {
            count: 0,
            liked: false
        };


    try {

        if (existing.liked) {

            const {
                error
            } = await supabaseClient
                .from("comment_likes")
                .delete()
                .eq(
                    "comment_id",
                    commentId
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


            if (error) {
                throw error;
            }

        } else {

            const {
                error
            } = await supabaseClient
                .from("comment_likes")
                .insert({
                    comment_id:
                        commentId,
                    user_id:
                        currentUser.id
                });


            if (error) {
                throw error;
            }

        }


        await loadComments();

    } catch (error) {

        console.error(
            "Comment like error:",
            error
        );


        if (
            error.code === "23505"
        ) {

            await loadComments();

            return;
        }


        showToast(
            "❌ لایک کامنت انجام نشد."
        );

    }

}


/* =========================================
   DELETE COMMENT
========================================= */

async function deleteComment(commentId) {

    if (!currentUser) {
        return;
    }


    const confirmed =
        confirm(
            "آیا این کامنت حذف شود؟"
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("product_comments")
        .delete()
        .eq(
            "id",
            commentId
        )
        .eq(
            "user_id",
            currentUser.id
        );


    if (error) {

        console.error(
            "Delete comment error:",
            error
        );

        showToast(
            "❌ حذف کامنت انجام نشد."
        );

        return;
    }


    showToast(
        "کامنت حذف شد ✓"
    );


    await loadComments();


    sendParentMessage(
        "comment-deleted"
    );

}


/* =========================================
   CLOSE
========================================= */

function closeComments() {

    if (
        window.parent &&
        window.parent !== window
    ) {

        window.parent.postMessage(
            {
                type:
                    "close-comments"
            },
            "*"
        );

        return;
    }


    if (
        window.history.length > 1
    ) {

        window.history.back();

    } else {

        window.location.href =
            "products.html";

    }

}


/* =========================================
   PARENT MESSAGE
========================================= */

function sendParentMessage(type) {

    if (
        window.parent &&
        window.parent !== window
    ) {

        window.parent.postMessage(
            {
                type:
                    type,
                productId:
                    productId
            },
            "*"
        );

    }

}


/* =========================================
   TOAST
========================================= */

let toastTimer = null;

function showToast(message) {

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


/* =========================================
   SEND BUTTON
========================================= */

sendButton.addEventListener(
    "click",
    sendComment
);


mainInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendComment();

        }

    }
);

</script>
