<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظرات محصول | بازارک</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f6f4;
            color: #17201b;
            overflow: hidden;
        }

        /* صفحه پشت پنل */
        .page {
            width: 100%;
            height: 100vh;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b756f;
        }

        /* لایه تاریک پشت پنل */
        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        /* پنل نظرات */
        .comments-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;

            height: 58vh;
            max-height: 700px;
            min-height: 350px;

            background: #ffffff;
            border-radius: 24px 24px 0 0;

            transform: translateY(100%);
            transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);

            z-index: 20;

            display: flex;
            flex-direction: column;

            box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.18);

            overflow: hidden;
        }

        .comments-sheet.active {
            transform: translateY(0);
        }

        /* قسمت کشیدن */
        .drag-area {
            width: 100%;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: grab;
            touch-action: none;
        }

        .drag-area:active {
            cursor: grabbing;
        }

        .drag-handle {
            width: 45px;
            height: 5px;
            border-radius: 10px;
            background: #cbd2ce;
        }

        /* هدر */
        .comments-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 8px 18px 14px;

            border-bottom: 1px solid #edf0ee;
            flex-shrink: 0;
        }

        .comments-title {
            font-size: 18px;
            font-weight: 700;
        }

        .comments-count {
            color: #6d7771;
            font-size: 13px;
            margin-right: 5px;
        }

        .close-btn {
            border: none;
            background: #f1f4f2;
            width: 36px;
            height: 36px;
            border-radius: 50%;

            font-size: 20px;
            color: #38423c;

            cursor: pointer;
            transition: 0.2s;
        }

        .close-btn:active {
            transform: scale(0.9);
        }

        /* لیست نظرات */
        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 18px 20px;

            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        .comment {
            display: flex;
            gap: 11px;
            padding: 14px 0;

            border-bottom: 1px solid #f0f2f1;
        }

        .comment-avatar {
            width: 42px;
            height: 42px;
            min-width: 42px;

            border-radius: 50%;
            object-fit: cover;

            background: #e8eee9;
        }

        .comment-content {
            flex: 1;
            min-width: 0;
        }

        .comment-top {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .comment-name {
            font-size: 14px;
            font-weight: 700;
        }

        .comment-username {
            color: #7b857f;
            font-size: 12px;
        }

        .comment-text {
            margin-top: 6px;
            font-size: 14px;
            line-height: 1.8;
            word-break: break-word;
        }

        .comment-time {
            display: block;
            margin-top: 5px;
            color: #8a938e;
            font-size: 11px;
        }

        .delete-comment {
            border: none;
            background: transparent;
            color: #d9534f;
            font-size: 12px;
            cursor: pointer;
            margin-top: 7px;
            padding: 0;
        }

        /* وقتی نظری وجود ندارد */
        .empty-comments {
            min-height: 180px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            color: #7b857f;
            text-align: center;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .empty-comments p {
            font-size: 14px;
        }

        /* فرم نظر */
        .comment-form {
            display: flex;
            align-items: center;
            gap: 9px;

            padding: 12px 15px;

            background: #ffffff;
            border-top: 1px solid #edf0ee;

            flex-shrink: 0;

            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }

        .comment-input {
            flex: 1;

            min-width: 0;

            height: 45px;

            border: 1px solid #dfe5e1;
            border-radius: 24px;

            padding: 0 17px;

            font-family: inherit;
            font-size: 13px;

            outline: none;

            background: #f7f9f8;

            transition: 0.2s;
        }

        .comment-input:focus {
            border-color: #20a45a;
            background: #ffffff;
        }

        .send-btn {
            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: #20a45a;
            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: transform 0.2s, opacity 0.2s;
        }

        .send-btn:active {
            transform: scale(0.9);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* موبایل */
        @media (max-width: 600px) {
            .comments-sheet {
                height: 58vh;
                border-radius: 22px 22px 0 0;
            }

            .comments-header {
                padding-right: 15px;
                padding-left: 15px;
            }

            .comments-list {
                padding-right: 15px;
                padding-left: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="page">
        <div>
            <h2>بازارک</h2>
            <p>این صفحه برای نمایش پنل نظرات استفاده می‌شود.</p>
        </div>
    </div>

    <!-- پس‌زمینه -->
    <div class="backdrop" id="backdrop"></div>

    <!-- پنل نظرات -->
    <section class="comments-sheet" id="commentsSheet">

        <!-- دستگیره -->
        <div class="drag-area" id="dragArea">
            <div class="drag-handle"></div>
        </div>

        <!-- هدر -->
        <div class="comments-header">

            <div>
                <span class="comments-title">
                    نظرات محصول
                </span>

                <span class="comments-count" id="commentsCount">
                    0 نظر
                </span>
            </div>

            <button
                type="button"
                class="close-btn"
                id="closeBtn"
                aria-label="بستن">
                ×
            </button>

        </div>

        <!-- لیست -->
        <div class="comments-list" id="commentsList">

            <div class="empty-comments">
                <div class="empty-icon">💬</div>
                <p>هنوز نظری برای این محصول ثبت نشده است.</p>
            </div>

        </div>

        <!-- فرم -->
        <form class="comment-form" id="commentForm">

            <input
                type="text"
                class="comment-input"
                id="commentInput"
                maxlength="500"
                autocomplete="off"
                placeholder="نظر خود را بنویسید...">

            <button
                type="submit"
                class="send-btn"
                id="sendBtn"
                aria-label="ارسال نظر">
                ➤
            </button>

        </form>

    </section>


    <script>

        const backdrop =
            document.getElementById("backdrop");

        const sheet =
            document.getElementById("commentsSheet");

        const closeBtn =
            document.getElementById("closeBtn");

        const dragArea =
            document.getElementById("dragArea");


        /*
         * باز کردن پنل
         */
        function openComments() {

            backdrop.classList.add("active");

            sheet.classList.add("active");

            document.body.style.overflow = "hidden";
        }


        /*
         * بستن پنل
         */
        function closeComments() {

            backdrop.classList.remove("active");

            sheet.classList.remove("active");

            document.body.style.overflow = "";
        }


        closeBtn.addEventListener(
            "click",
            closeComments
        );


        backdrop.addEventListener(
            "click",
            closeComments
        );


        /*
         * ESC برای دسکتاپ
         */
        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {
                    closeComments();
                }

            }
        );


        /*
         * Drag / Swipe
         */

        let startY = 0;
        let currentY = 0;
        let dragging = false;


        dragArea.addEventListener(
            "touchstart",
            function(event) {

                startY =
                    event.touches[0].clientY;

                dragging = true;

                sheet.style.transition = "none";

            },
            { passive: true }
        );


        dragArea.addEventListener(
            "touchmove",
            function(event) {

                if (!dragging) return;

                currentY =
                    event.touches[0].clientY;

                let diff =
                    currentY - startY;

                /*
                 * فقط اجازه حرکت به پایین
                 */
                if (diff > 0) {

                    sheet.style.transform =
                        `translateY(${diff}px)`;

                }

            },
            { passive: true }
        );


        dragArea.addEventListener(
            "touchend",
            function() {

                if (!dragging) return;

                dragging = false;

                sheet.style.transition =
                    "transform 0.38s cubic-bezier(0.22, 1, 0.36, 1)";

                const diff =
                    currentY - startY;

                /*
                 * اگر به اندازه کافی پایین کشیده شد
                 * پنل بسته شود
                 */
                if (diff > 100) {

                    sheet.style.transform =
                        "translateY(100%)";

                    setTimeout(
                        function() {
                            closeComments();
                            sheet.style.transform = "";
                        },
                        380
                    );

                } else {

                    sheet.style.transform =
                        "translateY(0)";

                }

            }
        );


        /*
         * نمونه ارسال نظر
         * بعداً به Supabase وصل می‌شود.
         */
        document
            .getElementById("commentForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();

                    const input =
                        document.getElementById(
                            "commentInput"
                        );

                    const text =
                        input.value.trim();

                    if (!text) return;

                    /*
                     * فعلاً فقط برای تست
                     */
                    console.log(
                        "Comment:",
                        text
                    );

                    input.value = "";

                }
            );


        /*
         * برای تست مستقیم:
         * با اجرای این فایل، پنل باز می‌شود.
         *
         * بعداً products.html خودش
         * openComments() را صدا می‌زند.
         */

        setTimeout(
            function() {
                openComments();
            },
            300
        );

    </script>

</body>
</html>
